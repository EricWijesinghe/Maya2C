[package]
name = "maya-ebpf-net-programs"
version = "0.1.0"
publish = false
edition = "2024"
description = "The XDP program that drops malformed, blocked and over-rate relay datagrams at the driver and redirects the rest to AF_XDP"

# Not a member of the root workspace: this builds for `bpfel-unknown-none` with
# `-Z build-std=core` on nightly, which `cargo build --workspace` cannot and
# should not attempt. The `[workspace]` table below makes it its own root, the
# same arrangement as `dashboard/`.
#
# Build, on Linux or Windows:
#   install the prebuilt bpf-linker v0.11.1 for the host from
#   https://github.com/aya-rs/bpf-linker/releases (LLVM statically linked).
#   `cargo install bpf-linker` needs a system libLLVM of rustc's exact LLVM
#   version and fails without one, on both platforms.
#   cd ebpf-net/programs && cargo build --release
#   -> target/bpfel-unknown-none/release/maya-relay-xdp
# Loading it needs Linux; WSL 2's kernel (6.18) runs the veth tests.
[workspace]

[dependencies]
# Pinned exactly: the macros decide the ELF section layout aya 0.14 loads.
aya-ebpf = "=0.2.1"
maya-ebpf-net-common = { path = "../common" }

[[bin]]
name = "maya-relay-xdp"
path = "src/main.rs"
test = false
bench = false

# Unoptimised BPF is refused by the verifier (stack use, unbounded helpers from
# unrolled iterators), so both profiles optimise, and neither may unwind.
[profile.dev]
opt-level = 3
debug = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
