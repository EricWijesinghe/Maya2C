[package]
name = "maya-ebpf-net"
version.workspace = true
# Not published. See stratum-v2/Cargo.toml for why cargo-deny needs this.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Block relay over UDP with an XDP/AF_XDP receive path: sealed chunks, bounded reassembly, and the loader for the kernel program"

[lib]
name = "maya_ebpf_net"
path = "src/lib.rs"

# Deliberately no dependency on `custom-l1-node`. A relay moves opaque block
# bytes between peers that hold a key; whether those bytes are a block is the
# node's question, answered by the same code a gossiped block reaches. That keeps
# the datagram decoder fuzzable without RocksDB or libp2p in the graph.
[dependencies]
maya-ebpf-net-common = { path = "common" }
# Relay key derivation, key ids, and chunk nonces. Already in the tree.
blake3.workspace = true
# XChaCha20-Poly1305 per chunk. The same crate the post-quantum transport seals
# frames with, so there is one AEAD implementation in the node, not two.
chacha20poly1305.workspace = true
zeroize = { workspace = true, features = ["zeroize_derive"] }
thiserror.workspace = true
# What the receive workers report with. aya already depends on it.
log = "0.4"

# The kernel path. Linux only, and behind `xdp` so a node built without it links
# neither aya nor any `unsafe` beyond what the rest of the tree already carries.
#
# No AF_XDP crate. `xsk-rs` links libxdp and `afxdp` links libbpf, both C built
# by `cc`: a C toolchain in the node's graph for a few hundred lines of ring
# arithmetic over `libc`'s own `if_xdp.h` definitions. See src/linux/xsk.rs.
[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14", optional = true, default-features = false }
libc = { version = "0.2", optional = true }

[features]
default = []
xdp = ["dep:aya", "dep:libc", "maya-ebpf-net-common/aya"]

[dev-dependencies]
proptest = "1"
