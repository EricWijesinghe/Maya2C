[package]
name = "maya-explorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Web explorer for the Maya2C chain: Leptos SSR over Axum, indexed into PostgreSQL"

[lib]
name = "maya_explorer"
path = "src/lib.rs"

[[bin]]
name = "explorer"
path = "src/main.rs"

[dependencies]
# Reused rather than redeclared: the node already defines the wire types the
# explorer displays, so depending on it keeps the two from drifting apart.
custom-l1-node = { path = ".." }

# SSR only. A hydrating build needs cargo-leptos and wasm-bindgen to produce a
# client bundle; this renders on the server and pushes updates over WebSocket.
leptos = { version = "0.8", features = ["ssr"] }

axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }

# Runtime queries, not the `query!` macros: those need a live DATABASE_URL at
# build time (or committed offline metadata), which would make the crate
# unbuildable without a database to hand.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "chrono",
    "migrate",
] }

jsonrpsee = { version = "0.26", features = ["http-client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2.0"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.30"
futures-util = "0.3"
