# Cross-region bootnodes for the EU region.
#
# See k8s/overlays/us/bootnodes.yaml for why these are external names carrying a
# /p2p/ component, and why the values below are placeholders.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: maya-seed
spec:
  template:
    spec:
      nodeSelector:
        topology.kubernetes.io/region: eu-central-1
      containers:
        - name: node
          args:
            - --genesis
            - /config/genesis.json
            - --data-dir
            - /data
            - --rpc-addr
            - 0.0.0.0:8545
            - --metrics-addr
            - 0.0.0.0:9600
            - --market-addr
            - 0.0.0.0:8546
            - --p2p-port
            - "30333"
            - --bootnode
            - /dns4/seed-0-us.p2p.example.invalid/tcp/30333/p2p/12D3KooWJEo6YrPYRXcwsWS7fESw8nFyFvZLRui4AAN7YrgtFrnm
            - --bootnode
            - /dns4/seed-0-asia.p2p.example.invalid/tcp/30333/p2p/12D3KooWNSEWcRFyRx7mwM4HnaUFNJaNzD6PzAih4o7Kqarsg6Si
