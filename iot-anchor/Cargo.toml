[package]
name = "maya-iot-anchor"
version = "0.1.0"
# Not published. See dex/Cargo.toml for why cargo-deny needs this.
publish = false
edition = "2024"
rust-version = "1.88"
description = "Device identity, telemetry batches, tamper and clone evidence for hardware-anchored sensors; no_std and heap-free"

# Every dependency is pure Rust and `no_std`: the same crate runs on a
# Cortex-M33 or ESP32-C3 and in the node. `sha3` rather than BLAKE3 because
# `fips204` already links it, and BLAKE3's C/SIMD backend would keep Kani from
# compiling the rules this crate proves.
[dependencies]
# ML-DSA-65 only — invariant 4. Seeded keygen and a caller-supplied RNG, so a
# microcontroller brings its own TRNG.
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65"] }
rand_core = { version = "0.6", default-features = false }
sha3 = { version = "0.10", default-features = false }
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"] }

[features]
default = []
# Host-side helpers that need `std`.
std = []
# Seal the device seed in a TPM 2.0 through `tpm2-tools` (Linux gateways). Off by
# default: a microcontroller has no TPM and the node has no use for one.
tpm = ["std"]

[dev-dependencies]
rand_chacha = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
