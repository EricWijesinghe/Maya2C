[package]
name = "custom-l1-node-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

# Its own workspace root, deliberately. cargo-fuzz builds with
# `-Zsanitizer=address` and a libFuzzer runtime that the rest of the tree must
# never link, and the fuzz crate needs a lockfile it can resolve on nightly
# without perturbing the one the node ships with.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
custom-l1-node = { path = ".." }
# The pool's front door. Unlike every other decoder here, these bytes arrive
# from whatever dialled the mining port rather than from a peer that already
# completed a handshake.
maya-stratum-v2 = { path = "../stratum-v2" }
# Archives of pruned blocks, read back from stores nobody has to trust: a
# local directory an attacker may have written to, an IPFS node, a gateway.
maya-archive = { path = "../archive" }
# Bank-rail XML. The only decoder here whose input arrives from outside the
# chain's own peer set entirely, and the one whose format has a documented
# history of entity-expansion and external-entity attacks.
maya-iso20022 = { path = "../iso20022" }

# Sanitizer builds are slow enough that unoptimized decoding would dominate the
# profile. Debug assertions stay on: an arithmetic overflow in a decode path is
# exactly the class of bug this is here to find, and release mode would wrap it
# silently.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "tx_decode"
path = "fuzz_targets/tx_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header_decode"
path = "fuzz_targets/header_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_decode"
path = "fuzz_targets/block_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "payload_decode"
path = "fuzz_targets/payload_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "account_decode"
path = "fuzz_targets/account_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sv2_frame_decode"
path = "fuzz_targets/sv2_frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "car_decode"
path = "fuzz_targets/car_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "iso20022_decode"
path = "fuzz_targets/iso20022_decode.rs"
test = false
doc = false
bench = false

# The seed corpus is generated by `cargo run --example gen_fuzz_corpus` in the
# node's own crate, not from here. Corpus generation has nothing to do with
# libFuzzer, and libfuzzer-sys does not build on Windows — keeping the generator
# out of this package is what lets the corpus be regenerated on any platform.
