# Advisory gate for the Tauri app manifests (apps/*/src-tauri). Each is its own
# workspace, so the root deny.toml never resolves their Cargo.lock files.
# Run by the `tauri-advisories` job in .github/workflows/security-audit.yml.

[advisories]
version = 2
ignore = [
    # GHSA-wrw7-89jp-8q8g (RUSTSEC-2024-0429): unsound Iterator impls in
    # glib::VariantStrIter. Reached only through the GTK3 bindings on Linux
    # (gtk 0.18, gtk-rs), which Tauri 2 requires. The fix is glib 0.20.0, which
    # the gtk 0.18 line cannot take. Re-check when Tauri moves off gtk-rs 0.18,
    # and remove this entry then.
    "RUSTSEC-2024-0429",
    "GHSA-wrw7-89jp-8q8g",
]
