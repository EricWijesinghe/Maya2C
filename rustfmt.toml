# rustfmt defaults, with one exclusion.
#
# `crates/fee-market/src/model/weights_v1.rs` is generated by
# `cargo run -p maya-neural-gas-trainer`, and that command's `--check` mode
# fails when the committed file differs from a fresh run. rustfmt reformatting
# it therefore breaks the drift check — which is the one thing standing between
# the compiled-in weights and a silent edit.
#
# Two ways out: teach the emitter to produce rustfmt-stable output, or keep
# rustfmt away from it. The second is honest about what the file is — machine
# output, not source — and cannot drift back.
#
# `ignore` is a nightly rustfmt option. This workspace pins nightly in
# `rust-toolchain.toml`, so that is not a new constraint.
ignore = ["crates/fee-market/src/model/weights_v1.rs"]
