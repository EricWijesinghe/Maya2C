[package]
name = "maya-sdk-ffi"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "uniffi bindings over Maya2C's post-quantum signing primitives"

[lib]
# `cdylib` is what the Python, Kotlin, and Swift bindings load at runtime.
# `lib` is kept so the crate's own tests can call the Rust API directly — a
# test that had to go through the FFI boundary to check the Rust behaviour
# would be testing the generator, not the primitives.
crate-type = ["cdylib", "lib"]
name = "maya_sdk_ffi"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
maya-crypto-pq = { path = "../crypto-pq" }
custom-l1-node = { path = ".." }
thiserror.workspace = true
hex.workspace = true

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[[bin]]
# The generator, run as `cargo run -p maya-sdk-ffi --bin uniffi-bindgen`.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
