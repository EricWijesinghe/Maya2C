[package]
name = "l1-wallet"
version = "0.1.0"
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish = false
edition = "2024"
rust-version = "1.88"

# Explicit, though cargo would auto-detect src/lib.rs: the pool service
# depends on this crate as a library, and a target that exists only by
# convention is one a future edit deletes without noticing.
[lib]
name = "l1_wallet"
path = "src/lib.rs"

[[bin]]
name = "l1-wallet"
path = "src/main.rs"

[dependencies]
custom-l1-node = { path = ".." }
clap = { version = "4", features = ["derive", "env"] }
jsonrpsee = { version = "0.26", features = ["http-client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
getrandom = "0.4"
argon2 = "0.5"
chacha20poly1305 = "0.11"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
rpassword = "7"

[dev-dependencies]
tempfile = "3"



