[package]
name = "l1-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "l1-wallet"
path = "src/main.rs"

[dependencies]
custom-l1-node = { path = ".." }
clap = { version = "4", features = ["derive", "env"] }
jsonrpsee = { version = "0.26", features = ["http-client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
getrandom = "0.4"
argon2 = "0.5"
chacha20poly1305 = "0.11"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
rpassword = "7"

[dev-dependencies]
tempfile = "3"
