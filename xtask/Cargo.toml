[package]
name = "xtask"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Workspace automation: disk accounting and the reality-ledger gate"

# Two dependencies, both already in the workspace graph. `xtask` runs on a
# developer's machine and in CI before anything else builds, so every crate
# added here is one more thing that must compile before the gate can run.
[dependencies]
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
serde_json.workspace = true
# The coin's decimals (ADR-068): the genesis floors are in whole-coin multiples of it.
maya-amount = { path = "../crates/amount" }
# verify-release, site-integrity and hub_bundle (the release miner pin) hash with sha2/hex.
# Site integrity (`site_integrity.rs`): `regex` and `base64` are already in the
# lock through other crates; `hex` and `sha2` are workspace dependencies.
regex = "1"
base64 = "0.22"
hex.workspace = true
sha2.workspace = true
# bench-report and bench-gate stamp the run date in local time. chrono is already
# in the lock through other crates; only its `clock` feature is needed here.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints]
workspace = true
