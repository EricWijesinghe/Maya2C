[package]
name = "maya-faucet"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.88"
description = "Rate-limited testnet faucet"

[dependencies]
custom-l1-node = { path = ".." }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
async-trait = "0.1"
jsonrpsee = { version = "0.26", features = ["http-client"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
