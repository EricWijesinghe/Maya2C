[package]
name = "maya-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Maya2C Hub: one desktop window for mining, the network and every app"

# Standalone, not a host workspace member, for the wallet GUI's reason:
# `tauri::generate_context!` checks the frontend at compile time.
[workspace]

[lib]
name = "maya_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "maya-hub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pins the miner binary to the release checksums (miner_guard.rs). Already in
# Cargo.lock (0.10.9), so the tree gains no new crate.
sha2 = "0.10"
# Blocking JSON-RPC to the node, run off the UI thread. The hub reaches the
# network only through these Rust commands, never from the webview.
ureq = { version = "3.4", features = ["json"] }
# In-app updates: check, ask, verify against the signing key, install. Off in
# any build without an updater config, which release CI adds only when signed.
maya-app-update = { path = "../../app-update" }
# Payout address check: text form (ADR-081) and hex, refused on another network.
maya-address = { path = "../../../crates/address" }
# Official Tauri 2 plugin for OS toasts, opt-in from Settings (ADR-073 decision 4).
# DepScout (2026-11-03): 2.8.0, no OSV advisories, not malicious, Apache-2.0 OR MIT.
tauri-plugin-notification = "2.8"
# Opens `maya2c-wallet://open` and `maya2c-chat://open` (ADR-083 decision 4).
# Scoped in capabilities/default.json to those two URLs and nothing else.
# DepScout 2026-11-10: 2.7.2, no OSV advisories, Apache-2.0 OR MIT.
tauri-plugin-opener = "=2.7.2"

[target.'cfg(unix)'.dependencies]
# Real uid for the key-file owner check (miner_guard.rs). Already in Cargo.lock
# (1.1.6, via tempfile and tauri), so no new crate; safe wrapper, no `unsafe`.
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
# DACL check on the payout key file (key_acl.rs). 0.62 matches the copy tauri
# already pulls in, so the lock gains no second `windows` crate.
# SystemInformation: the system folder for `nvidia-smi` (driver_tool.rs, ADR-137 S-8).
# UI_Shell + System_Com: the Program Files known folder a driver-tool override
# must sit under, and the call that frees its string (driver_tool.rs).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# A nested workspace inherits none of the root profiles; see
# apps/chat-gui/src-tauri/Cargo.toml for the measured disk cost of omitting this.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
