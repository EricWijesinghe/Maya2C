[package]
name = "maya-wallet-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Maya2C zero-trust wallet"

# Standalone, not a host workspace member: `tauri::generate_context!` validates
# `../ui/dist` at compile time, so including it would make `cargo test
# --workspace` fail whenever the frontend had not been built yet.
[workspace]

# Tauri's mobile targets build the app as a library and call into it from a
# platform entry point, so the logic lives in lib.rs and main.rs is a thin
# desktop shim.
[lib]
name = "maya_wallet_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "maya-wallet-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
maya-wallet-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
zeroize = "1"

[features]
# Enabled by `tauri dev` to allow devtools.
custom-protocol = ["tauri/custom-protocol"]

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
#
# A crate with its own `[workspace]` table inherits **none** of the root
# workspace's profiles. That is the whole reason this block exists: without it
# this directory builds at cargo's defaults — `debug = 2` for every crate in
# the graph, unoptimized dependencies — while the root tree builds at
# `line-tables-only` with optimized dependencies.
#
# The cost was measured on 2026-09-20. `cargo xtask disk` reported 38.6 GiB
# against a 30 GiB ceiling, and 19.5 GiB of that was nested workspaces a root
# `cargo clean` never touches. This volume has been filled to zero bytes twice.
#
# Mirrors docs/adr/ADR-003-build-profiles.md. `opt-level = 3` on dependencies
# is not tuning either: unoptimized post-quantum cryptography makes a test run
# read as hung rather than slow (docs/invariants.md, invariant 5), and a
# nested workspace hits that on its own.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
