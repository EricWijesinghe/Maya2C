[package]
name = "maya-wallet-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Leptos client-side frontend for the Maya wallet"

# Deliberately NOT a workspace member. It builds only for
# wasm32-unknown-unknown; pulling it into the host workspace would make
# `cargo test --workspace` try to compile web-sys for the host and fail.
[workspace]

[dependencies]
# Client-side rendering. The wallet is a local application, so there is no
# server to render on — and no server that could ever see a key.
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Navigator",
  "MediaDevices",
  "MediaStream",
  "MediaStreamTrack",
  "MediaStreamConstraints",
  "HtmlVideoElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "Blob",
  "FileReader",
  "Document",
  "Element",
]

[profile.release]
# The bundle ships inside the installer, so size is a shipping cost.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
#
# A crate with its own `[workspace]` table inherits **none** of the root
# workspace's profiles. That is the whole reason this block exists: without it
# this directory builds at cargo's defaults — `debug = 2` for every crate in
# the graph, unoptimized dependencies — while the root tree builds at
# `line-tables-only` with optimized dependencies.
#
# The cost was measured on 2026-09-20. `cargo xtask disk` reported 38.6 GiB
# against a 30 GiB ceiling, and 19.5 GiB of that was nested workspaces a root
# `cargo clean` never touches. This volume has been filled to zero bytes twice.
#
# Mirrors docs/adr/ADR-003-build-profiles.md. `opt-level = 3` on dependencies
# is not tuning either: unoptimized post-quantum cryptography makes a test run
# read as hung rather than slow (docs/invariants.md, invariant 5), and a
# nested workspace hits that on its own.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
