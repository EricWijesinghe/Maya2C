[package]
name = "maya-wallet-core"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Zero-trust wallet core: BIP-39, SLIP-0010, OS keychain, offline signing"

[lib]
name = "maya_wallet_core"
path = "src/lib.rs"

[dependencies]
custom-l1-node = { path = "../../../crates/node" }

# BIP-39 mnemonics. Wordlist only — seed derivation is PBKDF2 per the spec.
bip39 = { version = "2.2", default-features = false, features = ["std"] }

# The keychain backend is selected by target at compile time:
#   windows -> Credential Manager, macos/ios -> Apple Keychain,
#   android -> Android Keystore, linux -> secret-service / keyutils.
# Default features already pull in the Windows, Apple, and secret-service
# stores. The Android Keystore backend is a target-gated dependency, so it is
# selected automatically when building for Android — there is no feature to
# enable, and enabling one here would fail to resolve.
keyring = "4"

argon2.workspace = true
chacha20poly1305 = "0.11"
hmac = "0.13"
sha2.workspace = true
pbkdf2 = { version = "0.12", default-features = false }
zeroize = { workspace = true, features = ["zeroize_derive"] }
getrandom.workspace = true
hex.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# QR payloads are decoded and parsed in Rust, never in the frontend: a payment
# URI is untrusted input and parsing it in JS would put an attacker's string
# inside the trust boundary.
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

jsonrpsee = { workspace = true, features = ["http-client"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# The digest every air-gap frame carries, so a receiver can tell that two
# signings' frames have been interleaved. BLAKE3 rather than anything else
# because the node already uses it everywhere and the wallet already links it
# transitively — a second hash function here would be a second thing to review.
blake3.workspace = true
# For `CircuitTrust`, which reads `CIRCUIT_IS_AUDITED` from the crate that owns
# it rather than duplicating the flag. A wallet is where a user would meet an
# unaudited shielded circuit, so the state must not be able to drift from it.
maya-zk-stark = { path = "../../../crates/zk-stark" }
# The Receive screen's QR code, drawn as SVG so it stays sharp at any size
# and needs no image codec in the build.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
tempfile.workspace = true
# Encodes real QR images for the decode tests. A parser exercised only on
# hand-written strings has never seen the input a camera actually produces.
qrcode = "0.14"

[lints]
workspace = true
