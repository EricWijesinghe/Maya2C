[package]
name = "maya-app-update"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "In-app updates for the Maya2C desktop apps: check, ask, install, restart."
publish = false

# Standalone, like the apps that use it: they are not host workspace members
# (`tauri::generate_context!` checks their frontends at compile time), so this
# path dependency must not pull the host workspace in either.
[workspace]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.13"
tauri-plugin-dialog = "2"
# The updater plugin's own verifier and its base64; already in every app's
# lock through tauri-plugin-updater, so this pins no new code.
minisign-verify = "0.3"
base64 = "0.23"
# The publisher key fingerprint; already in every app's lock through tauri.
sha2 = "0.10"
