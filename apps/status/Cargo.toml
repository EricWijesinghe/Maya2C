[package]
name = "maya-status"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Chain uptime from block timestamps: a status page, a JSON API and halt alerts"

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tower-http = { workspace = true, features = ["cors"] }
maya-web-security = { path = "../../crates/web-security" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
primitive-types.workspace = true
jsonrpsee = { workspace = true, features = ["http-client"] }
# Incident log: SHA-256 chain, ML-DSA-65 operator signatures (as apps/chat does).
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
zeroize.workspace = true
getrandom.workspace = true
maya-crypto-pq = { path = "../../crates/crypto-pq" }
# Halt alerts to a push topic (ntfy), off unless configured.
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
