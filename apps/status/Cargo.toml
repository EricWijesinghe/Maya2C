[package]
name = "maya-status"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Chain uptime from block timestamps: a status page, a JSON API and halt alerts"

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tower-http = { workspace = true, features = ["cors"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
jsonrpsee = { workspace = true, features = ["http-client"] }
# Halt alerts to a push topic (ntfy), off unless configured.
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }

[lints]
workspace = true
