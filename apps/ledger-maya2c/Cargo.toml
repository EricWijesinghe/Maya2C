[package]
name = "app-maya2c"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.88"
description = "Ledger application for Maya2C post-quantum signatures — feasibility spike"

# Not a workspace member, for the same reason `apps/dashboard/` and
# `contracts/token-swap/` are not: this targets `thumbv8m.main-none-eabi` and
# cannot execute on the host, so it does not belong in `cargo build --workspace`
# or `cargo nextest run --workspace`.
[workspace]

[lib]
# The protocol layer — APDU codec, derivation, address — lives here so it can be
# tested on the host. That is deliberate: chunk assembly and sequence checking
# is where the bugs are, and none of it needs a device to exercise.
name = "app_maya2c"
path = "src/lib.rs"

[[bin]]
# The device binary. Only meaningful on the ARM target.
name = "app-maya2c"
path = "src/main.rs"

[features]
default = []

# Attempt SLH-DSA on-device.
#
# Off by default and gated, because it is the experiment rather than the
# product. `slh-dsa`'s own documentation says it "allocates signatures and
# intermediate values on the stack, which may cause problems for environments
# with limited stack space" — and its keygen overflowed a 1 MB stack on a
# desktop during this project's genesis ceremony work. A Ledger has kilobytes.
#
# The feature exists so the measurement can be taken, not because it is
# expected to fit.
slh-experiment = ["dep:slh-dsa"]

# rustc does not know Ledger's device `target_os` values -- they come from the
# SDK's own target JSONs, not from the built-in target list -- so every `cfg`
# naming one is an `unexpected_cfgs` warning. Declared rather than `allow`ed, so
# a typo in a device name is still caught.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("nanosplus", "stax", "flex", "nanox"))',
] }

[dependencies]
# `#![no_std]`, no heap allocations, ships an embedded example. The one
# component of this that is plausible on a Ledger.
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65"] }

# Address derivation must match the node byte for byte. `default-features =
# false` for no_std; the domain string is duplicated from
# `src/crypto/hybrid.rs` and pinned by a parity test rather than trusted.
blake3 = { version = "1.8", default-features = false }

# SLIP-0010 over the same path the desktop wallet uses.
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1", default-features = false }

slh-dsa = { version = "0.2.0-rc.5", default-features = false, optional = true }

# The Ledger SDK is only present when building for the device.
#
# The gate names the four device `target_os` values from
# `ledger_secure_sdk_sys-1.16.4/build.rs` (SPECS): `nanox` on thumbv6m, and
# `nanosplus` / `stax` / `flex` on thumbv8m.main. It is NOT `target_os = "none"`
# -- a stock `thumbv8m.main-none-eabi` build makes that build script panic with
# "Unsupported target_os: none", because Ledger builds against its own target
# JSON files rather than a stock triple.
#
# Gating this way also means `--target thumbv8m.main-none-eabi --lib` checks the
# protocol layer for ARM without needing the C SDK at all.
[target.'cfg(any(target_os = "nanosplus", target_os = "stax", target_os = "flex", target_os = "nanox"))'.dependencies]
ledger_device_sdk = "1.24"

[dev-dependencies]
hex = "0.4"

[profile.release]
# A Ledger app is flash-constrained before it is anything else.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
