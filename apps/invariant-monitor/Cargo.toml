[package]
name = "maya-invariant-monitor"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Public invariant monitor: re-derives what a third party can check from public RPC, and reports violations"

[lib]
path = "src/lib.rs"

[[bin]]
name = "maya2c-invariant-monitor"
path = "src/main.rs"

[dependencies]
# The sentinel's transport, detectors, incident layer and ntfy push: this app
# adds the checks a public endpoint allows and reuses the rest unchanged.
maya-sentinel = { path = "../sentinel" }
# MAX_BLOCK_BYTES (invariant 33) from the crate that defines it, not a copy.
maya-fee-market = { path = "../../crates/fee-market" }
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
