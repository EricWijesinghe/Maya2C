[package]
name = "maya-explorer"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Web explorer for the Maya2C chain: Leptos SSR over Axum, indexed into PostgreSQL"

[lib]
name = "maya_explorer"
path = "src/lib.rs"

[[bin]]
name = "explorer"
path = "src/main.rs"

[dependencies]
# Reused rather than redeclared: the node already defines the wire types the
# explorer displays, so depending on it keeps the two from drifting apart.
custom-l1-node = { path = "../../crates/node" }

# SSR only. A hydrating build needs cargo-leptos and wasm-bindgen to produce a
# client bundle; this renders on the server and pushes updates over WebSocket.
leptos = { workspace = true, features = ["ssr"] }

axum = { workspace = true, features = ["ws", "macros"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
# `fs` for the branding assets under /assets. The explorer server-renders its
# HTML from a Rust string, so unlike the trunk-built frontends it has no
# build-time asset validation — `tests/server_tests.rs` checks the routes
# instead.
tower-http = { workspace = true, features = ["trace", "fs"] }

# Runtime queries, not the `query!` macros: those need a live DATABASE_URL at
# build time (or committed offline metadata), which would make the crate
# unbuildable without a database to hand.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "chrono",
    "migrate",
] }

jsonrpsee = { workspace = true, features = ["http-client"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
hex.workspace = true
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite = "0.30"
futures-util.workspace = true

[lints]
workspace = true
