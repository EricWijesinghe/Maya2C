apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maya-us

resources:
  - ../../base
  # Supplies the `maya-retain` StorageClass over the EBS CSI driver. The base
  # cannot carry it: the provisioner name is cloud-specific.
  - ../../storage/aws

patches:
  - path: bootnodes.yaml

  - target:
      kind: Ingress
      name: maya-rpc
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: rpc-us.example.invalid
      - op: replace
        path: /spec/tls/0/hosts/0
        value: rpc-us.example.invalid
  # Same host as the RPC Ingress; a separate object only so the two can carry
  # different rate limits.
  - target:
      kind: Ingress
      name: maya-market
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: rpc-us.example.invalid
      - op: replace
        path: /spec/tls/0/hosts/0
        value: rpc-us.example.invalid

  # Per-seed p2p endpoints. These hostnames are what the other two regions'
  # bootnode multiaddrs are written against, so they must agree with
  # overlays/*/bootnodes.yaml exactly.
  - target:
      kind: Service
      name: maya-seed-p2p-0
    patch: |-
      - op: replace
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname
        value: seed-0-us.p2p.example.invalid
  - target:
      kind: Service
      name: maya-seed-p2p-1
    patch: |-
      - op: replace
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname
        value: seed-1-us.p2p.example.invalid
  - target:
      kind: Service
      name: maya-seed-p2p-2
    patch: |-
      - op: replace
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname
        value: seed-2-us.p2p.example.invalid
