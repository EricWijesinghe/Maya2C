# Prometheus Operator scrape configuration and alerts for the pool.
#
# Requires the Prometheus Operator CRDs, so `kubectl apply --dry-run=client`
# can only validate these as YAML — the same limitation `infra/k8s/base/` notes for
# the node's own rules.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: maya-pool
  labels:
    app.kubernetes.io/name: maya-pool
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: maya-pool
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      # Comfortably longer than the daemon's five-second gauge resampling, so
      # no scrape reads a sample it has already seen.
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: maya-pool
  labels:
    app.kubernetes.io/name: maya-pool
spec:
  groups:
    - name: maya-pool
      rules:
        # The one to page on. This chain mints no block reward, so every payout
        # comes out of an account the operator funds and nothing refills it
        # automatically. An empty treasury does not degrade the pool — shares
        # keep being credited — it stops miners being paid, silently, until
        # someone notices.
        - alert: MayaPoolTreasuryLow
          expr: maya_pool_treasury_balance < maya_pool_unpaid_balance
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "The treasury cannot cover what the pool owes"
            description: >-
              Payouts will start failing, and the failures are not retried:
              an unfunded treasury is a policy condition, not a transient one.
              Fund the account or lower reward_per_block.

        # Queue depth, not connection count. docs/stratum-v2.md §4 is explicit
        # that 50,000 connections is unremarkable and that share validation is
        # the wall: each share is a 25 ms Argon2id pass below the DAG fork.
        - alert: MayaPoolValidationSaturated
          expr: maya_pool_validation_queue_depth > 1024
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Share validation is falling behind"
            description: >-
              The pool is shedding load by raising targets
              (maya_pool_vardiff_pressure_retunes_total will be rising with
              this). Sustained saturation means more validator capacity, not a
              deeper queue — a queue this deep is already holding shares whose
              jobs will be stale before they are verified.

        # A batch that stays open is a miner who is not being paid. It does not
        # clear on its own: either the transaction is not landing or the
        # treasury refused, and both need a person.
        - alert: MayaPoolPayoutStuck
          expr: maya_pool_payout_batches_open > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "A payout batch has been open for thirty minutes"
            description: >-
              Check maya_pool_payouts_refused_total first: a refusal is a
              policy or custody condition (unfunded, over a cap) and is
              deliberately never retried automatically.

        # Alerting on the ratio rather than the count, because the count rises
        # with the pool. Rising staleness is usually the pool's job-push
        # latency rather than the miners' rigs, which is why the job-push
        # histogram is the first place to look.
        - alert: MayaPoolStaleShareRate
          expr: |
            sum(rate(maya_pool_shares_rejected_total{reason="stale-share"}[10m]))
              /
            clamp_min(sum(rate(maya_pool_shares_accepted_total[10m])), 0.001)
              > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Over 5% of shares are arriving stale"
            description: >-
              At a 15-second block target a job goes stale fast. Check
              histogram_quantile(0.95,
              rate(maya_pool_job_push_duration_seconds_bucket[10m])) — if push
              is above a few hundred milliseconds this is the pool's latency
              being billed to miners.

        # Two conditions, and both are needed. A pool with hashpower that finds
        # no blocks is either unlucky or submitting blocks the chain rejects;
        # a pool with no hashpower has nothing wrong with it that this alert
        # could describe.
        - alert: MayaPoolNoBlocks
          expr: |
            increase(maya_pool_blocks_found_total[6h]) == 0
              and
            rate(maya_pool_shares_accepted_total[1h]) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Shares are being credited but no block has been found in six hours"
            description: >-
              Expected occasionally — block discovery is a Poisson process. If
              it repeats, check that submitted blocks are being accepted rather
              than refused; the pool logs a refusal in full.

        # Orphans are normal at low rates and are the one failure that costs
        # the pool nothing and the miners everything: their credits are
        # reversed. A sustained rate means the pool's view of the tip is behind.
        - alert: MayaPoolHighOrphanRate
          expr: |
            increase(maya_pool_blocks_orphaned_total[24h])
              /
            clamp_min(increase(maya_pool_blocks_found_total[24h]), 1)
              > 0.1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Over 10% of found blocks were orphaned in the last day"
            description: >-
              The pool is building on a tip the network is not converging on.
              Check the node's peer count and block-import latency.

        # A pool with no miners is not necessarily broken, but it is never
        # what the operator intended.
        - alert: MayaPoolNoMiners
          expr: maya_pool_channels_open == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No mining channels are open"
