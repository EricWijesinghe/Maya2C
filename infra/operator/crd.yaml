# MayaNetwork: one set of Maya2C nodes the operator installs, restores and
# upgrades (Master Prompt 19 §1). infra/operator/README.md explains the fields.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mayanetworks.maya2c.io
spec:
  group: maya2c.io
  scope: Namespaced
  names:
    plural: mayanetworks
    singular: mayanetwork
    kind: MayaNetwork
    shortNames: [mnet]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Replicas, type: integer, jsonPath: .spec.replicas}
        - {name: Image, type: string, jsonPath: .spec.image}
        - {name: Phase, type: string, jsonPath: .status.phase}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [replicas, image, genesisConfigMap]
              properties:
                replicas: {type: integer, minimum: 1, maximum: 64}
                image: {type: string}
                genesisConfigMap: {type: string, description: "ConfigMap holding genesis.json"}
                minerOrdinal:
                  type: integer
                  description: "Proof-of-work devnets only: the replica that mines. Omit on DAG-BFT."
                snapshotInterval: {type: integer, minimum: 1, default: 10}
                pruneDepth: {type: integer, minimum: 1, default: 10}
                healthTimeoutSeconds: {type: integer, minimum: 10, default: 300}
                restore:
                  type: object
                  description: "Rebuild one replica from a peer's snapshot. Change `generation` to run it again."
                  properties:
                    replica: {type: integer, minimum: 1}
                    generation: {type: integer}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
