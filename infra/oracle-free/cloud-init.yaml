#cloud-config
#
# First boot of a Maya2C testnet seed on OCI. Rendered by Terraform's
# templatefile(), so a literal dollar-brace for the shell is written doubled.
#
# This file only provisions. Installing the node is the job of
# infra/testnet-vm/install.sh, which is provider-agnostic and is also what a
# home PC runs to join. One installer, not two that drift apart.
#
# It builds from source at a pinned commit rather than downloading a binary:
# no release has been published, and building here means the VM runs exactly
# the tree that commit names. The validator key and the funded wallet are
# generated by install.sh on this VM and never pass through Terraform state.

package_update: true
packages:
  - git
  - ca-certificates

write_files:
  - path: /usr/local/sbin/maya2c-provision
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      commit='${git_commit}'
      src=/opt/maya2c/src

      # No firewall here: install.sh builds its own MAYA2C-IN chain and jumps
      # to it at INPUT position 1, above the REJECT that Oracle's Ubuntu images
      # ship. Two scripts editing iptables would be two sources of truth.

      # Fetch exactly one commit and prove that is what was checked out.
      if [ ! -d "$src/.git" ]; then
          install -d -m 0755 "$src"
          git -C "$src" init -q
          git -C "$src" remote add origin https://github.com/EricWijesinghe/Maya2C.git
      fi
      git -C "$src" fetch -q --depth 1 origin "$commit"
      git -C "$src" checkout -q --detach FETCH_HEAD
      head=$(git -C "$src" rev-parse HEAD)
      if [ "$head" != "$commit" ]; then
          echo "maya2c-provision: checked out $head, expected $commit" >&2
          exit 1
      fi

      cd "$src"
      VALIDATORS=1 CHAIN_ID='${chain_id}' DOMAIN='${domain}' EMAIL='${acme_email}' \
          infra/testnet-vm/install.sh

runcmd:
  # The first build takes a long while on four Ampere cores; the log is where
  # to watch it (`sudo tail -f /var/log/maya2c-provision.log`).
  - [sh, -c, "/usr/local/sbin/maya2c-provision >> /var/log/maya2c-provision.log 2>&1"]
