[package]
name = "maya-ebpf-net-common"
version.workspace = true
# Not published. See crates/stratum-v2/Cargo.toml for why cargo-deny needs this.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "What the XDP program and user space agree on byte for byte: the relay header, the token bucket, the verdict, and the map records"

[lib]
name = "maya_ebpf_net_common"
path = "src/lib.rs"

# No `std` and no dependencies. This crate compiles twice: for the host, where
# its tests run, and for `bpfel-unknown-none`, where the kernel's verifier has
# to accept every function the XDP program calls. A dependency would have to
# survive the verifier too, and nothing on crates.io promises that.
[dependencies]

# `aya::Pod` for the map records, so user space can read and write the same
# structs the kernel does. Linux only: aya links nothing on any other platform.
[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14", optional = true, default-features = false }

[features]
default = []
aya = ["dep:aya"]

[lints]
workspace = true
