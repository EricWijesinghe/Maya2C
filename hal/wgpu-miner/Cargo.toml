[package]
name = "maya-wgpu-miner"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Cross-platform GPU hashimoto mining via wgpu and WGSL"

[features]
# GPU off by default, exactly as `cuda-miner`'s `cuda` feature is, and for the
# same reason: `cargo build --workspace` must stay green on a runner with no
# adapter and no graphics driver. With no feature selected this crate compiles
# to the host-side pipeline and the CPU reference, which is what the parity
# tests need anyway.
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
custom-l1-node = { path = "../../crates/node" }
crossbeam-channel = "0.5"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
clap = { workspace = true, features = ["derive", "env"] }
thiserror.workspace = true
hex.workspace = true
# The hash-rate meter and the reporter that posts it. `default-features = false`
# keeps the collector's web framework out of a miner that never serves — the
# crate is split into `server` and `client` halves for exactly this.
maya-telemetry = { path = "../../crates/telemetry", default-features = false, features = ["client"] }

wgpu = { version = "27", optional = true }
# wgpu's API is async; the miner's control loop is not. `pollster` blocks on the
# handful of setup futures rather than making adapter enumeration infect every
# caller with async.
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[[bin]]
name = "wgpu-miner"
path = "src/main.rs"

[lints]
workspace = true
