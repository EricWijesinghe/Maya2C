[package]
name = "maya-bci-sim"
version.workspace = true
# Not published. See crates/dex/Cargo.toml for why cargo-deny needs this.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "SIM: EEG/BCI authentication research simulator - EDF parser, spectral template, SSVEP liveness, over maya-personhood's fuzzy commitment"

[dependencies]
maya-personhood = { path = "../../crates/personhood" }
