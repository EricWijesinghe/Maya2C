[package]
name = "maya-telemetry"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Network telemetry collector: propagation, peers, hash rate, height"

[features]
# The collector daemon. Default, because that is what this crate is usually
# built for.
default = ["server"]
server = ["dep:axum", "dep:tower-http", "dep:tracing-subscriber", "dep:futures-util", "dep:tokio"]
# The miner-side reporter. Split out so `wgpu-miner` and `cuda-miner` can post
# a hash rate without linking a web framework they never serve from — the same
# reason `stratum-v2` has no chain dependency.
client = ["dep:hyper", "dep:hyper-util", "dep:tokio"]

[dependencies]
# Always present: the wire types, the region rules, and the meter. All three
# are needed by both halves, and the meter is the reason a miner links this
# crate at all.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Optional so that the wire types, the region rules, and the meter compile for
# `wasm32-unknown-unknown` — the browser dashboard deserializes `Snapshot` from
# this crate rather than from a hand-written copy, and tokio does not build for
# that target with a multi-thread runtime.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }

axum = { workspace = true, features = ["macros", "ws"], optional = true }
tower-http = { workspace = true, features = ["trace", "limit", "cors"], optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
futures-util = { workspace = true, optional = true }

# Hyper directly rather than a client crate: the workspace already links it
# through jsonrpsee, so the miner-side reporter costs no new dependency. The
# same reasoning as `src/metrics/server.rs`.
hyper = { workspace = true, features = ["client", "http1"], optional = true }
hyper-util = { workspace = true, features = ["client", "client-legacy", "http1", "tokio"], optional = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true

# The crate's own tests exercise both halves, which is the point of them
# sharing a crate: a wire-format change that breaks the miner breaks a test
# here rather than in production.
maya-telemetry = { path = ".", features = ["server", "client"] }
# The end-to-end test drives the collector over a real socket, so it needs the
# client half of hyper unconditionally — the optional deps above are only
# enabled by the `client` feature, which a dev-dependency on self does enable,
# but naming them here keeps the test honest about what it uses.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client", "client-legacy", "http1", "tokio"] }

# The daemon is the server half. Declared with `required-features` so that
# `--no-default-features` (which is how the browser dashboard depends on this
# crate) does not try to build a binary whose whole body is behind a feature.
[[bin]]
name = "maya-telemetry"
path = "src/main.rs"
required-features = ["server"]

[lib]
name = "maya_telemetry"
path = "src/lib.rs"

[lints]
workspace = true
