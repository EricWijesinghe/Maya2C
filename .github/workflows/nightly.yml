# The jobs that are too slow, too large, or too machine-specific to gate a
# pull request.
#
# Everything here is allowed to take an hour. Nothing here blocks a merge —
# when one of these fails it is a finding to act on, not a branch to unblock.
# `ci.yml` is the gate.
name: nightly

on:
  schedule:
    # 03:00 UTC. Far enough from the top of the hour that the runner queue is
    # not competing with everybody else's cron.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------
  # frontier tier: the cross targets a PR job does not build.
  #
  # None of these run any code. They check that the crates whose whole
  # purpose is to work without an operating system still do - a dependency
  # added in a PR that pulls in `std` breaks here and nowhere else.
  # ---------------------------------------------------------------------
  frontier:
    name: frontier targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # .cargo/config.toml links through clang + mold on Linux; a runner
      # without mold fails at the first build script.
      - name: Install mold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold clang
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-15
          targets: wasm32-unknown-unknown,thumbv8m.main-none-eabihf,riscv32imc-unknown-none-elf
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: frontier

      - name: no_std device targets
        run: |
          cargo build -p maya-iot-anchor --target thumbv8m.main-none-eabihf --no-default-features
          cargo build -p maya-iot-anchor --target riscv32imc-unknown-none-elf --no-default-features
          cargo build -p maya-ebpf-net-common --target thumbv8m.main-none-eabihf --no-default-features

      - name: wasm targets
        run: |
          cargo build -p maya-sdk-wasm --target wasm32-unknown-unknown
          cargo build -p maya-telemetry --target wasm32-unknown-unknown --no-default-features

      # Hardware features that no runner can exercise, built so they cannot
      # rot. `cuda` is left out: it needs a toolkit, not just a target.
      - name: Hardware features compile
        run: |
          cargo check -p maya-wgpu-miner --features gpu
          cargo check -p maya-ebpf-net --features xdp

      # RESEARCH behind a feature, so the default workspace run compiles its
      # tests to nothing. Run here, not merely checked: the known-answer test
      # pins the port to the authors' reference, and a check would not.
      - name: Threshold Raccoon (threshold-lattice)
        run: cargo test -p maya-custody-mpc --features threshold-lattice

      # The PR run checks 192 schedules per committee; the indirect-commit bug
      # it exists to catch took ~6,000 random cases to reach, so the deep
      # search runs here. The two hand-built DAGs pin that case on every PR.
      - name: DAG-BFT adversarial schedules (deep)
        env:
          MAYA_SCHEDULE_CASES: "10000"
        run: cargo test -p maya-dag-bft --release --test adversarial_schedules

  # ---------------------------------------------------------------------
  # Fuzzing. The decoders of untrusted input, from a persisted corpus.
  # ---------------------------------------------------------------------
  fuzz:
    name: fuzz / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One runner per target, so each gets its full budget. The list is
      # static because a matrix cannot be read from `cargo fuzz list`; add a
      # target here when a fuzz_targets/*.rs file is added there.
      fail-fast: false
      # 31 targets x 10 minutes is 310 minutes of fuzzing. Eight at a time
      # keeps the whole sweep near 40 to 50 minutes of wall clock.
      max-parallel: 8
      matrix:
        target:
          - tx_decode
          - header_decode
          - block_decode
          - block_sync_response
          - payload_decode
          - account_decode
          - sv2_frame_decode
          - car_decode
          - iso20022_decode
          - htlc_lattice_decode
          - stateless_witness_decode
          - radio_frame_decode
          - did_decode
          - xdp_relay_decode
          - iot_anchor_decode
          - threat_evidence_decode
          - dex_payload_decode
          - oracle_payload_decode
          - governance_payload_decode
          - identity_payload_decode
          - rwa_payload_decode
          - rwa_record_decode
          - sealed_payload_decode
          - pow_target
          - payment_uri_decode
          - address_decode
          - faucet_request_decode
          - pool_identity_decode
          - explorer_route_decode
          - chat_envelope_decode
          - status_input_decode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config mold
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-15
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          key: fuzz
      - uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422 # cargo-fuzz
        with:
          tool: cargo-fuzz

      # Ten minutes a target, each on its own runner. Persisted corpus is read
      # from fuzz/corpus; new inputs stay on the runner, and a crash is
      # uploaded below rather than lost with it.
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        # The host target, stated: cargo-fuzz picked musl, which this
        # toolchain does not have (E0463 on every target, 2026-10-18).
        run: |
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            -- \
            -max_total_time=600 \
            -max_len=65536 \
            -rss_limit_mb=4096 \
            -timeout=5 \
            -print_final_stats=1

      # Only on failure: a crash, OOM or timeout is the finding. The reproducer
      # is kept 90 days so it can be replayed locally with `cargo fuzz run`.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 90

  # ---------------------------------------------------------------------
  # Formal verification. Kani on the dependency-free arithmetic crates -
  # which is why they are dependency-free (invariants 1, 6, 12).
  # ---------------------------------------------------------------------
  # One runner per crate. With 256-bit amounts (ADR-046/068) the six crates
  # in one 90-minute job never finished: every nightly from 10-19 to 11-08
  # was cancelled at the limit or failed. Each crate now has the budget
  # kani-heavy.yml uses, under GitHub's 360-minute cap.
  kani:
    name: kani ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        package:
          - maya-ledger-math
          - maya-governance
          - maya-fee-market
          - maya-threat-intel
          - maya-iot-anchor
          - maya-htlc-lattice
          - maya-dex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # .cargo/config.toml links through clang + mold on Linux; a runner
      # without mold fails at the first build script.
      - name: Install mold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold clang
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-15
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: kani
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      # Harnesses in a crate's heavy list run only in kani-heavy.yml (one
      # runner each). Guard: every heavy name must exist, so a rename cannot
      # drop a proof from both workflows.
      - name: Proofs
        if: matrix.package != 'maya-dex'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            maya-fee-market) heavy="a_split_conserves_every_unit the_base_fee_respects_its_floor_and_its_step a_rise_is_one_denominator_share_and_stops_at_the_ceiling" ;;
            *) heavy="" ;;
          esac
          if [ -z "$heavy" ]; then
            cargo kani -p "$PACKAGE"
            exit 0
          fi
          file="crates/${PACKAGE#maya-}/src/proofs.rs"
          for h in $heavy; do
            grep -q "^fn $h()" "$file" || { echo "no harness $h in $file"; exit 1; }
          done
          names=$(grep -A8 '#\[kani::proof\]' "$file" | sed -n 's/^fn \([a-z0-9_]*\)().*/\1/p' | sort -u)
          total=$(grep -c '#\[kani::proof\]' "$file")
          [ "$(echo "$names" | wc -l)" -eq "$total" ] || { echo "found $(echo "$names" | wc -l) harness names for $total #[kani::proof] in $file"; exit 1; }
          for h in $names; do
            case " $heavy " in *" $h "*) continue ;; esac
            cargo kani -p "$PACKAGE" --harness "proofs::$h" --exact
          done

      # maya-dex is run per harness. Its two heavy harnesses (CBMC needs
      # more than this runner's budget within 90 minutes) run in
      # kani-heavy.yml. Guard: the lists must cover every #[kani::proof] in
      # the file, so a new harness cannot be silently skipped.
      - name: Dex proofs (light)
        if: matrix.package == 'maya-dex'
        run: |
          set -euo pipefail
          file=crates/dex/src/proofs.rs
          light=(
            mul_div_floor_and_ceil_bracket_the_true_quotient
            mul_div_rounding_differs_by_at_most_one
            isqrt_is_the_floor_of_the_real_root
            a_swap_never_decreases_the_invariant
            a_swap_conserves_both_sides
            a_redemption_does_not_lower_the_share_price
            the_locked_minimum_is_never_redeemable
            a_deposit_does_not_dilute
            exact_out_never_undercharges_base_to_quote
            exact_out_never_undercharges_quote_to_base
          )
          heavy=(a_swap_leaves_both_reserves_non_empty a_one_sided_exit_keeps_the_price_usable)
          total=$(grep -c '#\[kani::proof\]' "$file")
          if [ "$total" -ne $(( ${#light[@]} + ${#heavy[@]} )) ]; then
            echo "dex has $total #[kani::proof] harnesses; light+heavy lists name $(( ${#light[@]} + ${#heavy[@]} )). Update the split."
            exit 1
          fi
          for h in "${light[@]}" "${heavy[@]}"; do
            grep -q "^fn $h()" "$file" || { echo "no harness $h in $file"; exit 1; }
          done
          for h in "${light[@]}"; do
            cargo kani -p maya-dex --harness "$h"
          done

  # ---------------------------------------------------------------------
  # Coverage against the 80% floor, and documentation coverage against 90%.
  # ---------------------------------------------------------------------
  coverage:
    name: coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config mold
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-15
          components: llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage
      - uses: taiki-e/install-action@be76f545a6a2f94fb131c5bb748ebed32edb5760 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      - name: Test coverage
        run: cargo llvm-cov --workspace --summary-only

      - name: Documentation coverage
        run: bash scripts/doc_coverage.sh --check

  # ---------------------------------------------------------------------
  # Lint debt. `clippy::pedantic` is `warn`, not `deny` (ADR-003), which
  # means the count can grow without anything noticing. This is what
  # notices. Not in ci.yml: each distinct set of clippy flags is a distinct
  # fingerprint, so this is a third full clippy pass, and debt growth does
  # not need to block a pull request.
  # ---------------------------------------------------------------------
  lint-debt:
    name: clippy debt ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config mold
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-15
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: lint-debt

      # Fails if the count is above lint-debt.txt. It may go down freely.
      - name: Ratchet
        run: bash scripts/lint_debt.sh --check

  # ---------------------------------------------------------------------
  # The deployment rehearsed on one runner: four maya2c-node validators as
  # processes over libp2p, a transfer, one validator killed and restarted.
  # Nightly, not per pull request: it builds release-shaped binaries and runs
  # them for real, which is the point and also the cost.
  # ---------------------------------------------------------------------
  localnet:
    name: four-validator localnet
    runs-on: ubuntu-latest
    # Measured 2026-11-09: localnet 18 min, SDKs 15 min, then the crash test
    # compiles ~7 min before its 1,000 runs; 45 minutes cut it off mid-run.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config mold
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-15
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: localnet
      - name: Localnet
        run: cargo xtask localnet
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22"
      - name: Python and Go SDKs against a devnet
        run: cargo xtask sdk-e2e --lang python && cargo xtask sdk-e2e --lang go
      - name: kill -9 during commit, 1,000 runs
        run: cargo test -p custom-l1-node --test crash_consistency_tests -- --nocapture
        env:
          CRASH_RUNS: "1000"
      - name: Node logs on failure
        if: failure()
        run: tail -n 60 target/localnet/v*/node.log

  # ---------------------------------------------------------------------
  # Performance regression gate (Master Prompt 12 §5). A 5 % threshold is
  # below the run-to-run noise of a shared GitHub runner, so this job runs
  # only on a fixed-spec self-hosted runner named by the repository variable
  # BENCH_RUNNER, and is skipped while none is registered. Its spec is
  # recorded in reports/12-performance.md; history is benchmarks/history.csv.
  # ---------------------------------------------------------------------
  bench-gate:
    name: performance regression gate
    if: vars.BENCH_RUNNER != ''
    runs-on: ${{ vars.BENCH_RUNNER }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # .cargo/config.toml links through clang + mold on Linux; a runner
      # without mold fails at the first build script.
      - name: Install mold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold clang
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-15
      - name: Tracked benchmarks
        run: |
          cargo bench -p maya-parallel-exec --bench speedup > speedup.log
          cargo bench -p custom-l1-node --bench apply_pipeline > apply.log
      - name: Gate
        run: cargo xtask bench-gate --runner "${{ vars.BENCH_RUNNER }}" speedup.log apply.log
