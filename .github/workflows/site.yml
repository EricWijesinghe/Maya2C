# Publishes docs/site (the Astro site) to GitHub Pages at https://maya2c.dev.
#
# GitHub Pages rather than a separate host: the repository is public, so Pages
# is free and needs no second account holding a deploy credential. The custom
# domain comes from docs/site/public/CNAME; DNS for maya2c.dev points at
# GitHub's Pages addresses.
#
# Runs on changes to the site or to docs/, because ingest.mjs copies docs/*.md
# into the site: a docs edit that never redeploys is a stale site nobody notices.
name: site

on:
  push:
    branches: [master]
    paths: ["docs/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Tells Bing and the other IndexNow engines that the site changed, so a new
  # page is crawled within minutes rather than whenever a crawler next
  # visits. The key file is docs/site/public/3d5c270e3fe84f42aff2c1a4ca22542a.txt.
  # A failed ping costs freshness, never the deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Submit the sitemap's URLs
        continue-on-error: true
        run: |
          set -euo pipefail
          site=https://maya2c.dev
          key=3d5c270e3fe84f42aff2c1a4ca22542a
          urls=$(curl -fsS "$site/sitemap-index.xml" | grep -oE "$site/[^<]+\.xml" \
            | xargs -n1 curl -fsS | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g')
          jq -n --arg host maya2c.dev --arg key "$key" --arg loc "$site/$key.txt" \
            --argjson list "$(printf '%s\n' $urls | jq -R . | jq -s .)" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $list}' > body.json
          echo "submitting $(jq '.urlList | length' body.json) URLs"
          curl -fsS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST \
            https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data-binary @body.json
