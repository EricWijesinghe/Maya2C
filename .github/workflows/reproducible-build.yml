# Builds the production node twice, from two checkouts in different
# directories with two different cargo homes, and fails unless the binaries
# are byte-identical. ADR-054's check that a published Linux binary matches its
# source; scripts/repro_build.sh is the one build both runs and the release use.
#
# Not a required check: two fat-LTO builds take most of an hour. It runs when
# something that changes the build changes, weekly against toolchain drift on
# the runner image, and by hand.
name: reproducible-build

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - .cargo/**
      - rust-toolchain.toml
      - scripts/repro_build.sh
      - .github/workflows/reproducible-build.yml

permissions:
  contents: read

jobs:
  twice:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: a

      # Two release target/ trees do not fit beside the preinstalled SDKs.
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1

      - name: Build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang mold

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-09-29
        with:
          toolchain: nightly-2026-07-15
          targets: ${{ env.TARGET }}

      - name: Build A
        working-directory: a
        run: |
          echo "A=$(bash scripts/repro_build.sh "$TARGET")" >> "$GITHUB_ENV"
          cp "target/$TARGET/release/maya2c-node" "$RUNNER_TEMP/maya2c-node.a"
          rm -rf target

      # Different depth, different name, different cargo home: every path the
      # first build could have leaked differs here.
      - name: Build B
        run: |
          b="$RUNNER_TEMP/elsewhere/deeper/maya2c-b"
          mkdir -p "$(dirname "$b")" && cp -a a "$b"
          cd "$b"
          echo "B=$(CARGO_HOME="$RUNNER_TEMP/cargo-b" bash scripts/repro_build.sh "$TARGET")" >> "$GITHUB_ENV"
          cp "target/$TARGET/release/maya2c-node" "$RUNNER_TEMP/maya2c-node.b"

      - name: Compare
        run: |
          echo "A $A"
          echo "B $B"
          if [ "$A" != "$B" ]; then
            ls -l "$RUNNER_TEMP"/maya2c-node.?
            cmp -l "$RUNNER_TEMP/maya2c-node.a" "$RUNNER_TEMP/maya2c-node.b" | wc -l
            echo "::error::two builds of the same commit differ"
            exit 1
          fi
          echo "### Reproducible: \`$A\`" >> "$GITHUB_STEP_SUMMARY"

      # On a mismatch, both binaries for diffoscope.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mismatch
          path: ${{ runner.temp }}/maya2c-node.?
