# Static guards for the installer, deploy and infra hardening
# (scripts/check-infra-hardening.sh). Reads tracked files only: no build,
# no network, no secret. Runs on pull requests that touch those files.
name: infra-hardening

on:
  pull_request:
    paths:
      - scripts/check-infra-hardening.sh
      - scripts/deploy-production.sh
      - scripts/attacknet-lab.ps1
      - infra/**
      - .github/workflows/infra-hardening.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: infra hardening guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run static guards
        run: bash scripts/check-infra-hardening.sh
