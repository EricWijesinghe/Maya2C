# The Go and Python SDK unit tests. Before this file, nothing in CI ran them:
# ci.yml is Rust-only, and nightly.yml runs the SDKs only against a live devnet.
# The live-node tests skip here (no MAYA_RPC_URL / L1_WALLET in the env).
name: sdks

on:
  push:
    branches: ["master", "main"]
    paths:
      - "sdks/**"
      - ".github/workflows/sdks.yml"
  pull_request:
    paths:
      - "sdks/**"
      - ".github/workflows/sdks.yml"

permissions:
  contents: read

concurrency:
  group: sdks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22"
      - name: go test
        run: go test ./...

  python:
    name: Python SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: unittest
        run: python -m unittest discover -s tests
