# The Go, Python and C++ SDK unit tests. Before this file, nothing in CI ran them:
# ci.yml is Rust-only, and nightly.yml runs the SDKs only against a live devnet.
# The live-node tests skip here (no MAYA_RPC_URL / L1_WALLET in the env).
name: sdks

on:
  push:
    branches: ["master", "main"]
    paths:
      - "sdks/**"
      - ".github/workflows/sdks.yml"
  pull_request:
    paths:
      - "sdks/**"
      - ".github/workflows/sdks.yml"

permissions:
  contents: read

concurrency:
  group: sdks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22"
      - name: go test
        run: go test ./...

  python:
    name: Python SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: unittest
        run: python -m unittest discover -s tests

  # The C++ SDK over sdk-ffi (P-43). sdk-ffi links custom-l1-node, so this
  # builds the node's dependency graph (RocksDB included) before CMake runs.
  # Dev profile: release is fat LTO, and the workspace already optimises
  # every dependency at opt-level 3 in dev ([profile.dev.package."*"]).
  cpp:
    name: C++ SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # .cargo/config.toml links through clang + mold on Linux.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev llvm-dev libssl-dev pkg-config mold cmake libgtest-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-15
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: sdk-cpp
      - name: Build sdk-ffi (cdylib)
        run: cargo build -p maya-sdk-ffi --lib
      - name: Configure
        run: cmake -S sdks/sdk-cpp -B build/sdk-cpp -DMAYA_SDK_FFI_DIR="$GITHUB_WORKSPACE/target/debug"
      - name: Build
        run: cmake --build build/sdk-cpp -j 4
      - name: ctest
        run: ctest --test-dir build/sdk-cpp --output-on-failure
