# The gate every change passes.
#
# Until this file existed there was no fmt, clippy, test or supply-chain job at
# all: the five workflows in this directory each cover one subsystem, and
# nothing ran `cargo test --workspace`.
#
# Ordered cheapest first, so a missing test in features.toml fails in seconds
# rather than after a forty-minute build.
name: ci

on:
  push:
    branches: ["master", "main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------
  # Seconds. Needs no build, so it runs first and alone.
  # ---------------------------------------------------------------------
  ledger:
    name: reality ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask

      # Fails when an entry in features.toml claims `working` or `verified`
      # and names no test that exists. It does not run the tests; the `test`
      # job does that.
      - name: features.toml
        run: cargo xtask coverage

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
          components: rustfmt
      - run: cargo fmt --all --check

  # ---------------------------------------------------------------------
  # Lints. `clippy::pedantic` is `warn` in [workspace.lints], deliberately:
  # see ADR-003. What is *denied* here is the narrow set worth blocking a
  # merge over.
  # ---------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config mold
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      # `unwrap()` in shipped code. Scoped to --lib --bins because a manifest
      # lint table cannot tell a test from a library — `#[cfg(test)]` code is
      # compiled into the same crate, and unwrapping in a test is how a test
      # reports a failure. `--lib --bins` does not enable `cfg(test)`, so this
      # sees only code that ships.
      #
      # Measured at the commit that added this file: 457 `unwrap()` warnings
      # across the workspace, and **zero** of them in --lib --bins. This gate
      # passes today and is here to keep it that way.
      #
      # `expect_used` is deliberately not denied: 73 in shipped code, and an
      # `expect("...")` that names the invariant it relies on is a different
      # thing from a bare `unwrap()`. Tracked in PROGRESS.md.
      - name: No unwrap in libraries or binaries
        run: cargo clippy --profile ci --workspace --lib --bins -- -D clippy::unwrap_used

      # Everything else, including tests and benches.
      #
      # `pedantic` is allowed here and `warn` in [workspace.lints]: 1,889
      # warnings when it was switched on, dominated by cast_possible_truncation
      # (607) and doc_markdown (308). Denying that today would mean either a
      # 1,889-warning cleanup inside a foundation change, or a gate that no
      # branch can pass. It is visible in every local `cargo clippy` and is
      # tracked as debt, which is the honest state.
      #
      # `unwrap_used` is allowed here because the step above already covers the
      # code where it matters.
      - name: Everything else must be clean
        run: |
          cargo clippy --profile ci --workspace --all-targets -- \
            -A clippy::pedantic \
            -A clippy::unwrap_used \
            -D warnings

  # ---------------------------------------------------------------------
  # Tests, core tier.
  # ---------------------------------------------------------------------
  test:
    name: nextest (core)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config mold
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
      - uses: Swatinem/rust-cache@v2
        with:
          key: nextest
      - uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --cargo-profile ci --workspace --no-fail-fast

      # Artifact size is a standing problem on this project: the development
      # volume has been filled to zero bytes twice, and a full disk reports as
      # `os error 112`. 30 GiB is the budget.
      - name: Build artifact size
        if: always()
        run: cargo xtask disk --check

  # ---------------------------------------------------------------------
  # Supply chain. Separate job so an advisory does not hide a test failure.
  # ---------------------------------------------------------------------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # `bans` is checked but not enforced as a failure: 110 duplicate
          # version groups are transitive and outside this tree's control -
          # sha3 arrives at three majors through fips204 and hqc-kem alone.
          # First-party duplication is what [workspace.dependencies] prevents,
          # and ADR-005 records the two that remain open.
          arguments: --workspace
