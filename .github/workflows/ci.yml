# The gate every change passes.
#
# Until this file existed there was no fmt, clippy or test job at all: the five
# workflows in this directory each cover one subsystem, and nothing ran
# `cargo test --workspace`. Supply chain was, and stays, security-audit.yml's.
#
# Ordered cheapest first, so a missing test in features.toml fails in seconds
# rather than after a forty-minute build.
name: ci

on:
  push:
    branches: ["master", "main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------
  # Seconds. Needs no build, so it runs first and alone.
  # ---------------------------------------------------------------------
  ledger:
    name: reality ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask

      # Fails when an entry in features.toml claims `working` or `verified`
      # and names no test that exists. It does not run the tests; the `test`
      # job does that.
      - name: features.toml
        run: cargo xtask coverage

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
          components: rustfmt
      - run: cargo fmt --all --check

  # ---------------------------------------------------------------------
  # Lints. `clippy::pedantic` is `warn` in [workspace.lints], deliberately:
  # see ADR-003. What is *denied* here is the narrow set worth blocking a
  # merge over.
  # ---------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config mold
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      # `unwrap()` in shipped code. Scoped to --lib --bins because a manifest
      # lint table cannot tell a test from a library — `#[cfg(test)]` code is
      # compiled into the same crate, and unwrapping in a test is how a test
      # reports a failure. `--lib --bins` does not enable `cfg(test)`, so this
      # sees only code that ships.
      #
      # Measured at the commit that added this file: 457 `unwrap()` warnings
      # across the workspace, and **zero** of them in --lib --bins. This gate
      # passes today and is here to keep it that way.
      #
      # `expect_used` is deliberately not denied: 73 in shipped code, and an
      # `expect("...")` that names the invariant it relies on is a different
      # thing from a bare `unwrap()`. Tracked in PROGRESS.md.
      - name: No unwrap in libraries or binaries
        run: cargo clippy --profile ci --workspace --lib --bins -- -D clippy::unwrap_used

      # Everything else, including tests and benches.
      #
      # `pedantic` is allowed here and `warn` in [workspace.lints]: 1,700
      # diagnostics when it was switched on, dominated by the cast lints (607)
      # and doc_markdown (308). Denying that would mean either a
      # 1,700-diagnostic cleanup inside a foundation change, or a gate no
      # branch can pass. It is visible in every local `cargo clippy`, and
      # `nightly.yml` ratchets it so the number cannot grow unnoticed.
      #
      # `unwrap_used` is allowed here because the step above already covers the
      # code where it matters.
      - name: Everything else must be clean
        run: |
          cargo clippy --profile ci --workspace --all-targets -- \
            -A clippy::pedantic \
            -A clippy::unwrap_used \
            -D warnings

  # ---------------------------------------------------------------------
  # Tests, core tier.
  # ---------------------------------------------------------------------
  test:
    name: nextest (core)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config mold
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-15
      - uses: Swatinem/rust-cache@v2
        with:
          key: nextest
      - uses: taiki-e/install-action@nextest

      # The core tier first: `crates/node` and the two crates beside it that a
      # validating node needs. It is a strict subset of the workspace run
      # below and shares every compiled unit with it, so it costs the cache
      # and not a second build — and when it fails, the failure is in the part
      # that has to work before anything else matters.
      - name: Test (core tier)
        run: |
          cargo nextest run --cargo-profile ci --no-fail-fast             -p maya-tiers -p custom-l1-node -p maya-light-client -p maya-fee-market

      - name: Test (whole workspace)
        run: cargo nextest run --cargo-profile ci --workspace --no-fail-fast

      # RESEARCH features no default build enables. Compiled and tested here
      # so their contract cannot rot while nobody turns them on (ADR-011).
      - name: Test (research features)
        run: cargo nextest run --cargo-profile ci -p maya-custody-mpc --features threshold-lattice --no-fail-fast

      # Now that the suite has run green, check that every test `features.toml`
      # names is a target that run would have executed. Cheap — it lists, it
      # does not build.
      - name: Ledger targets are real
        run: cargo xtask coverage --quiet --verify-targets

      # Artifact size is a standing problem on this project: the development
      # volume has been filled to zero bytes twice, and a full disk reports as
      # `os error 112`, which names nothing.
      #
      # Reported, not enforced, until a real runner has been measured once.
      # `--check` fails above 30 GiB, and nobody has yet seen what
      # `--profile ci` costs on ubuntu-latest after a full `--workspace` test
      # build — a ceiling guessed from a Windows dev box would either fail
      # every run or never fire. Swap in `--check` once the number below is
      # known. See reports/01-foundation.md section 1.
      - name: Build artifact size
        if: always()
        run: cargo xtask disk

  # ---------------------------------------------------------------------
  # Supply chain.
  #
  # `.github/workflows/security-audit.yml` runs the same check. That overlap
  # is deliberate rather than an oversight: the brief lists cargo-deny among
  # the gates every change passes, and security-audit.yml is scheduled and
  # path-filtered, so a pull request that touches only Cargo.toml would
  # otherwise reach `master` without a licence check. This job is seconds and
  # builds nothing.
  #
  # It was failing when this phase started, on 11 crates under three licences
  # the policy did not admit — see deny.toml's uniffi exception and
  # reports/03-hardening.md §1.
  # ---------------------------------------------------------------------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace
