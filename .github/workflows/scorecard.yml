# OpenSSF Scorecard: grades this repository's supply-chain practices (pinned
# actions, branch protection, token permissions, signed releases, fuzzing,
# dependency updates) and uploads the findings to the Security tab as SARIF.
#
# publish_results is false: true would send the results to the public OpenSSF
# API (and enable the public badge). That is publishing, so it waits for Eric's
# APPROVED (CLAUDE.md Standing Order 6). Flip it then, and add id-token: write.
name: scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
