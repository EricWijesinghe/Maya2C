name: offsec-sandbox

# The autonomous fuzzing module. Two surfaces, because they fail for unrelated
# reasons and run in different workspaces:
#
#   harness — the in-tree gate (tests/fuzz_harness.rs), main workspace, stable
#   sandbox — the offsec-sandbox crate: its tests, and a short run per surface
#
# The coverage-guided LibAFL engine and the Z3 solver are feature-gated and
# compile-checked here, not run at length — a real search is a nightly budget.

# Not on pull requests. Both jobs rebuild the node from scratch — 45 to 90
# minutes each on a cold cache — and on a private repository those minutes are
# metered: a day of pushes to one pull request exhausted the month's allowance
# on 2026-09-19. Master and the nightly soak still run it, and
# `workflow_dispatch` runs it on a branch on demand.
on:
  push:
    branches: [master]
  schedule:
    # 04:00 UTC daily: the soak run, a real budget the PR check cannot spend.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: offsec-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SANDBOX_TOOLCHAIN: nightly-2026-07-15

jobs:
  # ---------------------------------------------------------------------------
  harness:
    name: in-tree fuzz harness
    runs-on: ubuntu-latest
    # A cold build of the node (RocksDB's C++, wasmtime, arkworks, halo2) in
    # release does not fit in 30 minutes on a hosted runner, and a cancelled job
    # never saves its cache, so every later run started cold as well: the job
    # was cancelled on every commit and had never produced a result. 120 lets
    # the cold build finish once; warm runs take a fraction of that.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install RocksDB build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: offsec-harness

      # A PR gets the default 50,000; the nightly soak gets a million.
      - name: Set harness budget
        id: budget
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "iters=1000000" >> "$GITHUB_OUTPUT"
            echo "applies=1000" >> "$GITHUB_OUTPUT"
          else
            echo "iters=50000" >> "$GITHUB_OUTPUT"
            echo "applies=200" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the harness
        env:
          MAYA_FUZZ_ITERS: ${{ steps.budget.outputs.iters }}
          MAYA_FUZZ_APPLIES: ${{ steps.budget.outputs.applies }}
        run: cargo test --release --test fuzz_harness

  # ---------------------------------------------------------------------------
  sandbox:
    name: offsec-sandbox crate
    runs-on: ubuntu-latest
    # Same cold build as the harness above, same reason.
    timeout-minutes: 120
    # One job builds the node three times over, as a debug test build, a
    # clippy build and a release build. With full debug info that ran a
    # hosted runner out of disk ("No space left on device" while clippy
    # rebuilt RocksDB). Line tables keep file:line in a finding's backtrace,
    # which is what triage reads, at a fraction of the size.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      # The runner image ships SDKs this job never touches; removing them
      # frees roughly 25 GB for the three builds above.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config libz3-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.SANDBOX_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: offsec-sandbox
          key: offsec-sandbox

      # A separate workspace, so it builds on its own and never touches the
      # node's lockfile or graph.
      - name: Test the base crate
        working-directory: offsec-sandbox
        run: cargo test

      - name: Clippy
        working-directory: offsec-sandbox
        run: cargo clippy --all-targets -- -D warnings

      # The optional engines compile-check here; a real search is the nightly
      # soak below, not a per-PR cost.
      - name: Compile the LibAFL engine
        working-directory: offsec-sandbox
        run: cargo check --features libafl

      - name: Compile the Z3 solver
        working-directory: offsec-sandbox
        run: cargo check --features z3

      # A short run per surface: the autonomous loop must at least start, load
      # its seeds, and exit cleanly on a hardened tree. A finding fails the job.
      - name: Short run per surface
        working-directory: offsec-sandbox
        run: |
          # 1,000 per surface: enough to start the loop, load the seeds, and
          # drive every mutator. At 5,000 the wasm surface alone took 18
          # minutes, since each input compiles a module. The search itself is
          # the nightly soak's job.
          for surface in tx wasm handshake block; do
            cargo run --release --bin fuzz -- "$surface" --iters 1000 --out "findings/$surface"
          done

      - name: Upload any findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offsec-findings
          path: offsec-sandbox/findings/
          if-no-files-found: ignore
          retention-days: 30
