# Prebuilt binaries for people who do not want a Rust toolchain:
# maya2c-node (production features, the same build the testnet seed runs),
# l1-wallet, maya2c-peerid and maya2c (the developer CLI: `maya2c dev` starts a
# local chain from the node binary beside it), for Linux x86_64 and aarch64, Windows and macOS;
# and the Maya Wallet desktop installers for Windows, macOS and Linux.
#
# Two modes, and only one of them publishes anything:
#
#   workflow_dispatch   builds every target and uploads them as workflow
#                       artifacts. Nothing public changes. This is how the
#                       aarch64 build (the Oracle Always Free shape, ADR-032)
#                       gets tested without a release.
#   tag node-v*         the same, then an `updater-sign` job (no build, the
#                       only job holding the Tauri updater key) signs the
#                       wallet, chat and hub update bundles, then a `sign`
#                       job signs every file
#                       keylessly with cosign (Sigstore, GitHub OIDC: no key
#                       in the repository) and attests build provenance, then
#                       a `release` job creates a GitHub Release with the
#                       archives and a SHA256SUMS file. Pushing that tag
#                       publishes, so it needs `APPROVED: release`
#                       (CLAUDE.md, Standing Order 6). How to verify a
#                       download: docs/verify-release.md.
#
# `node-v*`, not `v*`: publish_sdk.yml already fires on `v*` and publishes to
# npm and PyPI. A binary release must not publish two packages as a side effect.
name: release-binaries

on:
  workflow_dispatch:
  push:
    tags: ["node-v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, exe: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: ".exe" }
          - { os: macos-14, target: aarch64-apple-darwin, exe: "" }
          # Intel Macs, cross-built on the Apple-silicon runner; the smoke
          # test below runs it under Rosetta.
          - { os: macos-14, target: x86_64-apple-darwin, exe: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # RocksDB is C++ and bindgen needs libclang. .cargo/config.toml links
      # x86_64 Linux through clang + mold; the other targets use their default.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang mold

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-09-29
        with:
          toolchain: nightly-2026-07-15
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        shell: bash
        # Linux node: the reproducible build (ADR-054), so anyone can rebuild
        # it and compare against SHA256SUMS. Windows and macOS are not yet.
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            bash scripts/repro_build.sh ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }} \
              -p maya2c-node --no-default-features --features production
          fi
          cargo build --release --locked --target ${{ matrix.target }} \
            -p l1-wallet -p maya2c-peerid -p maya2c-cli

      # A binary that does not start is worse than no binary.
      - name: Smoke test
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          "$dir/maya2c-node${{ matrix.exe }}" --help | head -1
          "$dir/l1-wallet${{ matrix.exe }}" --version
          "$dir/maya2c${{ matrix.exe }}" --version
          # A production build writes sealed keys only (ADR-049).
          head -c 32 /dev/urandom | base64 > "$RUNNER_TEMP/v.pass"
          "$dir/maya2c-node${{ matrix.exe }}" --validator-passphrase-file "$RUNNER_TEMP/v.pass" \
            --generate-validator-key "$RUNNER_TEMP/v.key" | wc -c

      # Windows Authenticode: no certificate yet. Logs UNSIGNED: no key and
      # continues; fails closed if the secret exists before signing is wired.
      - name: Authenticode (placeholder)
        if: runner.os == 'Windows'
        shell: bash
        env:
          PFX: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: bash scripts/authenticode-placeholder.sh
      - name: Package
        shell: bash
        run: |
          name=maya2c-${{ matrix.target }}
          mkdir -p "dist/$name"
          for b in maya2c-node l1-wallet maya2c-peerid maya2c; do
            cp "target/${{ matrix.target }}/release/$b${{ matrix.exe }}" "dist/$name/"
          done
          cp LICENSE* README.md "dist/$name/" 2>/dev/null || true
          (cd dist && tar -czf "$name.tar.gz" "$name")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maya2c-${{ matrix.target }}
          path: dist/maya2c-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Maya Wallet, the desktop app: Tauri installers per OS. Unsigned: without a
  # code-signing certificate Windows SmartScreen and macOS Gatekeeper warn
  # "unknown publisher", and the release notes say so.
  wallet:
    name: wallet ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Tauri 2 on Linux: WebKitGTK 4.1; keyring's secret-service backend
      # needs D-Bus. RocksDB (linked through the node crate) needs clang.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang mold libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-09-29
        with:
          toolchain: nightly-2026-07-15
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2, pinned 2026-09-29
        with:
          tool: trunk,tauri-cli

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/wallet-gui/src-tauri
          key: wallet-${{ matrix.os }}

      # tauri.conf.json runs `trunk build` for the UI first.
      # In-app updates (apps/app-update): only for a tagged release with the
      # pubkey file. This build never sees the updater key: --no-sign leaves
      # the update bundles unsigned, and the updater-sign job signs them. The
      # app version is 0.1.<run number>: MSI accepts numbers only, and each
      # release must be newer than the last for the updater to offer it.
      - name: Updater config
        id: updater
        shell: bash
        run: |
          if [ -f apps/updater-pubkey.txt ] && [[ "$GITHUB_REF" == refs/tags/node-v* ]]; then
            # --no-sign also skips OS code signing: refuse if one is configured.
            if grep -Eq '"(certificateThumbprint|signCommand|signingIdentity|providerShortName)"' apps/wallet-gui/src-tauri/tauri.conf.json; then
              echo "::error::OS code signing is configured; --no-sign would skip it"
              exit 1
            fi
            pub=$(tr -d '\r\n' < apps/updater-pubkey.txt)
            cfg="$RUNNER_TEMP/updater.json"
            printf '{"version":"0.1.%s","bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["https://maya2c.dev/updates/wallet.json"]}}}\n' \
              "$GITHUB_RUN_NUMBER" "$pub" > "$cfg"
            echo "args=--config $cfg --no-sign" >> "$GITHUB_OUTPUT"
            echo "update bundles built unsigned, signed by updater-sign: version 0.1.$GITHUB_RUN_NUMBER"
          else
            echo "not a release tag or no pubkey: no update bundles"
          fi

      - name: Build installers
        working-directory: apps/wallet-gui/src-tauri
        run: cargo tauri build ${{ steps.updater.outputs.args }}

      # Windows Authenticode: no certificate yet. Logs UNSIGNED: no key and
      # continues; fails closed if the secret exists before signing is wired.
      - name: Authenticode (placeholder)
        if: runner.os == 'Windows'
        shell: bash
        env:
          PFX: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: bash scripts/authenticode-placeholder.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maya-wallet-${{ matrix.os }}
          path: |
            apps/wallet-gui/src-tauri/target/release/bundle/msi/*.msi
            apps/wallet-gui/src-tauri/target/release/bundle/nsis/*.exe
            apps/wallet-gui/src-tauri/target/release/bundle/dmg/*.dmg
            apps/wallet-gui/src-tauri/target/release/bundle/deb/*.deb
            apps/wallet-gui/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/wallet-gui/src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error

  # Maya Chat desktop installers (apps/chat-gui). The wallet job's shape,
  # without trunk or the wasm target: the chat UI is plain HTML with no build
  # step. Unsigned, like the wallet's.
  chat:
    name: chat ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # WebKitGTK 4.1 for Tauri; D-Bus for keyring's secret-service backend,
      # where the chat identity seed lives; clang and mold for the repo's
      # Linux linker setting.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang mold libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-09-29
        with:
          toolchain: nightly-2026-07-15

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2, pinned 2026-09-29
        with:
          tool: tauri-cli

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/chat-gui/src-tauri
          key: chat-${{ matrix.os }}

      # In-app updates (apps/app-update): only for a tagged release with the
      # pubkey file. This build never sees the updater key: --no-sign leaves
      # the update bundles unsigned, and the updater-sign job signs them. The
      # app version is 0.1.<run number>: MSI accepts numbers only, and each
      # release must be newer than the last for the updater to offer it.
      - name: Updater config
        id: updater
        shell: bash
        run: |
          if [ -f apps/updater-pubkey.txt ] && [[ "$GITHUB_REF" == refs/tags/node-v* ]]; then
            # --no-sign also skips OS code signing: refuse if one is configured.
            if grep -Eq '"(certificateThumbprint|signCommand|signingIdentity|providerShortName)"' apps/chat-gui/src-tauri/tauri.conf.json; then
              echo "::error::OS code signing is configured; --no-sign would skip it"
              exit 1
            fi
            pub=$(tr -d '\r\n' < apps/updater-pubkey.txt)
            cfg="$RUNNER_TEMP/updater.json"
            printf '{"version":"0.1.%s","bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["https://maya2c.dev/updates/chat.json"]}}}\n' \
              "$GITHUB_RUN_NUMBER" "$pub" > "$cfg"
            echo "args=--config $cfg --no-sign" >> "$GITHUB_OUTPUT"
            echo "update bundles built unsigned, signed by updater-sign: version 0.1.$GITHUB_RUN_NUMBER"
          else
            echo "not a release tag or no pubkey: no update bundles"
          fi

      - name: Build installers
        working-directory: apps/chat-gui/src-tauri
        run: cargo tauri build ${{ steps.updater.outputs.args }}

      # Windows Authenticode: no certificate yet. Logs UNSIGNED: no key and
      # continues; fails closed if the secret exists before signing is wired.
      - name: Authenticode (placeholder)
        if: runner.os == 'Windows'
        shell: bash
        env:
          PFX: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: bash scripts/authenticode-placeholder.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maya-chat-${{ matrix.os }}
          path: |
            apps/chat-gui/src-tauri/target/release/bundle/msi/*.msi
            apps/chat-gui/src-tauri/target/release/bundle/nsis/*.exe
            apps/chat-gui/src-tauri/target/release/bundle/dmg/*.dmg
            apps/chat-gui/src-tauri/target/release/bundle/deb/*.deb
            apps/chat-gui/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/chat-gui/src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error

  # Maya2C Hub (apps/hub, ADR-045): the miner's desktop app, with
  # maya2c-gpu-miner shipped inside the installer as a Tauri sidecar, so a
  # miner installs one thing and presses Start. `cargo xtask hub-bundle`
  # builds the miner, names it for the target triple, and bundles; the
  # same command a developer runs locally (apps/hub/README.md). Unsigned,
  # like the wallet's, until a code-signing certificate exists.
  #
  # The Hub refuses every miner whose hash is not pinned at its build time
  # (miner_guard.rs). hub-bundle takes that pin from the very miner it ships,
  # so the pin and the bundle cannot drift apart. Never copy a sum from
  # elsewhere into this job: a sum for a different binary would make the Hub
  # refuse its own miner, or accept a substituted one.
  hub:
    name: hub ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # WebKitGTK for Tauri; clang for RocksDB, which the miner links
      # through the node crate.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang mold libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-09-29
        with:
          toolchain: nightly-2026-07-15

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2, pinned 2026-09-29
        with:
          tool: tauri-cli

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target
            apps/hub/src-tauri -> target
          key: hub-${{ matrix.os }}

      # In-app updates, as for the wallet and chat: only for a tagged release
      # with the pubkey file. The build never sees the updater key: hub-bundle
      # passes --no-sign, and updater-sign signs the update bundles.
      - name: Updater config
        shell: bash
        run: |
          if [ -f apps/updater-pubkey.txt ] && [[ "$GITHUB_REF" == refs/tags/node-v* ]]; then
            # --no-sign also skips OS code signing: refuse if one is configured.
            if grep -Eq '"(certificateThumbprint|signCommand|signingIdentity|providerShortName)"' apps/hub/src-tauri/tauri.conf.json apps/hub/src-tauri/tauri.release.conf.json; then
              echo "::error::OS code signing is configured; --no-sign would skip it"
              exit 1
            fi
            pub=$(tr -d '\r\n' < apps/updater-pubkey.txt)
            cfg="$RUNNER_TEMP/hub-updater.json"
            printf '{"version":"0.1.%s","bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["https://maya2c.dev/updates/hub.json"]}}}\n' \
              "$GITHUB_RUN_NUMBER" "$pub" > "$cfg"
            echo "HUB_UPDATER_CONFIG=$cfg" >> "$GITHUB_ENV"
            echo "update bundles built unsigned, signed by updater-sign: version 0.1.$GITHUB_RUN_NUMBER"
          else
            echo "not a release tag or no pubkey: no update bundles"
          fi

      - name: Build installer with the miner inside
        run: cargo xtask hub-bundle

      # The check the Hub itself makes at run time, on the file just shipped:
      # the bundled miner must pass the pin compiled into this build, and a
      # copy with one byte flipped must fail. Runs the #[ignore] test
      # shipped_miner_passes_its_pin_and_a_flipped_byte_fails (miner_guard.rs).
      # Relative paths: cargo runs the build script and the test in the
      # package directory.
      - name: Hub accepts its bundled miner and refuses an altered copy
        shell: bash
        working-directory: apps/hub/src-tauri
        run: |
          set -euo pipefail
          shopt -s nullglob
          miners=(binaries/maya2c-gpu-miner-*)
          if [ "${#miners[@]}" -ne 1 ]; then
            echo "::error::expected one bundled miner, found ${#miners[@]}"
            exit 1
          fi
          MAYA2C_MINER_SHA256SUMS=binaries/miner-sha256sums.txt \
          MAYA2C_SHIPPED_MINER="${miners[0]}" \
            cargo test --release --locked --lib shipped_miner -- --ignored --nocapture

      # Windows Authenticode: no certificate yet. Logs UNSIGNED: no key and
      # continues; fails closed if the secret exists before signing is wired.
      - name: Authenticode (placeholder)
        if: runner.os == 'Windows'
        shell: bash
        env:
          PFX: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: bash scripts/authenticode-placeholder.sh
      # The update payloads (exe, .app.tar.gz, AppImage) go up unsigned; the
      # updater-sign job writes their .sig files. gen-updates.mjs builds hub.json
      # only from a release's .sig assets (B41), so those must reach dist/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maya2c-hub-${{ matrix.os }}
          path: |
            apps/hub/src-tauri/target/release/bundle/msi/*.msi
            apps/hub/src-tauri/target/release/bundle/nsis/*.exe
            apps/hub/src-tauri/target/release/bundle/dmg/*.dmg
            apps/hub/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/hub/src-tauri/target/release/bundle/deb/*.deb
            apps/hub/src-tauri/target/release/bundle/rpm/*.rpm
            apps/hub/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # The only job that holds TAURI_SIGNING_PRIVATE_KEY, and it runs no
  # repository code: no checkout, no cargo, no build. It downloads the update
  # bundles the wallet, chat and hub jobs built unsigned, installs the tauri
  # CLI from npm at an exact version (npm audit signatures checks registry
  # signature and provenance), and signs them.
  updater-sign:
    if: startsWith(github.ref, 'refs/tags/node-v')
    needs: [wallet, chat, hub]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: maya-*
          path: updater-in
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: maya2c-hub-*
          path: updater-in
          merge-multiple: true
      - name: Install tauri CLI (pinned, provenance checked)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tauri-cli" && cd "$RUNNER_TEMP/tauri-cli"
          npm install --ignore-scripts --no-audit --no-fund --save-exact @tauri-apps/cli@2.12.2
          npm audit signatures
          ./node_modules/.bin/tauri --version
      # Only the three updater payload kinds, matching what the apps offer:
      # the NSIS exe, the macOS .app.tar.gz and the AppImage. The .sig sits
      # beside each file; the tauri CLI binds it to the release version.
      - name: Sign update bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?not set: refusing to publish unsigned update bundles}"
          tauri="$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri"
          version="0.1.$GITHUB_RUN_NUMBER"
          count=0
          while IFS= read -r -d '' f; do
            "$tauri" signer sign --app-version "$version" "$f"
            count=$((count + 1))
          done < <(find updater-in -type f \( -path '*/nsis/*.exe' -o -path '*/macos/*.app.tar.gz' -o -path '*/appimage/*.AppImage' \) -print0)
          if [ "$count" -eq 0 ]; then
            echo "::error::no update bundles found: the build did not produce them"
            exit 1
          fi
          echo "signed $count update bundles for version $version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: updater-sigs
          path: updater-in/**/*.sig
          if-no-files-found: error

  # `environment: release` lets the repository owner require an approval
  # before a signature is made. Signing runs in its own job, so only this job
  # holds id-token: write. The build jobs above hold no write permission at
  # all, and the release job below holds contents: write but no OIDC token.
  sign:
    if: startsWith(github.ref, 'refs/tags/node-v')
    needs: [build, wallet, chat, hub, updater-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write      # Sigstore keyless signing (GitHub OIDC), and provenance
      attestations: write  # stores the provenance where `gh attestation verify` finds it
    steps:
      # First, a checkout cleans the workspace, so it must come before the artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      # upload-artifact keeps each installer's bundle/<kind>/ folder, so
      # dist/ arrives holding deb/, msi/, nsis/... directories, and
      # `gh release create dist/*` refuses a directory (the first
      # node-v0.1.0-testnet.1 run failed on "dist/deb: is a directory").
      # Flatten it; a name that would collide stops the release instead of
      # silently replacing a file.
      - name: Flatten artifacts
        run: |
          cd dist
          # GitHub stores "Maya Wallet_0.1.0.msi" as "Maya.Wallet_0.1.0.msi";
          # name files that way here, or SHA256SUMS lists names nobody can
          # download and `sha256sum -c` fails (node-v0.1.0-testnet.1 did).
          find . -type f -print0 | while IFS= read -r -d '' f; do
            name=$(basename "$f" | tr ' ' '.')
            [ "./$name" = "$f" ] && continue
            if [ -e "$name" ]; then
              echo "duplicate artifact name: $name" >&2
              exit 1
            fi
            mv "$f" "$name"
          done
          find . -mindepth 1 -type d -empty -delete
          ls -la
      # A software bill of materials for the source tree the binaries were
      # built from, so a user can check which dependency versions shipped
      # without trusting this page. CycloneDX from Cargo.lock via
      # `cargo cyclonedx`: the action allow-list admits taiki-e, not anchore.
      # Before Checksums, so the SBOM is summed too.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-09-29
        with:
          toolchain: nightly-2026-07-15
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2, pinned 2026-09-29
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5
          find . -name '*.cdx.json' -not -path './dist/*' -not -path './target/*' -print0 \
            | tar --null -czf dist/maya2c-sbom-cyclonedx.tar.gz --files-from -
          tar -tzf dist/maya2c-sbom-cyclonedx.tar.gz | wc -l
      - name: Checksums
        run: |
          cd dist
          # Installer names contain spaces ("Maya Wallet_0.1.0_x64-setup.exe").
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z | xargs -0 sha256sum | tee SHA256SUMS
      # Windows code signing and Android keystore are placeholders until the
      # owner supplies keys. The log says UNSIGNED: no key when they are absent.
      - name: Android keystore (placeholder)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "UNSIGNED: no key (ANDROID_KEYSTORE_BASE64 not set); this release has no Android build"
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but Android signing is not wired"
            exit 1
          fi
      # Signed SLSA build provenance for every file in dist/ (each installer,
      # archive, the SBOM, the update .sig files and SHA256SUMS itself), one
      # attestation per file, so `gh attestation verify <file>` finds it. Runs
      # before cosign, so the .sigstore.json bundles are not attested.
      # Verify with `cargo xtask verify-release <dir>` or
      # `gh attestation verify <file> --repo EricWijesinghe/Maya2C`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Keyless, so there is no key to steal: cosign takes a 10-minute
      # certificate for this job's GitHub OIDC token and logs the signature in
      # the public Rekor transparency log. A bundle per file, plus one for
      # SHA256SUMS. Bundles are not listed in SHA256SUMS (they come after it).
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign every file (cosign, keyless)
        working-directory: dist
        run: |
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            echo "signed $f"
          done
      # The same check a user runs, before anything is published. It fails the
      # job on a bad checksum, a missing bundle, or a signature or attestation
      # not made by this workflow on a node-v* tag.
      - name: Verify release (self-check)
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked -p xtask -- verify-release dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/node-v')
    needs: [sign]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: write   # starts site.yml for the update manifests
    steps:
      # First, for the release notes (docs/releases/<tag>.md): a checkout
      # cleans the workspace, so it must come before the artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag's own notes page when there is one; a tag without one
          # still gets an honest line rather than failing the release.
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --notes "Testnet binaries and the Maya Wallet, Maya Chat and Maya2C Hub desktop installers. Not audited; mainnet is blocked. Every file is signed keylessly (cosign, Sigstore) and carries GitHub build provenance; the installers are not code-signed, so Windows and macOS warn about an unknown publisher. Verify with docs/verify-release.md."
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --prerelease \
            --title "${GITHUB_REF_NAME} (testnet, unaudited)" "$@"
      # Rebuild the site so maya2c.dev/updates/*.json points at this release.
      # A release made with GITHUB_TOKEN fires no `release` event, but a
      # workflow_dispatch from it does run.
      - name: Publish update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "${GITHUB_REPOSITORY}" --ref master
