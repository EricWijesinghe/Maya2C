# Keeps dependencies current between audits. cargo-deny (security-audit.yml)
# already fails the build on a known advisory; this opens the update before
# an advisory exists, so a fix is one merge rather than a scramble.
#
# Weekly and grouped, so a sole maintainer sees a handful of PRs, not dozens.
# Security updates are not grouped or delayed: GitHub opens those at once.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    # A major bump of a Rust crate changes its API and, for the crypto
    # crates, can change behaviour: it is a reviewed migration (BACKLOG),
    # not an automatic PR that fails to build. Security fixes still arrive.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # leptos 0.8.22 pulls server_fn_macro_default 0.8.5, which does not
      # compile (E0277, two syn versions in the graph; PR #154, 2026-10-19).
      # Drop this once a later 0.8.x builds.
      - dependency-name: "leptos*"
        versions: ["0.8.22"]
      - dependency-name: "server_fn*"
        versions: ["0.8.5"]
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/docs/site"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      site:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
