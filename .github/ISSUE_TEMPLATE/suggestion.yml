name: Feature request
description: Propose a feature or change. The maintainer reviews every request and decides.
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Suggestions are read in full; accepted ones are usually
        implemented by the maintainer. See CONTRIBUTING.md for how this works.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is missing or wrong today, and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security or consensus impact
      description: Could this change fees, state roots, key handling or validator behaviour? Say so if unsure.
  - type: textarea
    id: evidence
    attributes:
      label: How we would know it works
      description: The test or measurement that would fail without it. Numbers only if you measured them.
