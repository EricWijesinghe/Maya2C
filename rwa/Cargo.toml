[package]
name = "maya-rwa"
version.workspace = true
# Not published. See stratum-v2/Cargo.toml for why cargo-deny needs this.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Real-world asset records: tokens, paged cap tables, legal attestations and revenue distributions"

[lib]
name = "maya_rwa"
path = "src/lib.rs"

# Chain-free, like `identity` and `iso20022`. A cap table page or a legal
# attestation may arrive from an issuer's own tooling, so the decoder is
# fuzzable without RocksDB in the graph. The distribution arithmetic is not
# here — it lives in `ledger-math`, which is dependency-free so Kani can check
# that the payouts sum to exactly the total.
[dependencies]
thiserror.workspace = true

[lints]
workspace = true
