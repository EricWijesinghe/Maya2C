[package]
name = "custom-l1-node"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish.workspace = true
edition.workspace = true
# Edition 2024 needs 1.85, but the code also uses `u64::is_multiple_of` (1.87)
# and `slice::as_chunks` (1.88). Declaring the real floor makes a stale
# toolchain fail with a clear message instead of a wall of errors.
rust-version.workspace = true

# The root package is a workspace member alongside the wallet CLI, so both
# share one lockfile, one target directory, and the profile overrides below.
[workspace]
members = [
    "wallet",
    "l2-flash",
    "vm",
    "explorer",
    "wallet-gui/core",
    "zk-privacy",
    "crypto-pq",
    "ledger-math",
    # GPU miner. A member so it cannot rot, but its `cuda` feature is off by
    # default: with no feature selected it compiles to host-side Rust and needs
    # no CUDA toolkit, which is what keeps `cargo build --workspace` green on
    # the GPU-less CI runners.
    "cuda-miner",
    # Pool protocol. No chain dependency, so it can be fuzzed and reviewed on
    # its own; the daemon that joins it to chain types is a separate member.
    "stratum-v2",
    # That daemon. Share validation, PPLNS accounting, and treasury payouts —
    # the layer where a protocol value becomes a chain type.
    "pool-service",
    # Trading arithmetic: the constant-product curve and the order book
    # matcher. A dependency-free leaf for the same reason `ledger-math` is one —
    # every function in it decides how much value a trade moves, and Kani
    # cannot compile a crate whose graph reaches RocksDB's C++.
    "dex",
    # The verifiable random function behind the randomness beacon. A member so
    # a beacon operator or the wallet can produce proofs without linking
    # RocksDB, libp2p, and the SNARK stack — see `vrf/src/lib.rs`.
    "vrf",
    # The proposal lifecycle, the vote tally, and the bounds a proposal may
    # never escape. Dependency-free for the same reason `ledger-math` is: it
    # decides which changes to the chain's own rules are permissible, and that
    # is the last place a bug should be hard to check.
    "governance",
    # Adaptive base fee, fee split, supply bound. A research branch at
    # activation u64::MAX, called by nothing in consensus. Dependency-free for
    # the reason `governance` is: every function decides how much value moves.
    "fee-market",
    # SPV light client: header fork choice and state-proof verification, for
    # anything that must check Maya2C state without running a full node.
    "light-client",
    # Threshold encryption for the mempool, so a miner orders transactions it
    # cannot read. Curve arithmetic and an AEAD only — no chain types — so it
    # can be reviewed and fuzzed without the node, like `stratum-v2`.
    "mev",
    # Lattice proof-of-work verification. A research branch: nothing in
    # consensus calls it, and the open question is in its own documentation.
    # Dependency-free for the same reason `ledger-math` and `dex` are — the
    # rules that decide whether a block is admissible are worth model-checking.
    "lattice-pow",
    # Batch references and deterministic shard scheduling. A research branch:
    # nothing in consensus references a batch yet. Dependency-free for the same
    # reason `ledger-math` and `dex` are — it decides which transactions a block
    # commits to and what order they execute in.
    "blockgraph",
    # REST and GraphQL gateway. Talks to a node over JSON-RPC rather than
    # opening the state database, so it deploys separately and keeps RocksDB's
    # C++ out of the process terminating untrusted HTTP.
    "api-gateway",
    # uniffi bindings over the hybrid signing primitives. A member so it cannot
    # rot; note that it links `custom-l1-node` for `HybridSigningKey` and so
    # pulls RocksDB into the cdylib — see `sdk-ffi/README.md`.
    "sdk-ffi",
    # Browser bindings. Cannot depend on the node — RocksDB is C++ and does not
    # target wasm32 — so it composes the hybrid construction from the same two
    # primitives, and `tests/hybrid_parity_tests.rs` pins the two together.
    "sdk-wasm",
    # Generates the LaTeX technical reference from module documentation.
    # Dependency-free: it reads Rust source and writes LaTeX, and neither needs
    # a crate.
    "docgen",
    # Cross-platform GPU miner for the hashimoto proof of work. Its `gpu`
    # feature is off by default for the same reason `cuda-miner`'s `cuda`
    # feature is: the workspace must build on a runner with no adapter.
    "wgpu-miner",
    # Testnet faucet. A member so its rate limiting cannot rot, and because it
    # is the one service in the workspace that holds a funded key behind a
    # public endpoint — the code that decides who gets funds should be reviewed
    # alongside the code that decides what a block is.
    "faucet",
    # Threshold custody of a chain key. A member so its sharing arithmetic and
    # its quorum rules cannot rot, and because the one thing it must never do —
    # let a sub-threshold set of shares reconstruct anything — is a property a
    # test suite has to keep asserting. It links no chain types and no RocksDB;
    # `tests/custody_parity_tests.rs` in the node's own suite is what pins its
    # key derivation to `crypto::hybrid`.
    "custody-mpc",
    # zkML proof verification. A member so the circuit's soundness tests run in
    # the workspace suite. `vm` does not depend on it: the node supplies
    # verification through `HostState`, the same seam that keeps chain types out
    # of the VM. `tract-onnx` is behind the `prover` feature and never reaches
    # the consensus path -- see docs/zkml.md.
    "zkml",
    # Its off-chain half: ONNX import via tract, key generation, proving. A
    # separate member rather than a feature so the node cannot reach tract even
    # through feature unification, and so its higher rust-version stays its own.
    "zkml-prover",
    # Network telemetry collector. No chain dependency — it aggregates what
    # nodes and miners report, and verifies none of it, which is stated at the
    # top of its `lib.rs` because every number it serves is a claim.
    "telemetry",
    # Content-addressed archives (CAR v1, zstd) of pruned block batches, and the
    # stores that hold them: a local directory, an IPFS node, an Arweave
    # gateway. Chain-agnostic, so the decoder that reads untrusted archives is
    # fuzzable without RocksDB or libp2p -- see src/state_pruner/.
    "archive",
    # ISO 20022 bank-rail messages: pacs.008, pacs.009, camt.053. Chain-free
    # for the same reason `stratum-v2` and `archive` are — it parses XML a
    # stranger wrote, and a decoder of untrusted input should be fuzzable
    # without RocksDB in the graph. It emits a neutral `PaymentIntent`; turning
    # one into a `TxKind` and sealing it is the gateway's job, not this crate's.
    "iso20022",
    # Off-grid radio transport: ISM LoRa framing, a duty-cycle governor, a
    # fountain codec and the store-and-forward relay. Chain-free for the same
    # reason `stratum-v2` is, and more so — these frames arrive from anyone with
    # a transmitter, with no handshake in front of them.
    "radio-transport",
    # Self-sovereign identity: DID documents, service endpoints, attestations.
    # Chain-free, because a DID Document arrives from a stranger. Its records
    # carry commitments and roots only — there is no field a claim could go in,
    # which is the one property a permanent public chain cannot walk back.
    "identity",
    # Real-world asset records. Chain-free for the same reason `identity` is;
    # the arithmetic that decides how much value moves lives in `ledger-math`,
    # where Kani can reach it.
    "rwa",
    # Lattice hash-time-locked contracts: Module-LWE commitments, openings, the
    # timelock rule and the lock record. Chain-free, because a claim carries an
    # opening a stranger wrote. Research branch: HTLC_L_ACTIVATION_HEIGHT is
    # u64::MAX — see docs/htlc-lattice.md.
    "htlc-lattice",
    # The counterparty watcher: claims a lock as soon as the other chain reveals
    # its opening, refunds after expiry, and refuses to reveal too late. Its own
    # process, because it holds a hot key and the node should not.
    "htlc-watcher",
    # Training for the fee market's neural gain: a synthetic demand simulator,
    # float SGD, and quantization into fee-market's integer weight file. Floats
    # stop here; the node does not depend on it (invariant 20).
    "neural-gas-trainer",
    # Stateless transfer execution: a keyed sparse Merkle commitment over
    # accounts, its witnesses, and a Ring-SIS research backend. Chain-free, so
    # a stateless verifier structurally cannot read a database and its witness
    # decoder fuzzes alone. Research branch: STATELESS_ACTIVATION_HEIGHT is
    # u64::MAX — see docs/stateless.md.
    "stateless-core",
    # Federated training without revealed updates: ML-KEM secure aggregation,
    # integer discrete-Gaussian DP, an attestation hook. Off-chain; the node
    # takes it as a dev-dependency only (invariant 20) — see
    # docs/confidential-ai.md.
    "confidential-ai",
    # The XDP relay's shared rules: the 56-byte header, the integer token
    # bucket, and the verdict order. `no_std` and dependency-free, because the
    # kernel's verifier compiles every function the XDP program calls from it —
    # see docs/ebpf-net.md.
    "ebpf-net/common",
    # The relay itself: sealed chunks, bounded reassembly, and — on Linux behind
    # the `xdp` feature, off by default like `cuda-miner`'s `cuda` — the loader
    # and AF_XDP sockets. The XDP program is `ebpf-net/programs`, not a member:
    # it builds for `bpfel-unknown-none` on nightly, as `dashboard/` builds for
    # wasm32.
    "ebpf-net",
    # Threat indicators from verified gossip evidence: the signed bytes, the
    # integer score and its decay by height. Dependency-free for Kani, like
    # `dex`. Research branch: THREAT_INTEL_ACTIVATION_HEIGHT is u64::MAX — see
    # docs/threat-intel.md.
    "threat-intel",
    # The per-host worker turning a co-located node's active indicators into
    # nftables / iptables drops. Holds no chain key — see docs/threat-intel.md.
    "threat-firewall",
    # Hardware-anchored sensor identity: ML-DSA-65 device keys, a PUF fuzzy
    # extractor, TPM sealing, telemetry batches, tamper and clone evidence.
    # `no_std` and heap-free, so it builds for Cortex-M33 and ESP32-C3. Research
    # branch: IOT_ACTIVATION_HEIGHT is u64::MAX — see docs/iot-anchor.md. The
    # example firmware, `iot-firmware/`, is its own workspace.
    "iot-anchor",
    # Workspace automation: `cargo xtask disk` and `cargo xtask coverage`. A
    # member so it is type-checked by the same `cargo check --workspace` that
    # gates everything else, and so the ledger test in it runs in the ordinary
    # test job rather than in a script nobody executes.
    "xtask",
]

# ---------------------------------------------------------------------------
# [workspace.package] — fields every member inherits with `field.workspace = true`
# ---------------------------------------------------------------------------
#
# `publish = false` is load-bearing rather than cosmetic: cargo-deny's
# `allow-wildcard-paths` and `[licenses.private] ignore` apply only to
# unpublished crates, so without it every internal path dependency reads as a
# wildcard and every workspace crate reads as unlicensed.
#
# `rust-version = "1.88"` is the real floor, not edition 2024's 1.85: the code
# uses `u64::is_multiple_of` (1.87) and `slice::as_chunks` (1.88). A stale
# toolchain then fails with one clear message instead of a wall of errors.
# `maya-zkml-prover` overrides it to 1.91 — `tract-onnx`'s patched releases
# need it, and nothing the node links depends on that crate (invariant 20).
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# ---------------------------------------------------------------------------
# [workspace.dependencies] — one version per external crate
# ---------------------------------------------------------------------------
#
# Before this table there were 95 external dependencies across 45 manifests,
# six of them declared at *incompatible* versions by different members. The
# measurement is in `reports/00-inventory.md` section 7.
#
# Two rules, so that reading a member manifest still tells you what that crate
# uses:
#
#   1. This table carries the **version** only. Feature lists stay in the
#      member that needs them, because which features a crate turns on is a
#      fact about that crate, not about the workspace. `features` on an
#      inherited dependency are additive, so this composes.
#
#   2. `default-features` appears here only where **every** member agrees it is
#      off. Where one member disagrees it keeps a literal declaration with a
#      comment saying why, rather than forcing the other eleven to restate a
#      default. Those exceptions are listed at the end of this table.
#
# A dependency used by exactly one member stays in that member. Centralising 54
# single-use versions would centralise nothing and would hide them from the
# crate that owns them.

[workspace.dependencies]
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
# The eBPF loader. Only `ebpf-net`'s Linux half and its test harness link it.
aya = "0.14"
# Was split "1" / "1.8" across 18 members; both resolved to the same lockfile
# entry, so unifying on the real floor changed nothing but the drift.
blake3 = "1.8"
clap = "4"
# Was 0.5 in `vm` and 0.7 everywhere else — two copies of a bench harness in
# the lockfile. Verified: `vm`'s `html_reports` still exists on 0.7.
criterion = "0.7"
# Deliberately one copy: two versions of a curve in one lockfile is two sets of
# encoding rules. Note that this goal is *not* currently met transitively —
# libp2p 0.57 pulls curve25519-dalek 5.0 through ed25519-dalek 3.0. See
# `reports/00-inventory.md` section 7 and ADR-005.
curve25519-dalek = "4"
# ML-DSA-65 (FIPS 204). `default-features = false` with only the 65 parameter
# set is invariant 4, and stating it here is what makes it a workspace-wide
# property rather than four manifests that happen to agree. A compiled-in
# parameter set is a set someone can select by accident; the security level of
# a chain should not be a function of which import somebody reached for.
# Members add `default-rng` where they generate keys.
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65"] }
futures = "0.3"
futures-util = "0.3"
# In-memory duplex streams for driving both halves of a handshake without a
# socket. What libp2p uses for the same job.
futures_ringbuf = "0.4"
getrandom = "0.4"
# Pinned exactly: the SRS in `zkml/src/srs.rs` and the proving key are tied to
# this implementation's encoding, so a patch release is a consensus-visible
# change even while zkML is dark.
halo2-axiom = "=0.5.3"
hex = "0.4"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
jsonrpsee = "0.26"
leptos = "0.8"
prometheus-client = "0.25"
rand_chacha = "0.3"
rocksdb = "0.25"
serde = "1"
serde_json = "1"
sha2 = "0.10"
# Was 0.10 in `iot-anchor` and 0.11 in `htlc-lattice` and `stateless-core` —
# three Kani-verified crates hashing with two releases of the same SHAKE.
# Verified on 0.11: `iot-anchor`'s 13 tests pass and it still builds for
# thumbv8m.main-none-eabihf and riscv32imc-unknown-none-elf.
sha3 = { version = "0.11", default-features = false }
tempfile = "3"
thiserror = "2.0"
tokio = "1"
# `config.toml` parsing, and `features.toml` in xtask. One format, read once
# at startup, with `deny_unknown_fields` doing the work a layered config
# library would otherwise hide.
toml = "0.9"
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
wat = "1"
zeroize = "1"

# arkworks, for the Groth16 shielded pool. Pinned exactly for the same reason
# as halo2-axiom: proving and verifying keys are tied to an encoding.
ark-bls12-381 = "=0.6.0"
ark-std = "=0.6.0"

# --- Deliberate exceptions, kept literal in the member that needs them -------
#
# chacha20poly1305   0.10 here (node, `mev`, `custody-mpc`, `confidential-ai`,
#                    `ebpf-net`); `wallet` and `wallet-gui/core` are on 0.11.
#                    Unifying either direction rewrites AEAD call sites in
#                    crypto code, which is not a workspace-layout change. The
#                    two use sites never exchange ciphertext. Tracked in
#                    PROGRESS.md, not fixed here.
# rand / rand_core   `crypto-pq` is on the 0.10 generation, `zkml`,
#                    `zkml-prover` and `iot-anchor` on 0.6/0.8 because that is
#                    what their ecosystems (halo2, tract, digest 0.10) require.
#                    A major-version split with a reason is not drift.
# zeroize            `iot-anchor` needs `default-features = false`; it is
#                    `no_std` and heap-free. Putting that here would force the
#                    other eleven members to restate the default.
chacha20poly1305 = "0.10"

# ---------------------------------------------------------------------------
# [workspace.lints] — the lint policy every member inherits
# ---------------------------------------------------------------------------
#
# Before this table there was no shared lint policy at all: twelve crates
# declared `[lints.rust] unexpected_cfgs` for Kani and nothing else was set
# anywhere. `unsafe_op_in_unsafe_fn` in particular was off, in a tree whose
# fourth execution directive is "no unsafe in core execution paths".
#
# Members opt in with `[lints]\nworkspace = true`. A crate cannot have both
# that and its own `[lints.rust]` table, which is why the Kani cfg declaration
# moved here rather than staying in each of the twelve.
[workspace.lints.rust]
# `unsafe fn` no longer makes its whole body an implicit unsafe block. Denied,
# not warned: the crates allowed `unsafe` at all are the FFI and kernel ones
# (`sdk-ffi`, `cuda-miner`, `wgpu-miner`, `ebpf-net/src/linux/`), which is
# exactly where an unmarked operation is hardest to see.
unsafe_op_in_unsafe_fn = "deny"

# `kani` is set by the Kani compiler, not by cargo, so a plain `cargo check`
# would flag every `#[cfg(kani)]` as an unexpected condition. Declaring it
# keeps the lint on for every *other* cfg while telling it this one is real.
# `app-maya2c` is not a workspace member and keeps its own declaration, which
# also covers the Ledger device `target_os` values.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# Warn, not deny. Denying a 700-lint group in the manifest would stop the
# build on the day clippy adds a lint, which is a decision this repository
# should make on purpose rather than inherit from a release announcement.
# `reports/01-foundation.md` carries the count this produced when it was
# switched on.
pedantic = { level = "warn", priority = -1 }

# `unwrap()` and `expect()` in shipped code.
#
# Warn here rather than deny, because a manifest lint table cannot tell a test
# from a library: `#[cfg(test)]` code is compiled into the same crate, and
# unwrapping in a test is how a test reports a failure. The deny lives in CI
# instead, scoped to the targets where it means something:
#
#     cargo clippy --workspace --lib --bins -- -D clippy::unwrap_used
#
# which leaves tests, benches and examples alone.
unwrap_used = "warn"

# Pedantic lints this tree disagrees with, switched off once here instead of
# with an `#[allow]` in fifty files.
module_name_repetitions = "allow"   # `dag::DagCache` reads better than `dag::Cache`
must_use_candidate = "allow"        # noise on a codebase this size
missing_errors_doc = "allow"        # every fallible fn here already documents its error type
missing_panics_doc = "allow"
similar_names = "allow"             # `sk`/`pk`, `s`/`e` in the lattice code are the literature's names

[dependencies]
blake3.workspace = true
argon2.workspace = true
# Entropy comes straight from the OS rather than through an RNG trait crate.
# rand_core 0.10 is traits-only — it no longer ships OsRng — and routing key
# generation through a trait crate would mean keeping dalek's rand_core version
# in lockstep with every other crate that wants one. getrandom is the source
# those RNGs wrap anyway, and it is already in the tree transitively.
getrandom.workspace = true
# ML-DSA-65 (FIPS 204), the transaction signature scheme.
#
# Pure Rust, which the Dockerfile's static-musl build depends on: the PQClean
# bindings (pqcrypto-mldsa) would add a C toolchain and an unsafe FFI surface to
# a build that currently links only RocksDB's C++.
#
# Only the 65 parameter set is compiled. The 44 and 87 sets are dead weight, and
# a set that is present is a set some future caller can pick by accident — the
# security level of a chain should not be a function of which import someone
# reached for.
fips204 = { workspace = true, features = ["default-rng"] }
# SLH-DSA-SHA2-128s (FIPS 205), the second half of every transaction signature.
#
# Its own crate rather than a module here, because `slh-dsa` is generic over its
# parameter set and monomorphizes into whichever crate instantiates it — see
# crypto-pq/Cargo.toml for the measurement that forced this.
maya-crypto-pq = { path = "crypto-pq" }
# The AEAD sealing every frame of the post-quantum transport layer. Already in
# the tree via the wallet keystore, so this adds no new dependency.
chacha20poly1305.workspace = true
zeroize.workspace = true
hex.workspace = true
thiserror.workspace = true
rocksdb.workspace = true
serde = { workspace = true, features = ["derive"] }
# `config.toml` parsing. `toml` rather than a general config crate: one format,
# read once at startup, with `deny_unknown_fields` doing the work a layered
# config library would otherwise hide.
toml.workspace = true
serde_json.workspace = true
maya-vm = { path = "vm" }
# zkML proof verification, for `host_verify_zkml_proof`. The verifier only:
# proving and ONNX import are in `maya-zkml-prover`, which is a dev-dependency
# here and nothing more, so an ONNX runtime cannot end up on a consensus path.
# Dark until `ZKML_ACTIVATION_HEIGHT` is set -- see src/state/context.rs.
maya-zkml = { path = "zkml" }
maya-zk-privacy = { path = "zk-privacy" }
# The trading engine's arithmetic: the constant-product curve, the order book
# matcher, and the batch clearing that prices a block's swaps at one price.
# A separate crate for the same reason `ledger-math` is one — it is the other
# half of the code where a rounding error mints value, and it is model-checked.
maya-dex = { path = "dex" }
# Archives of pruned block batches, for `state_pruner`. The node writes and
# reads them; the crate itself knows nothing about blocks.
maya-archive = { path = "archive" }
# The randomness beacon's verifiable random function. RFC 9381 over
# curve25519 — a classical primitive, deliberately, because no post-quantum VRF
# is standardized. `vrf/src/lib.rs` states what that costs and what bounds it.
maya-vrf = { path = "vrf" }
# The proposal lifecycle, the vote tally, and the bounds a proposal may never
# escape. A separate crate for the same reason `ledger-math` is one: it decides
# which changes to the chain's own rules are permissible, and that is the last
# place a bug should be hard to check.
maya-governance = { path = "governance" }
# Threshold encryption for the mempool: the committee key, the Shamir split,
# and the Chaum-Pedersen proof a decryption share carries. A separate crate so
# the curve arithmetic can be reviewed and fuzzed without the node, and so that
# a chain built without the sealed mempool does not link it.
maya-mev = { path = "mev" }
# ISO 20022 bank-rail messages. The node takes it for the bridge in
# `src/iso20022_bridge.rs`; the crate itself links no chain types, which is
# what keeps its XML decoder fuzzable on its own.
maya-iso20022 = { path = "iso20022" }
# Off-grid radio. The node takes it for `src/network/radio_gateway.rs`; the
# crate links no chain types, which is what keeps its frame decoder fuzzable.
maya-radio-transport = { path = "radio-transport" }
# Self-sovereign identity records. The node takes it for `src/state/identity.rs`.
maya-identity = { path = "identity" }
# Real-world asset records, for `src/state/rwa.rs`.
maya-rwa = { path = "rwa" }
# Lattice HTLC commitments, openings and lock records, for `src/state/htlc.rs`.
maya-htlc-lattice = { path = "htlc-lattice" }
# Threat indicators and the evidence encoding, for `src/state/threat.rs`.
maya-threat-intel = { path = "threat-intel" }
# Strict ed25519 verification of gossip evidence (`src/state/threat_exec.rs`).
# Already in the graph through libp2p identities; named here so the
# consensus check is `verify_strict`, not whatever libp2p happens to call.
ed25519-dalek = "2.2"
# Device records and batch rules, for `src/state/iot.rs`.
maya-iot-anchor = { path = "iot-anchor" }
# The sparse accounts tree and its witnesses, for `src/state/stateless.rs`. The
# node computes its accounts root with this crate once stateless accounts are
# active, so a stateless verifier and a full node share one definition.
maya-stateless-core = { path = "stateless-core" }
# The block relay, for `src/network/node/relay.rs`. Without the `xdp` feature
# this is portable Rust with no `unsafe`: sealed chunks over a kernel UDP socket.
# The crate links no chain types, which is what keeps its datagram decoder
# fuzzable on its own.
maya-ebpf-net = { path = "ebpf-net" }
# Only for the ristretto255 encodings that cross the boundary between chain
# state and `maya-mev` — a stored committee key, a stored decryption share.
# The same version `maya-mev` and `maya-vrf` already pull in, deliberately: two
# copies of a curve in one lockfile is two sets of encoding rules.
curve25519-dalek.workspace = true
# Every `u64` credit, debit, and nonce bump on the ledger. A separate crate
# because it is the one thing here that is model-checked: Kani compiles a crate
# together with its whole dependency graph, and it cannot do that for a crate
# that pulls in RocksDB's C++. See `ledger-math/src/lib.rs`.
maya-ledger-math = { path = "ledger-math" }
# Research branch, see `crypto::lattice`. Present so the derivation half and the
# verification half are compiled and tested together; no consensus path reaches
# either of them.
maya-lattice-pow = { path = "lattice-pow" }
# Research branch, see `docs/blockgraph.md`. Present so the batch identifier
# derivation is compiled and tested against the types it produces; no consensus
# path reaches either.
maya-blockgraph = { path = "blockgraph" }
jsonrpsee = { workspace = true, features = ["server", "http-client"] }
# The official Prometheus client. hyper and its util/body crates are already in
# the tree via jsonrpsee, so the exporter adds no new transport dependency.
prometheus-client.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
futures.workspace = true
libp2p = { version = "0.57", features = [
    "tokio",
    "gossipsub",
    "kad",
    "identify",
    "noise",
    "yamux",
    "tcp",
    "macros",
    # Block sync: a peer that has a child block but not its parent fetches the
    # parent from whoever relayed the child (`src/network/sync.rs`). CBOR over
    # serde, with libp2p's own request and response size caps.
    "request-response",
    "cbor",
] }

[features]
# The XDP/AF_XDP receive path for the block relay, Linux only. Off by default,
# like `cuda-miner`'s `cuda`: without it the relay receives on a kernel UDP
# socket, and the node links neither aya nor the AF_XDP `unsafe` in
# `ebpf-net/src/linux/`.
xdp = ["maya-ebpf-net/xdp"]

[dev-dependencies]
tempfile.workspace = true
# `tests/fuzz_harness.rs` only: a seeded RNG so a soak run replays exactly. The
# coverage-guided search and its LibAFL/Z3 graph live in the out-of-workspace
# `offsec-sandbox` crate, never here — see docs/offsec-sandbox.md.
rand_chacha.workspace = true
# In-memory duplex streams, for driving the two halves of the ML-KEM handshake
# against each other without a socket. What libp2p uses for the same job.
futures_ringbuf.workspace = true
# For `tests/hybrid_parity_tests.rs`, which pins the browser SDK's copy of the
# hybrid construction against the node's authoritative one.
maya-sdk-wasm = { path = "sdk-wasm" }
# For `tests/ledger_parity_tests.rs`, which pins the Ledger app's duplicated
# COIN_TYPE against the wallet's. A dev-dependency cycle -- wallet-gui/core
# depends on this crate -- which Cargo permits, and which `maya-sdk-wasm` above
# already relies on for the same kind of parity test.
maya-wallet-core = { path = "wallet-gui/core" }
# For `tests/custody_parity_tests.rs`, which pins the threshold-custody crate's
# duplicated hybrid derivation against `crypto::hybrid`. Same arrangement as
# `maya-sdk-wasm` above and for the same reason: `custody-mpc` must not link
# RocksDB, so it reimplements the derivation and this test is what catches drift.
maya-custody-mpc = { path = "custody-mpc", default-features = false }
# For `tests/zkml_block_tests.rs`, which proves inference off-chain and then
# verifies it inside a block. Test-only: the node never links a prover.
maya-zkml-prover = { path = "zkml-prover" }
# For `tests/fee_market_tests.rs`, which runs the fee rule over real
# transaction sizes and checks nothing in consensus calls it yet.
maya-fee-market = { path = "fee-market" }
# For `tests/htlc_lattice_tests.rs`, which runs the real watcher against two
# in-process chains. A dev-dependency cycle -- the watcher depends on this
# crate -- which Cargo permits, exactly as `maya-wallet-core` above.
maya-htlc-watcher = { path = "htlc-watcher" }
# For `tests/federated_ai_tests.rs` only. Floating-point training code must not
# reach anything the node links (invariant 20).
maya-confidential-ai = { path = "confidential-ai" }
# The in-process chains in that test implement the watcher's `SwapChain`.
async-trait.workspace = true
# For `tests/threat_intel_tests.rs`, which drives the real firewall worker from
# each honest node's own state. A dev-dependency cycle, as `maya-htlc-watcher`.
maya-threat-firewall = { path = "threat-firewall" }
criterion.workspace = true
# Only for `benches/ebpf_bench.rs`: the baseline the relay's fixed header is
# measured against. No `flatc`; the bench writes its one table out by hand.
flatbuffers = "25"
# Comparison baselines for `benches/algo_comparison.rs`. Dev-only: none of this
# reaches the node binary.
#
# kHeavyHash (Kaspa) is deliberately absent, and `benches/algo_comparison.rs`
# says so in its output rather than leaving a silent gap.
#
# There is no `kheavyhash` crate. Kaspa's own `kaspa-pow` exposes the right
# thing — `Matrix::generate` plus `heavy_hash`, with an official test vector —
# but it depends unconditionally on `kaspa-hashes`, which pulls `workflow-wasm`
# and `workflow-core 0.18`, and that crate does not compile on this toolchain
# (a wasm-bindgen mismatch in code we do not control). `default-features = false`
# does not remove it.
#
# The alternative was to implement kHeavyHash from the specification. That was
# refused: with no official vectors to check against, a wrong implementation
# would publish a number misrepresenting another project's performance — the
# same failure mode that produced a guessed address domain and a guessed mix key
# earlier in this tree, both of which were only caught because an authority
# existed to test against. Here there would be none.
sha2.workspace = true
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
# Shielded tests build joinsplits directly, which means constructing field
# elements and seeding a deterministic RNG.
ark-bls12-381.workspace = true
ark-std.workspace = true
# Contract tests assemble small modules from WAT so they exercise the
# transaction path without depending on a wasm toolchain being installed.
wat.workspace = true
jsonrpsee = { workspace = true, features = ["server", "http-client"] }
# Only so `examples/gen_fuzz_corpus.rs` can build SV2 seeds through the real
# encoders rather than by hand. A dev-dependency, never a runtime one: the node
# does not speak the pool protocol.
maya-stratum-v2 = { path = "stratum-v2" }

# Argon2id over 32 MiB is unusably slow when compiled without optimization:
# an unoptimized hash runs on the order of seconds, which makes `cargo test`
# look hung rather than slow. Optimize the hash crates even in dev/test while
# leaving our own code unoptimized and debuggable.
[[bench]]
name = "argon_blake"
harness = false

# The rule that replaces ArgonBlake above the fork. Benchmarked beside it
# rather than instead of it: the comparison between the two is the point, and
# both stay in the binary permanently.
[[bench]]
name = "dag"
harness = false

[[bench]]
name = "hybrid_signing"
harness = false

[[bench]]
name = "mlkem_handshake"
harness = false

# The trading engine's arithmetic. Every node redoes a block's matching pass and
# its batch clearing, so these are validation costs, not miner costs — and the
# adversarial batch case is what justifies `MAX_BATCH_INTENTS` being a number
# rather than "as many as fit".
[[bench]]
name = "dex_matching"
harness = false

# The oracle. VRF verification is paid by every node on every block forever, and
# a feed's quorum of post-quantum signatures is the most expensive thing a
# single transaction can ask for — both are what make the per-block ceilings
# numbers rather than guesses.
[[bench]]
name = "oracle"
harness = false

# No criterion here. This one installs a counting `#[global_allocator]` to
# measure bytes rather than time, and criterion's own allocations would be
# counted alongside the work being measured.
[[bench]]
name = "hybrid_footprint"
harness = false

# ===========================================================================
# Profiles
# ===========================================================================
#
# Until this block existed there was no `[profile.dev]` and no
# `[profile.release]` at all — only the thirty per-package overrides below.
# Release builds therefore used cargo's defaults: no LTO, sixteen codegen
# units, symbols kept. And `target/` reached 316 GiB, on a volume with 85.6 GiB
# left, which is the number that forced this.

# Debug builds.
#
# `debug = "line-tables-only"` workspace-wide is the single biggest lever on
# the artifact size and on link-time memory. It keeps the file and line in a
# backtrace — which is what anyone actually reads — and drops the per-type
# records that make up the bulk of a PDB. What it costs is inspecting variables
# while stepping through a *dependency*; the per-package override on
# `custom-l1-node` below already made that trade for the node itself, for a
# harder reason (the linker refused to produce the binary at all).
#
# `incremental = true` is cargo's dev default, stated because the sccache
# question comes up: sccache does not cache incremental builds, so the two are
# mutually defeating and this tree keeps incremental.
#
# `split-debuginfo` is deliberately absent. Its accepted values and their
# meanings differ between MSVC, ELF and macOS, a cargo profile cannot be made
# conditional on the host, and `line-tables-only` has already removed most of
# what it would move.
[profile.dev]
debug = "line-tables-only"
incremental = true

# Every dependency — but not the workspace members — compiled optimized and
# without debug info.
#
# This generalises what the per-package overrides below were doing one crate at
# a time, and it is the same reasoning: unoptimized cryptography turns
# `cargo test` into something that reads as hung rather than slow (invariant 5).
# The overrides that name *workspace members* are not redundant and must stay —
# `"*"` does not match them, and invariant 2 depends on `maya-crypto-pq` in
# particular being the optimized crate.
#
# The cost is a longer cold build, measured in reports/01-foundation.md rather
# than guessed at.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Release builds: what a node operator runs.
#
# `lto = "thin"` rather than the `"fat"` the foundation brief asked for.
# Fat LTO across RocksDB, wasmtime, arkworks, halo2 and libp2p in one unit is
# an hours-long link for a single-digit gain nobody here has measured. `dist`
# below is where fat LTO lives, for tagged builds that can afford it.
#
# `panic = "abort"` is deliberately absent. Cargo applies it to a whole profile
# rather than to binaries, so it would break `cargo test` (the harness needs to
# unwind) and conflicts with the `cdylib` in `sdk-ffi` and `sdk-wasm`. A
# binary-only abort would need a separate profile and a separate build of every
# dependency; the size it saves is not worth a second full `target/`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false
strip = "debuginfo"

# Tagged and release-candidate builds: the slow, small one.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

# CI: dev semantics, nothing kept that a runner cannot use.
#
# A GitHub runner has ~14 GB of disk. Debug info is the first thing to go, and
# incremental compilation is worthless when every job starts from a cold cache.
[profile.ci]
inherits = "dev"
debug = false
incremental = false

# Fuzzing and Kani both want optimized code with assertions live.
[profile.fuzz]
inherits = "release"
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
strip = "none"

# The node binary links 183 object files, and MSVC caps how many "modules" one
# program database may hold: past it the linker stops with
# `LNK1140: limit exceeded for program database`. The tree crossed that line
# when the fourth record crate landed — nothing about any one crate, just the
# count.
#
# `line-tables-only` keeps what anyone actually reads from a debug build — file
# and line in a backtrace — and drops the per-type records that make up the bulk
# of the modules. Not a tuning knob: without it the node binary does not link on
# Windows at all, so `cargo nextest run --workspace` cannot even build.
#
# Scoped to this package rather than the profile, so every dependency keeps full
# debug info and stepping into `dex` or `ledger-math` still works.
[profile.dev.package.custom-l1-node]
debug = "line-tables-only"

[profile.dev.package.argon2]
opt-level = 3

# The GPU miner's CPU reference fill is 32768 compressions of a 1 KiB block —
# the same work `argon2` does, written out longhand so it can be read against
# the kernel. Unoptimized that is minutes per hash rather than tens of
# milliseconds, which would make the parity tests read as a hang. Same reason as
# the override above, and the same reason `maya-crypto-pq` has one: the crate
# holding the work is the crate that has to be optimized.
[profile.dev.package.maya-cuda-miner]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

# Same reasoning for signatures, and more urgently than before. ML-DSA-65 is
# an NTT and a rejection-sampling loop over 256-coefficient polynomials; the
# L2 settlement tests perform tens of thousands of sign/verify operations, and
# unoptimized lattice arithmetic turns a seconds-long test into one that reads
# as a hang. This override is what keeps `cargo test` usable at all.
[profile.dev.package.fips204]
opt-level = 3

# And for the hash-based half, but not the same way. `slh-dsa` is generic over
# its parameter set, so an override on that package optimizes a crate holding
# none of the work: measured on a dev build, signing cost 4468 ms with
# `[profile.dev.package.slh-dsa]` set and 140 ms once the *instantiating* crate
# was optimized instead. `maya-crypto-pq` exists to be that crate, and this is
# the override that matters. `sha2` is where SLH-DSA spends nearly all of its
# time once the wrapper itself is optimized.
[profile.dev.package.maya-crypto-pq]
opt-level = 3

[profile.dev.package.slh-dsa]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# And again for the SNARK stack. A joinsplit proof is ~17k constraints of
# field arithmetic; unoptimized it takes tens of seconds instead of a fraction
# of one, which makes the shielded tests look hung rather than slow.
# And for the code-based KEM. HQC-192 decapsulation runs a Reed-Muller and a
# Reed-Solomon decoder over ~18 kbit codewords; unoptimized that is tens of
# milliseconds per handshake against ML-KEM's fraction of one, which makes the
# transport tests look broken rather than slow. Measured on this machine: a
# dual handshake fell from ~66 ms to single-digit ms with these three set.
#
# `sha3`/`shake` are where HQC spends the rest of its time — the same
# relationship `sha2` has to SLH-DSA above.
[profile.dev.package.hqc-kem]
opt-level = 3

[profile.dev.package.sha3]
opt-level = 3

[profile.dev.package.shake]
opt-level = 3

[profile.dev.package.ark-ff]
opt-level = 3

[profile.dev.package.ark-ec]
opt-level = 3

[profile.dev.package.ark-poly]
opt-level = 3

[profile.dev.package.ark-bls12-381]
opt-level = 3

[profile.dev.package.ark-groth16]
opt-level = 3

[profile.dev.package.ark-crypto-primitives]
opt-level = 3

[profile.dev.package.ark-r1cs-std]
opt-level = 3

[profile.dev.package.ark-relations]
opt-level = 3

[profile.dev.package.ark-serialize]
opt-level = 3

[profile.dev.package.ark-std]
opt-level = 3

# And for the zkML verifier, on the crate that instantiates it. halo2's prover
# and verifier are generic over the commitment scheme and monomorphize into
# `maya-zkml` -- the same lesson `maya-crypto-pq` taught for SLH-DSA, where the
# override on the generic crate optimized none of the work. `halo2curves-axiom`
# is the BN254 field and pairing arithmetic, which is not generic and has to be
# optimized where it lives. Without these a single proof in the test suite
# takes long enough to read as a hang.
[profile.dev.package.maya-zkml]
opt-level = 3

# The prover monomorphizes halo2's proving generics, so it needs its own
# override for the same reason the verifier crate does.
[profile.dev.package.maya-zkml-prover]
opt-level = 3

# A claim's verification is two million i64 additions; unoptimized, every
# block test that settles a swap spends most of its time here.
[profile.dev.package.maya-htlc-lattice]
opt-level = 3

# A Ring-SIS node digest is about 900,000 i64 additions, and every test tree
# built with the research backend spends nearly all of its time there.
[profile.dev.package.maya-stateless-core]
opt-level = 3

[profile.dev.package.halo2-axiom]
opt-level = 3

[profile.dev.package.halo2curves-axiom]
opt-level = 3

[profile.dev.package.blake2b_simd]
opt-level = 3

[[bench]]
name = "algo_comparison"
harness = false

# The neural base-fee gain's cost per block and per burst, beside signed
# admission and block validation — see the file's header for why it reports
# rather than asserts.
[[bench]]
name = "gas_predictor"
harness = false

# The block relay: its fixed header against flatbuffers, the per-datagram cost
# in user space, loopback UDP, and — on Linux with `--features xdp`, root and
# `scripts/xdp_netns.sh` — kernel UDP against AF_XDP and XDP_DROP. Reports the
# generator's offered rate beside every figure and asserts no ratio.
[[bench]]
name = "ebpf_bench"
harness = false

# The root package inherits the same lint policy as every member.
[lints]
workspace = true
