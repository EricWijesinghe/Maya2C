# Maya2C reality ledger
#
# One entry per subsystem, saying what it is, which tier builds it, whether it
# is real, and what would fail if it broke. `cargo xtask coverage` reads this
# file; CI fails when an entry claims `working` or `verified` and names no test
# that exists.
#
# This file is hand-maintained. It was seeded from
# `docs/architecture-vision.md`, which stays the authority for **status** — if
# the two disagree, the document wins until somebody reconciles them in
# writing. A new subsystem lands in that document with a status tag *before* it
# lands in `Cargo.toml`, and it earns an entry here at the same time.
#
# ## Fields
#
#   id      stable kebab-case key; never renamed once referenced
#   name    the subsystem as `docs/architecture-vision.md` names it
#   domain  which section of that document it came from
#   paths   crates and files that implement it
#   tier    core | extended | frontier  (see below)
#   class   REAL | SIM | RESEARCH       (see below)
#   status  planned | stub | working | verified
#   tests   test targets that would fail if it broke. Either a path to an
#           integration test, or `crate:<package>` for a crate that unit-tests
#           itself with `#[cfg(test)]` modules.
#   gate    for the few entries verified by a command rather than a test
#           target — supply-chain gates, Kani, the bench suite.
#   note    only where this file says something the document does not
#
# ## Tiers
#
#   core       a default build compiles it: cryptography, state, consensus,
#              the VM, RPC and peer-to-peer.
#   extended   DeFi, RWA, identity, bank-rail bridges, AI, and the client and
#              service binaries.
#   frontier   hardware, space, bio and quantum work, and the simulators that
#              stand in for all of it.
#
# **A tier gates binaries, services and client surfaces. It never gates a crate
# the node links for consensus.** `crates/dex`, `crates/rwa`, `crates/identity`, `hal/iot-anchor` and
# `crates/threat-intel` all write records that sit under the state root (invariant
# 25), so a node built without one of them would compute a *different state
# root* from a node built with it — a chain split produced by a cargo flag.
# This tree already has the right mechanism for turning a subsystem off:
# an activation height of `u64::MAX`, which every node compiles identically.
# See `docs/adr/ADR-002-feature-tiers.md`.
#
# ## Classes
#
#   REAL       reachable in a default build and actually used
#   SIM        a simulator or a model; never on a production path, and it says
#              so in its own logs and CLI output
#   RESEARCH   in the tree, tested, and called by nothing in consensus —
#              usually behind an activation height of `u64::MAX`
#
# A `planned` entry has no code. Its class records the intent, not a fact about
# this tree; `status` is what you check.
#
# ## Two tables
#
# `[[feature]]` — **164 entries: the register.** Prompts 1-162 from
# `docs/trajectory.md`, plus Benchmark and Memory, which the foundation brief
# names separately. This says what the *plan* is. Prompts 1-48 are the range
# that file records as complete; 49-160 are planned; 161-162 are recorded as
# **unallocated**, because the brief's range runs to 162 and the trajectory
# defines 160. An unallocated slot is a fact. An invented deliverable would
# not be.
#
# `[[subsystem]]` — **90 entries: the ledger.** One per subsystem that exists,
# with the tests that would fail if it broke. This says what the *tree* is,
# and it is the table worth reading when the question is "does this work".
#
# Both share this schema and both are checked. The register cannot name a
# per-prompt test, because `docs/trajectory.md` records which *domain* a
# prompt belongs to and not which subsystem it produced; the entries for
# prompts 1-48 therefore name their domain's tests and say so in a note. The
# per-subsystem detail lives in the second table, which is where the real
# gate bites.
#
# `cargo xtask coverage --verify-targets` additionally asks cargo-nextest
# whether each named test is a target it would actually run. That check found
# three entries naming things cargo cannot execute on its first run — a
# directory instead of a file, a Linux-and-root-only target, and a crate
# outside the workspace. All three now name a `gate` saying what does run
# them.

