# Workspace-wide cargo configuration.
#
# Only settings that are correct on every machine belong here. Anything tuned
# to one developer's hardware goes in `~/.cargo/config.toml`, because this file
# is what a CI runner and a fresh clone both read.

# ---------------------------------------------------------------------------
# Aliases
# ---------------------------------------------------------------------------
#
# `cargo xtask <command>` — workspace automation that has to run before, or
# independently of, a full build. See `xtask/src/main.rs`.
[alias]
xtask = "run --quiet --package xtask --"

# ---------------------------------------------------------------------------
# Linkers
# ---------------------------------------------------------------------------
#
# Linking, not compiling, is what dominates an incremental build of this tree:
# the node binary alone links 183 object files, and every one of the 105 test
# targets links its own copy of the workspace.
#
# Linux: clang driving mold. Verified on this toolchain
# (rustc 1.99.0-nightly da80ed070) against mold 2.30.0 under WSL Ubuntu-24.04.
# `-Z linker-features=+lld` does not exist on this nightly, so the bundled
# rust-lld cannot be selected that way; mold is the portable choice and CI
# installs it. If you are on Linux without mold, either `apt install mold
# clang` or override this section in `~/.cargo/config.toml`.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Windows deliberately keeps MSVC `link.exe`.
#
# `[profile.dev.package.custom-l1-node] debug = "line-tables-only"` exists
# because link.exe stops with `LNK1140: limit exceeded for program database`
# past a certain module count. That workaround is calibrated to link.exe's PDB
# limits; swapping in `lld-link` changes which limit the tree hits and would
# need the whole measurement redone. It would also invalidate every fingerprint
# in a 289 GB `target/`. Not worth it for a linker change nobody has measured a
# need for. If that changes, the evidence goes in an ADR first.

# ---------------------------------------------------------------------------
# Build parallelism
# ---------------------------------------------------------------------------
#
# Bounded, because this machine runs out of *commit charge* before it runs out
# of anything else.
#
# `[profile.dev.package."*"] opt-level = 3` applies to every dependency, so a
# default build runs one rustc per logical CPU — 24 here — compiling wasmtime,
# arkworks and halo2 optimized, each mmapping a large rlib. Measured during the
# failure: 31.4 GB RAM, a 22 GB pagefile, commit limit 53.6 GB, 12.9 GB free.
# Past that, rustc fails with
#
#   error[E0786]: found invalid metadata files for crate `custom_l1_node`
#     = note: failed to mmap file '...libcustom_l1_node-*.rlib':
#             The paging file is too small for this operation to complete.
#             (os error 1455)
#
# and every other job in the build reports `can't find crate` or `required to
# be available in rlib format`. That cascade reads as a cargo, profile or
# linker bug and is none of them — see reports/02-layout.md section 1, which
# also lists three wrong diagnoses so nobody repeats them.
#
# 4 is measured, not guessed: the whole suite builds and runs at 4
# (2,515 tests, 9m 1s) and fails at 24. It is also what a GitHub runner has,
# so CI is unaffected. `CARGO_BUILD_JOBS` overrides it on a bigger machine.
#
# This is the *compiler's* memory ceiling. The linker's — `LNK1102`, which
# needed `CARGO_BUILD_JOBS=1` — is a separate problem that
# `[profile.dev] debug = "line-tables-only"` did fix.
[build]
jobs = 4
