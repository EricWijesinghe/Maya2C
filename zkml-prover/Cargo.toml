[package]
name = "maya-zkml-prover"
version = "0.1.0"
publish = false
edition = "2024"
# Higher than the workspace's 1.88, and deliberately only here. tract-onnx's
# patched releases (0.23.1+, for RUSTSEC-2026-0217) need 1.91, and the 0.21
# line's patched releases pin a `libm` that conflicts with the exact wasmtime
# the VM is pinned to. This crate is off-chain and test-only; nothing the node
# links depends on it, so the SDK wheels still build on 1.88.
rust-version = "1.91"
description = "Off-chain proving for maya-zkml: ONNX import, key generation, and proofs"

[dependencies]
maya-zkml = { path = "../zkml" }
# Same exact pin as the verifier: a prover and verifier on different halo2
# releases can disagree about a transcript.
halo2-axiom = { version = "=0.5.3", default-features = false, features = ["circuit-params"] }
# Loads the ONNX file and evaluates it, so the circuit is checked against an
# implementation that is not the circuit. Never on a consensus path: most ONNX
# models are floating point.
tract-onnx = "0.23"
# Proof blinding. Off-chain, so the OS generator is right; the verifier draws
# no randomness at all.
rand = "0.8"

[dev-dependencies]
serde_json = "1"
# Pins the committed ONNX fixture.
sha2 = "0.10"
criterion = "0.7"

[[bench]]
name = "verify"
harness = false
