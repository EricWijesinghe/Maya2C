# cargo-deny configuration.
#
# The deterministic half of the supply-chain gate in
# `.github/workflows/security-audit.yml`. `cargo geiger` surveys how much unsafe
# the dependency graph contains; this checks whether anything in that graph is
# known to be vulnerable, duplicated, or pulled from somewhere it should not be.
#
# Licence checking IS enabled, because the workflow runs
# `check advisories bans licenses sources` — omitting a `[licenses]` section
# does not disable the check, it just falls back to cargo-deny's default
# allow-list, which rejected 399 crates. The allow-list below is the set the
# tree actually resolves to, so a new licence class is a reviewable event
# rather than a silent pass.

[graph]
# The node targets Linux for deployment and is developed on Linux, macOS, and
# Windows. Restricting the graph keeps a platform-specific advisory on a crate
# we never build from failing the check.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
]
all-features = true

[advisories]
version = 2
# An advisory that has to be accepted is accepted in a commit that says why,
# never carried silently — which is what makes an entry here a reviewable event.
ignore = [
    # `ringbuf` 0.3.3, reached only through `futures_ringbuf` 0.4.0. Two reasons
    # this one cannot bite, and both have to hold for the entry to stay:
    #
    # 1. It is a dev-dependency of `crates/node` and `bins/pool-service` and of
    #    nothing else — `cargo tree -i futures_ringbuf -e normal` prints
    #    "nothing to print". No node, miner, wallet or service binary links it.
    # 2. The bug needs an element's `Drop` to panic between the in-place drop and
    #    `advance_read_index()`. `futures_ringbuf::Endpoint` is a
    #    `RingBuffer<u8>` (endpoint.rs:27-40); dropping a `u8` is a no-op that
    #    has no code to panic from, so the window does not exist for this type.
    #
    # There is no upstream fix to take: 0.4.0 is the newest `futures_ringbuf`
    # and it pins `ringbuf` 0.3. Revisit when it moves to 0.5.2 or later, or
    # replace the in-memory duplex in the transport tests with `tokio::io::duplex`.
    { id = "RUSTSEC-2026-0293", reason = "dev-dependency only, and a RingBuffer<u8> has no droppable element to panic" },
    # `atty` 0.2.14, reached only through `clap` 2 inside `dudect-bencher`, the
    # constant-time harness `maya-crypto-pq` takes as a dev-dependency
    # (`cargo tree -i atty -e normal` prints nothing). The unaligned read is on
    # Windows only, and only under a custom global allocator; no shipped binary
    # links it. Revisit when dudect-bencher leaves clap 2, or vendor the harness.
    { id = "RUSTSEC-2021-0145", reason = "dev-dependency of the dudect harness only; Windows-only, custom-allocator-only" },
    # wasmtime 48.0.1, the consensus VM's pinned engine. The fix is 48.0.3, but
    # `crates/vm/src/config.rs` records why a wasmtime bump is a hard fork: fuel
    # accounting is not stable across releases, so validators on two versions
    # can disagree about gas. Neither bug can be reached by a contract here,
    # and a test pins each reason; if one of those tests fails, the entry is
    # no longer justified:
    #
    # - 2026-0315, `call_ref` and exception `catch` dropping fuel. Until
    #   2026-09-29 `call_ref` DID validate: typed function references were on
    #   because their named setter needs the `gc` feature. `deterministic_config`
    #   now turns them off (`vm_tests::a_call_ref_module_is_rejected`), and
    #   exception handling was never enabled
    #   (`vm_tests::an_exception_handling_module_is_rejected`).
    # - 2026-0316, component-model record lifting. The component model is
    #   compiled out, and a component is rejected (`vm_tests::a_component_is_rejected`).
    #
    # Take 48.0.3 or later as a scheduled fork, with fuel calibration re-run
    # (`tests/fuel_calibration_tests.rs`) and an activation height.
    { id = "RUSTSEC-2026-0315", reason = "call_ref and exceptions cannot validate in the consensus VM; pinned by vm_tests" },
    { id = "RUSTSEC-2026-0316", reason = "component model compiled out of the consensus VM; pinned by vm_tests" },
]
# `unmaintained` is a real signal but not a vulnerability, and it fires on
# transitive crates nobody here can act on. Surfaced, not fatal.
unmaintained = "workspace"
yanked = "deny"

[bans]
# Duplicate versions are near-universal in a tree this size — the arkworks and
# libp2p stacks each pin their own. Warning keeps the drift visible without
# making the audit fail for something that is not a security property.
multiple-versions = "warn"
wildcards = "deny"
# A `{ path = "..." }` member has no version requirement, so cargo-deny counts
# every internal crate as a wildcard dependency. That fired on all five of
# ours. The rule is meant to catch `foo = "*"` against a registry, which this
# still denies.
allow-wildcard-paths = true
# A build script is arbitrary code execution at compile time. Flagging the
# highest-privilege dependencies keeps a swap in one of them from passing
# unnoticed.
highlight = "all"

[sources]
# Anything not from crates.io is something a reviewer should have chosen
# deliberately. There are no git dependencies in this tree today, and this is
# what keeps that true.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
# The exact set the graph resolves to today, enumerated from `cargo deny list`
# rather than copied from a template. Every entry is permissive; there is no
# copyleft in the tree and adding one should require editing this list. The one
# copyleft crate that exists is admitted by name below, not by license.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Boost Software License. Permissive, no copyleft, no attribution
    # requirement in binaries. Arrives through `xxhash-rust`.
    "BSL-1.0",
    # Community Data License Agreement, permissive variant. It licenses
    # *data*, not code, which is exactly what it is doing here: `webpki-roots`
    # ships Mozilla's CA certificate set. Permissive, and it places no terms
    # on the code that reads it.
    "CDLA-Permissive-2.0",
]

# `dyn-eq` (MPL-2.0), and nothing else under that license.
#
# Arrives through tract-core 0.23, which `maya-zkml-prover` needs because every
# patched release of tract 0.21 (RUSTSEC-2026-0217, an out-of-bounds read in the
# NNEF tensor parser) pins a `libm` the pinned wasmtime conflicts with. The
# choice was between an unpatched parser and this.
#
# Why a named exception and not "MPL-2.0" in `allow`:
# - MPL-2.0 is *file-level* copyleft. It binds modifications to `dyn-eq`'s own
#   files, which this project does not make; it places no terms on the code that
#   links it.
# - It is reachable only from `maya-zkml-prover`, an off-chain prover the node
#   takes as a dev-dependency. No binary this workspace ships contains it.
# - Allowing the license would admit the next MPL crate silently. Allowing the
#   crate means the next one fails this check and gets its own paragraph.
#
# Accepted by the project owner on 2026-09-12. Revisit when tract's `libm`
# conflict with the pinned wasmtime is resolved: if `maya-zkml-prover` can move
# back to a patched tract 0.21, `dyn-eq` leaves the graph and this exception
# should be deleted rather than inherited.
[[licenses.exceptions]]
crate = "dyn-eq"
allow = ["MPL-2.0"]

# The `uniffi` family (MPL-2.0), and nothing else under that license.
#
# `maya-sdk-ffi` is the uniffi bindings crate; uniffi *is* the product there,
# so this is not a dependency that could be swapped out. Nine crates because
# uniffi is split that way, not because nine decisions were made.
#
# Admitted by name rather than by adding "MPL-2.0" to `allow`, for the same
# reason `dyn-eq` is: MPL-2.0 is file-level copyleft. It binds modifications to
# uniffi's own files, which this project does not make, and places no terms on
# the code that links it — but allowing the license outright would admit the
# next MPL crate silently, and allowing the crates means the next one fails
# this check and gets its own paragraph.
#
# Found on 2026-09-20 by running `cargo deny check` for the first time in this
# phase. It was already failing: `.github/workflows/security-audit.yml` has run
# this gate all along. Revisit if `maya-sdk-ffi` ever stops shipping uniffi
# bindings.
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_bindgen"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_build"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_udl"
allow = ["MPL-2.0"]

[licenses.private]
# The workspace's own crates carry no `license` field because none of them is
# published. Skipping them here is what keeps "unlicensed" meaningful: it now
# only ever fires on a third-party crate.
ignore = true
