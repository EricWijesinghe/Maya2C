[package]
name = "maya-htlc-watcher"
version = "0.1.0"
# Not published. See stratum-v2/Cargo.toml for why cargo-deny needs this.
publish = false
edition = "2024"
rust-version = "1.88"
description = "Counterparty watcher for lattice HTLC swaps: claims on revelation, refunds on expiry"

[lib]
name = "maya_htlc_watcher"
path = "src/lib.rs"

[[bin]]
name = "htlc-watcher"
path = "src/bin/htlc-watcher.rs"

[dependencies]
# Transactions, signing, and the lock id derivation. The same arrangement as
# `pool-service`: this is the layer where a watcher's decision becomes a signed
# chain transaction, and a second copy of the transaction format would drift.
custom-l1-node = { path = ".." }
maya-htlc-lattice = { path = "../htlc-lattice" }
# The keystore format, reused rather than reimplemented — see pool-service.
l1-wallet = { path = "../wallet" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
jsonrpsee = { version = "0.26", features = ["http-client"] }
# `SwapChain` is held as a trait object so the worker can be driven by an
# in-process chain in tests; native async fns in traits are not dyn-compatible.
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
