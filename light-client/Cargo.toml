[package]
name = "maya-light-client"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "SPV light client: header-chain fork choice and state-proof verification without a full node"

[dependencies]
# The chain types, the proof-of-work rule, and the state proof format. A light
# client that reimplemented any of the three would be a second definition of
# consensus, and the second definition is the one that is wrong.
#
# It does *not* pull RocksDB into a light client's runtime: the dependency is
# on the crate, but nothing here opens a database. A light client that had to
# carry the full node's storage would not be light.
custom-l1-node = { path = ".." }
hex.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Account addresses for `tests/stateless_memory.rs`.
blake3.workspace = true
