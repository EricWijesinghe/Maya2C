[package]
name = "maya-crypto-pq"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

# Why this is a crate and not a module in `custom-l1-node::crypto`.
#
# `slh-dsa` is generic over `ParameterSet`, so its hot code monomorphizes into
# whichever crate *instantiates* it. A `[profile.dev.package.slh-dsa]` override
# — the trick that keeps `fips204` usable in dev builds — therefore does nothing
# here: it optimizes a crate that contains none of the work. Measured on a dev
# build, signing cost 4468 ms with that override in place and 140 ms once the
# instantiating crate was optimized instead.
#
# So the instantiation is confined to this crate, behind a concrete, non-generic
# API, and the root Cargo.toml optimizes *this* crate in dev. That keeps the
# node's own code unoptimized and debuggable, which is the property the root
# profile overrides exist to preserve.
[dependencies]
# Pure Rust, which the Dockerfile's static-musl build depends on. The PQClean
# bindings (pqcrypto-sphincsplus) would add a C toolchain and an unsafe FFI
# surface to a build that currently links only RocksDB's C++ — the same trade
# that was declined for fips204.
#
# Pinned exactly. This is a release candidate on a pre-1.0 line, and it sits in
# the consensus path: a patch bump that changed an encoding would silently fork
# the chain. The pin is what makes that a build failure instead.
slh-dsa = { version = "=0.2.0-rc.5", features = ["zeroize"] }

# ML-KEM-768 (FIPS 203), the transport's key encapsulation.
#
# `ml-kem`, not `pqcrypto-kyber`: the latter implements round-3 Kyber, whose
# last release predates FIPS 203 and whose shared-secret derivation, encodings
# and key format the standard changed. It is not ML-KEM and must not be labelled
# as such. Pure Rust, for the same static-musl reason as the rest of this crate.
ml-kem = { version = "=0.3.2", features = ["getrandom", "zeroize"] }
# HQC-192 (draft FIPS 207), the transport's second key encapsulation.
#
# RustCrypto, the same organisation as `ml-kem` above, and pure Rust for the
# same static-musl reason as the rest of this crate. `pqcrypto-hqc` is PQClean
# C bindings and was excluded on that ground; `pqc-kem`'s `hqc` feature is a
# shim over liboqs, which is the same objection wearing a Rust name.
#
# Pinned exactly. This is a release candidate tracking a *draft* standard, and
# it sits under the transport: a patch bump that moved a parameter or an
# encoding would silently break every connection between mismatched nodes. The
# pin makes that a build failure. The same reasoning as `slh-dsa` above, with
# more force — FIPS 203 was final when `ml-kem` was pinned; FIPS 207 is not.
hqc-kem = "=0.1.0-rc.0"
# The RNG trait `hqc-kem` takes for key generation and encapsulation.
#
# A deliberate exception to the root manifest's rule that entropy comes straight
# from the OS rather than through an RNG trait crate. `hqc-kem` takes
# `&mut impl rand::CryptoRng`, so there is no door that skips it. `SysRng` is
# `getrandom` wearing the trait — the same source the rule prefers — so the
# exception costs a trait bound, not an entropy source.
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
# For `UnwrapErr`, which adapts the fallible OS generator to the infallible
# `CryptoRng` bound `hqc-kem` requires. See `hqc::os_rng`.
rand_core = { version = "0.10", default-features = false }
blake3.workspace = true
zeroize.workspace = true
getrandom.workspace = true
thiserror.workspace = true

[lints]
workspace = true
