<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">Transaction path</title>
<desc id="d">Animated card: wallet, gateway, node, VM, DAG-BFT, finality</desc>
<defs>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1fb5c2" stop-opacity=".35"/>
    <stop offset="1" stop-color="#1fb5c2" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="420" rx="24" fill="#050b0f" stroke="#1fb5c2" stroke-opacity=".5" stroke-width="2"/>
<circle cx="600" cy="205" r="520" fill="url(#halo)"><animate attributeName="opacity" values=".5;1;.5" dur="5s" repeatCount="indefinite"/></circle>
<text x="40" y="70" font-size="26" font-weight="700" fill="#edf3f2" font-family="Segoe UI, Helvetica, Arial, sans-serif">One transaction, end to end</text>
<text x="40" y="100" font-size="16" fill="#c9a86a" font-family="Segoe UI, Helvetica, Arial, sans-serif">Source: README.md mermaid diagram, docs/hybrid-signatures.md</text>
<path d="M190 205.0 H240" stroke="#1fb5c2" stroke-width="2" opacity=".35" fill="none"/><path d="M390 205.0 H440" stroke="#1fb5c2" stroke-width="2" opacity=".35" fill="none"/><path d="M590 205.0 H640" stroke="#1fb5c2" stroke-width="2" opacity=".35" fill="none"/><path d="M790 205.0 H840" stroke="#1fb5c2" stroke-width="2" opacity=".35" fill="none"/><path d="M990 205.0 H1040" stroke="#1fb5c2" stroke-width="2" opacity=".35" fill="none"/>
<g filter="url(#glow)"><rect x="40" y="150" width="150" height="110" rx="14" fill="#0a161b" stroke="#1fb5c2" stroke-width="2"/><text x="115.0" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#edf3f2" font-family="Segoe UI, Helvetica, Arial, sans-serif">Wallet</text><text x="115.0" y="230" text-anchor="middle" font-size="14" fill="#1fb5c2" font-family="Segoe UI, Helvetica, Arial, sans-serif">signs the transaction</text></g><g filter="url(#glow)"><rect x="240" y="150" width="150" height="110" rx="14" fill="#0a161b" stroke="#1fb5c2" stroke-width="2"/><text x="315.0" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#edf3f2" font-family="Segoe UI, Helvetica, Arial, sans-serif">API gateway</text><text x="315.0" y="230" text-anchor="middle" font-size="14" fill="#1fb5c2" font-family="Segoe UI, Helvetica, Arial, sans-serif">default-deny allowlist</text></g><g filter="url(#glow)"><rect x="440" y="150" width="150" height="110" rx="14" fill="#0a161b" stroke="#c9a86a" stroke-width="2"/><text x="515.0" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#edf3f2" font-family="Segoe UI, Helvetica, Arial, sans-serif">Node</text><text x="515.0" y="230" text-anchor="middle" font-size="14" fill="#c9a86a" font-family="Segoe UI, Helvetica, Arial, sans-serif">verify ML-DSA-65 and SLH-DSA</text></g><g filter="url(#glow)"><rect x="640" y="150" width="150" height="110" rx="14" fill="#0a161b" stroke="#1fb5c2" stroke-width="2"/><text x="715.0" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#edf3f2" font-family="Segoe UI, Helvetica, Arial, sans-serif">WASM VM</text><text x="715.0" y="230" text-anchor="middle" font-size="14" fill="#1fb5c2" font-family="Segoe UI, Helvetica, Arial, sans-serif">fee market, state root</text></g><g filter="url(#glow)"><rect x="840" y="150" width="150" height="110" rx="14" fill="#0a161b" stroke="#7eeaf0" stroke-width="2"/><text x="915.0" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#edf3f2" font-family="Segoe UI, Helvetica, Arial, sans-serif">DAG-BFT</text><text x="915.0" y="230" text-anchor="middle" font-size="14" fill="#7eeaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Narwhal + Bullshark</text></g><g filter="url(#glow)"><rect x="1040" y="150" width="150" height="110" rx="14" fill="#0a161b" stroke="#7eeaf0" stroke-width="2"/><text x="1115.0" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#edf3f2" font-family="Segoe UI, Helvetica, Arial, sans-serif">Finalized</text><text x="1115.0" y="230" text-anchor="middle" font-size="14" fill="#7eeaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">state committed</text></g>
<circle r="5" fill="#7eeaf0" filter="url(#glow)"><animateMotion dur="5s" begin="0.00s" repeatCount="indefinite" path="M40 205 H1090"/></circle><circle r="5" fill="#7eeaf0" filter="url(#glow)"><animateMotion dur="5s" begin="-0.80s" repeatCount="indefinite" path="M40 205 H1090"/></circle><circle r="5" fill="#7eeaf0" filter="url(#glow)"><animateMotion dur="5s" begin="-1.60s" repeatCount="indefinite" path="M40 205 H1090"/></circle><circle r="5" fill="#7eeaf0" filter="url(#glow)"><animateMotion dur="5s" begin="-2.40s" repeatCount="indefinite" path="M40 205 H1090"/></circle><circle r="5" fill="#7eeaf0" filter="url(#glow)"><animateMotion dur="5s" begin="-3.20s" repeatCount="indefinite" path="M40 205 H1090"/></circle><circle r="5" fill="#7eeaf0" filter="url(#glow)"><animateMotion dur="5s" begin="-4.00s" repeatCount="indefinite" path="M40 205 H1090"/></circle>
<text x="40" y="340" font-size="16" fill="#edf3f2" fill-opacity=".8" font-family="Segoe UI, Helvetica, Arial, sans-serif">Every transaction carries two signatures. Both must verify before the VM runs.</text>
<text x="40" y="372" font-size="16" fill="#c9a86a" font-family="Consolas, Menlo, monospace">11,165 bytes of signature per transaction</text>
</svg>
