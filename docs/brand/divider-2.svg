<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" role="img" aria-labelledby="t d">
<title id="t">Divider</title>
<desc id="d">Animated neon circuit divider</desc>
<defs>
  <linearGradient id="aur" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a855f7"/><stop offset=".5" stop-color="#1fb5c2"/><stop offset="1" stop-color="#c9a86a"/>
  </linearGradient>
  <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="circ" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M0 30H25M35 30H60M30 0V25M30 35V60" stroke="#a855f7" stroke-opacity=".08" fill="none"/>
    <circle cx="30" cy="30" r="2" fill="#1fb5c2" fill-opacity=".15"/>
  </pattern>
  
</defs>
<rect width="1200" height="60" fill="#060611"/>
<path d="M0 30H120L140 50H360L380 10H580L600 40H800L820 20H1000L1020 50H1200" fill="none" stroke="#a855f7" stroke-opacity=".2" stroke-width="2"/>
<path d="M0 30H120L140 50H360L380 10H580L600 40H800L820 20H1000L1020 50H1200" fill="none" stroke="url(#aur)" stroke-width="3" stroke-linecap="round" stroke-dasharray="90 1200" filter="url(#neon)"><animate attributeName="stroke-dashoffset" from="1290" to="0" dur="4s" begin="-2s" repeatCount="indefinite"/></path>
<rect x="196" y="26" width="8" height="8" fill="#a855f7" filter="url(#neon)"><animate attributeName="opacity" values="1;.25;1;1;.6;1" dur="2.0s" repeatCount="indefinite"/></rect><rect x="436" y="26" width="8" height="8" fill="#1fb5c2" filter="url(#neon)"><animate attributeName="opacity" values="1;.25;1;1;.6;1" dur="2.4s" repeatCount="indefinite"/></rect><rect x="656" y="26" width="8" height="8" fill="#c9a86a" filter="url(#neon)"><animate attributeName="opacity" values="1;.25;1;1;.6;1" dur="2.8s" repeatCount="indefinite"/></rect><rect x="876" y="26" width="8" height="8" fill="#a855f7" filter="url(#neon)"><animate attributeName="opacity" values="1;.25;1;1;.6;1" dur="3.2s" repeatCount="indefinite"/></rect><rect x="1036" y="26" width="8" height="8" fill="#1fb5c2" filter="url(#neon)"><animate attributeName="opacity" values="1;.25;1;1;.6;1" dur="3.6s" repeatCount="indefinite"/></rect>
<circle r="3" fill="#edf3f2" filter="url(#neon)"><animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M0 30H120L140 50H360L380 10H580L600 40H800L820 20H1000L1020 50H1200"/></circle>
</svg>
