<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Transaction lifecycle</title>
<desc id="d">A transaction is signed with ML-DSA-65 and SLH-DSA, submitted through the gateway, admitted to the mempool after both signatures verify, gossiped, ordered by DAG-BFT, re-verified and executed in apply_block_journaled, and committed with its state root. Below, the hybrid check: ML-DSA-65 first, then SLH-DSA; either failure rejects.</desc>
<style>
  text { font-family: Manrope, Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #eef3f3; }
  .n { font-size: 13px; font-weight: 800; fill: #2cc3cf; }
  .nb { font-size: 13px; font-weight: 800; fill: #d9b97a; }
  .h { font-size: 15px; font-weight: 700; }
  .s { font-size: 11.5px; fill: #b9c6ca; }
  .p { font-size: 10.5px; fill: #8a9ca3; font-family: ui-monospace, Consolas, monospace; }
  .box { fill: #0c171d; stroke: #2cc3cf; stroke-width: 1.5; }
  .pq { fill: #1d1709; stroke: #d9b97a; stroke-width: 1.8; }
  .bad { fill: #1f0d0b; stroke: #ff7a6b; stroke-width: 1.5; }
  .ok { fill: #0b1f17; stroke: #4fe3a5; stroke-width: 1.5; }
  .wire { stroke: #8a9ca3; stroke-width: 1.5; fill: none; marker-end: url(#a); }
  .no { stroke: #ff7a6b; stroke-width: 1.5; fill: none; marker-end: url(#r); stroke-dasharray: 5 4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a9ca3"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7a6b"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="558" rx="22" fill="#050b0f" stroke="#2cc3cf" stroke-opacity=".35" stroke-width="2"/>
<text x="30" y="38" font-size="20" font-weight="800">One transaction, end to end</text>
<text x="1170" y="38" text-anchor="end" class="s">bronze = a step where both post-quantum signatures are checked or made</text>

<g>
  <rect class="pq" x="30" y="62" width="150" height="150" rx="10"/>
  <text x="44" y="86" class="nb">1</text><text x="105" y="108" text-anchor="middle" class="h">Sign</text>
  <text x="105" y="132" text-anchor="middle" class="s">ML-DSA-65 and</text><text x="105" y="148" text-anchor="middle" class="s">SLH-DSA over the</text><text x="105" y="164" text-anchor="middle" class="s">same bytes + chain tag</text>
  <text x="105" y="196" text-anchor="middle" class="p">HybridSigningKey</text>

  <rect class="box" x="195" y="62" width="150" height="150" rx="10"/>
  <text x="209" y="86" class="n">2</text><text x="270" y="108" text-anchor="middle" class="h">Submit</text>
  <text x="270" y="132" text-anchor="middle" class="s">gateway allowlist,</text><text x="270" y="148" text-anchor="middle" class="s">then node JSON-RPC</text><text x="270" y="164" text-anchor="middle" class="s">rate limit per IP</text>
  <text x="270" y="196" text-anchor="middle" class="p">crates/api-gateway</text>

  <rect class="pq" x="360" y="62" width="150" height="150" rx="10"/>
  <text x="374" y="86" class="nb">3</text><text x="435" y="108" text-anchor="middle" class="h">Admit</text>
  <text x="435" y="132" text-anchor="middle" class="s">both signatures,</text><text x="435" y="148" text-anchor="middle" class="s">nonce, fee, balance,</text><text x="435" y="164" text-anchor="middle" class="s">circuit breaker</text>
  <text x="435" y="196" text-anchor="middle" class="p">Mempool::insert</text>

  <rect class="box" x="525" y="62" width="150" height="150" rx="10"/>
  <text x="539" y="86" class="n">4</text><text x="600" y="108" text-anchor="middle" class="h">Gossip</text>
  <text x="600" y="132" text-anchor="middle" class="s">libp2p peers over</text><text x="600" y="148" text-anchor="middle" class="s">ML-KEM sessions</text><text x="600" y="164" text-anchor="middle" class="s">layered on Noise</text>
  <text x="600" y="196" text-anchor="middle" class="p">network/pq</text>

  <rect class="box" x="690" y="62" width="150" height="150" rx="10"/>
  <text x="704" y="86" class="n">5</text><text x="765" y="108" text-anchor="middle" class="h">Order</text>
  <text x="765" y="132" text-anchor="middle" class="s">DAG-BFT vertices,</text><text x="765" y="148" text-anchor="middle" class="s">Bullshark commit,</text><text x="765" y="164" text-anchor="middle" class="s">stake-weighted</text>
  <text x="765" y="196" text-anchor="middle" class="p">crates/dag-bft</text>

  <rect class="pq" x="855" y="62" width="150" height="150" rx="10"/>
  <text x="869" y="86" class="nb">6</text><text x="930" y="108" text-anchor="middle" class="h">Execute</text>
  <text x="930" y="132" text-anchor="middle" class="s">verify again, run</text><text x="930" y="148" text-anchor="middle" class="s">the VM, recompute</text><text x="930" y="164" text-anchor="middle" class="s">the state root</text>
  <text x="930" y="196" text-anchor="middle" class="p">apply_block_journaled</text>

  <rect class="ok" x="1020" y="62" width="150" height="150" rx="10"/>
  <text x="1034" y="86" class="n">7</text><text x="1095" y="108" text-anchor="middle" class="h">Finalized</text>
  <text x="1095" y="132" text-anchor="middle" class="s">block and state</text><text x="1095" y="148" text-anchor="middle" class="s">commit in one batch</text><text x="1095" y="164" text-anchor="middle" class="s">(invariant 26)</text>
  <text x="1095" y="196" text-anchor="middle" class="p">WriteBatch</text>
</g>
<path class="wire" d="M181 137H193"/><path class="wire" d="M346 137H358"/><path class="wire" d="M511 137H523"/><path class="wire" d="M676 137H688"/><path class="wire" d="M841 137H853"/><path class="wire" d="M1006 137H1018"/>
<text x="930" y="236" text-anchor="middle" class="s">a state root execution does not reproduce is refused (invariant 24)</text>

<text x="30" y="282" font-size="17" font-weight="800">The hybrid check, steps 3 and 6</text>
<text x="30" y="304" class="p">HybridVerifyingKey::verify · crates/node/src/crypto/hybrid.rs</text>
<rect class="box" x="30" y="330" width="210" height="80" rx="10"/>
<text x="135" y="362" text-anchor="middle" class="h">signing_bytes</text><text x="135" y="384" text-anchor="middle" class="s">commits to both keys</text><text x="135" y="400" text-anchor="middle" class="s">and the chain tag</text>
<rect class="pq" x="290" y="330" width="240" height="80" rx="10"/>
<text x="410" y="362" text-anchor="middle" class="h">ML-DSA-65 verify</text><text x="410" y="384" text-anchor="middle" class="s">lattice, FIPS 204</text><text x="410" y="400" text-anchor="middle" class="s">runs first, fails fast</text>
<rect class="pq" x="580" y="330" width="240" height="80" rx="10"/>
<text x="700" y="362" text-anchor="middle" class="h">SLH-DSA-SHA2-128s verify</text><text x="700" y="384" text-anchor="middle" class="s">hash-based, FIPS 205</text><text x="700" y="400" text-anchor="middle" class="s">a different assumption</text>
<rect class="ok" x="870" y="330" width="300" height="80" rx="10"/>
<text x="1020" y="362" text-anchor="middle" class="h">Accepted</text><text x="1020" y="384" text-anchor="middle" class="s">only when both verify:</text><text x="1020" y="400" text-anchor="middle" class="s">no frame carries just one signature</text>
<path class="wire" d="M241 370H288"/><path class="wire" d="M531 370H578"/><path class="wire" d="M821 370H868"/>
<rect class="bad" x="290" y="450" width="240" height="56" rx="10"/>
<text x="410" y="474" text-anchor="middle" class="h">Rejected</text><text x="410" y="494" text-anchor="middle" class="p">SignatureVerification</text>
<rect class="bad" x="580" y="450" width="240" height="56" rx="10"/>
<text x="700" y="474" text-anchor="middle" class="h">Rejected</text><text x="700" y="494" text-anchor="middle" class="p">HashSignatureVerification</text>
<path class="no" d="M410 411V448"/><path class="no" d="M700 411V448"/>
<text x="870" y="462" class="s">Measured cost (docs/hybrid-signatures.md):</text>
<text x="870" y="482" class="s">public key 1,984 B · signature 11,165 B</text>
<text x="870" y="502" class="s">one-output transfer 13,215 B</text>
<text x="30" y="540" class="s">Two distinct errors on purpose: operators must know which scheme failed.</text>
</svg>
