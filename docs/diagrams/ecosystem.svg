<rect class="v" x="125" y="314" width="70" height="18" rx="9"/><text x="160" y="327" text-anchor="middle" class="vt">verified</text></g>

<g><rect class="card" x="935" y="260" width="210" height="80" rx="10"/><text x="1040" y="288" text-anchor="middle" class="h">Ledger app</text><text x="1040" y="306" text-anchor="middle" class="p">apps/ledger-maya2c</text>
<rect class="w" x="1005" y="314" width="70" height="18" rx="9"/><text x="1040" y="327" text-anchor="middle" class="wt">working</text></g>

<g><rect class="card" x="85" y="440" width="210" height="80" rx="10"/><text x="190" y="468" text-anchor="middle" class="h">SDKs</text><text x="190" y="486" text-anchor="middle" class="p">sdks/sdk-ffi · sdk-wasm · sdk-js</text>
<rect class="v" x="155" y="494" width="70" height="18" rx="9"/><text x="190" y="507" text-anchor="middle" class="vt">verified</text></g>

<g><rect class="card" x="480" y="455" width="240" height="80" rx="10"/><text x="600" y="483" text-anchor="middle" class="h">MCP server → AI agents</text><text x="600" y="501" text-anchor="middle" class="p">bins/maya2c-mcp · reads, drafts, no keys</text>
<rect class="w" x="565" y="509" width="70" height="18" rx="9"/><text x="600" y="522" text-anchor="middle" class="wt">working</text></g>

<g><rect class="card" x="905" y="440" width="210" height="80" rx="10"/><text x="1010" y="468" text-anchor="middle" class="h">Sentinel</text><text x="1010" y="486" text-anchor="middle" class="p">apps/sentinel · read-only watchdog</text>
<rect class="w" x="975" y="494" width="70" height="18" rx="9"/><text x="1010" y="507" text-anchor="middle" class="wt">working</text></g>

<text x="600" y="566" text-anchor="middle" class="s">Status meanings: planned · stub · working · verified (a named test exists). Research = tested, called by nothing in consensus.</text>
</svg>
