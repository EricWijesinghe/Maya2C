<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d">
<title id="t">Maya2C ecosystem map</title>
<desc id="d">The chain at the centre, reached through the API gateway, with the wallet, Ledger app, chat, Hub, explorer, SDKs, MCP server for AI agents and the sentinel around it. Each carries its status from features.toml.</desc>
<style>
  text { font-family: Manrope, Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #eef3f3; }
  .h { font-size: 15px; font-weight: 700; }
  .p { font-size: 10.5px; fill: #8a9ca3; font-family: ui-monospace, Consolas, monospace; }
  .s { font-size: 11.5px; fill: #b9c6ca; }
  .card { fill: #0c171d; stroke: #2cc3cf; stroke-width: 1.4; }
  .spoke { stroke: #2cc3cf; stroke-opacity: .35; stroke-width: 1.5; }
  .v { fill: #0b1f17; stroke: #4fe3a5; } .vt { fill: #4fe3a5; font-size: 10.5px; font-weight: 700; }
  .w { fill: #0b1a24; stroke: #8fb4ff; } .wt { fill: #8fb4ff; font-size: 10.5px; font-weight: 700; }
  .pl { fill: #1a1a1a; stroke: #8a9ca3; } .plt { fill: #b9c6ca; font-size: 10.5px; font-weight: 700; }
</style>
<rect width="1200" height="580" fill="#050b0f"/>
<text x="30" y="38" font-size="20" font-weight="800">Ecosystem map</text>
<text x="1170" y="38" text-anchor="end" class="s">status chips are the features.toml values at this commit</text>

<g>
  <line class="spoke" x1="600" y1="300" x2="190" y2="120"/><line class="spoke" x1="600" y1="300" x2="600" y2="105"/><line class="spoke" x1="600" y1="300" x2="1010" y2="120"/>
  <line class="spoke" x1="600" y1="300" x2="160" y2="300"/><line class="spoke" x1="600" y1="300" x2="1040" y2="300"/>
  <line class="spoke" x1="600" y1="300" x2="190" y2="480"/><line class="spoke" x1="600" y1="300" x2="600" y2="495"/><line class="spoke" x1="600" y1="300" x2="1010" y2="480"/>
</g>

<circle cx="600" cy="300" r="112" fill="#12232b" stroke="#d9b97a" stroke-width="2"/>
<circle cx="600" cy="300" r="96" fill="none" stroke="#2cc3cf" stroke-opacity=".5" stroke-dasharray="4 6"/>
<text x="600" y="282" text-anchor="middle" font-size="20" font-weight="800">Maya2C</text>
<text x="600" y="304" text-anchor="middle" class="s">DAG-BFT · WASM VM</text>
<text x="600" y="322" text-anchor="middle" class="s">ML-DSA-65 + SLH-DSA</text>
<text x="600" y="346" text-anchor="middle" class="p">via api-gateway (verified)</text>

<g><rect class="card" x="85" y="80" width="210" height="80" rx="10"/><text x="190" y="108" text-anchor="middle" class="h">Maya2C Wallet</text><text x="190" y="126" text-anchor="middle" class="p">apps/wallet-gui · bins/l1-wallet</text>
<rect class="v" x="155" y="134" width="70" height="18" rx="9"/><text x="190" y="147" text-anchor="middle" class="vt">verified</text></g>

<g><rect class="card" x="495" y="65" width="210" height="80" rx="10"/><text x="600" y="93" text-anchor="middle" class="h">Maya2C Chat</text><text x="600" y="111" text-anchor="middle" class="p">apps/chat · apps/chat-gui</text>
<rect class="w" x="540" y="119" width="120" height="18" rx="9"/><text x="600" y="132" text-anchor="middle" class="wt">working · research</text></g>

<g><rect class="card" x="905" y="80" width="210" height="80" rx="10"/><text x="1010" y="108" text-anchor="middle" class="h">Maya2C Hub</text><text x="1010" y="126" text-anchor="middle" class="p">apps/hub · miner + app launcher</text>
