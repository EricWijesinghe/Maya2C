<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1776" width="420" height="1776" role="img" aria-labelledby="t d">
<title id="t">Maya2C system architecture (phone layout)</title>
<desc id="d">Apps call the API gateway and node RPC; inside the node, the mempool feeds DAG-BFT ordering, the WASM VM executes, and state commits a state root; libp2p with ML-KEM over Noise carries peers; ML-DSA-65, SLH-DSA and ledger-math sit underneath.</desc>
<style>
  text { font-family: Manrope, Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #eef3f3; }
  .h { font-size: 19px; font-weight: 700; }
  .s { font-size: 15px; fill: #b9c6ca; }
  .p { font-size: 14px; fill: #8a9ca3; font-family: ui-monospace, Consolas, monospace; }
  .lane { font-size: 13px; font-weight: 700; fill: #8a9ca3; letter-spacing: 1.5px; }
  .n { font-size: 17px; font-weight: 800; fill: #2cc3cf; }
  .nb { font-size: 17px; font-weight: 800; fill: #d9b97a; }
  .box { fill: #0c171d; stroke: #2cc3cf; stroke-width: 1.5; }
  .core { fill: #12232b; stroke: #8ff0f5; stroke-width: 1.5; }
  .pq { fill: #1d1709; stroke: #d9b97a; stroke-width: 1.5; }
  .bad { fill: #1f0d0b; stroke: #ff7a6b; stroke-width: 1.5; }
  .ok { fill: #0b1f17; stroke: #4fe3a5; stroke-width: 1.5; }
  .wire { stroke: #8a9ca3; stroke-width: 1.5; fill: none; marker-end: url(#a); }
  .no { stroke: #ff7a6b; stroke-width: 1.5; fill: none; marker-end: url(#r); stroke-dasharray: 5 4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a9ca3"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7a6b"/></marker>
</defs>
<rect x="1" y="1" width="418" height="1774" rx="18" fill="#050b0f" stroke="#2cc3cf" stroke-opacity=".35"/>
<text x="20" y="40" font-size="22" font-weight="800">System architecture</text>
<text x="20" y="64" class="s">Names match the crates.</text>
<text x="20" y="100" class="lane">APPS</text>
<rect class="box" x="20" y="110" width="184" height="72" rx="10"/><text x="112" y="140" text-anchor="middle" class="h">Maya2C Wallet</text><text x="112" y="162" text-anchor="middle" class="p">apps/wallet-gui</text>
<rect class="box" x="216" y="110" width="184" height="72" rx="10"/><text x="308" y="140" text-anchor="middle" class="h">Maya2C Chat</text><text x="308" y="162" text-anchor="middle" class="p">apps/chat-gui</text>
<rect class="box" x="20" y="196" width="184" height="72" rx="10"/><text x="112" y="226" text-anchor="middle" class="h">Maya2C Hub</text><text x="112" y="248" text-anchor="middle" class="p">apps/hub</text>
<rect class="box" x="216" y="196" width="184" height="72" rx="10"/><text x="308" y="226" text-anchor="middle" class="h">Explorer</text><text x="308" y="248" text-anchor="middle" class="p">apps/explorer</text>
<rect class="box" x="20" y="282" width="184" height="72" rx="10"/><text x="112" y="312" text-anchor="middle" class="h">SDKs</text><text x="112" y="334" text-anchor="middle" class="p">sdks/</text>
<rect class="box" x="216" y="282" width="184" height="72" rx="10"/><text x="308" y="312" text-anchor="middle" class="h">MCP server</text><text x="308" y="334" text-anchor="middle" class="p">bins/maya2c-mcp</text>
<path class="wire" d="M210 358V382"/>
<text x="20" y="406" class="lane">EDGE</text>
<rect class="box" x="20" y="416" width="380" height="96" rx="10"/><text x="210" y="446" text-anchor="middle" class="h">API gateway · REST + GraphQL</text><text x="210" y="470" text-anchor="middle" class="s">default-deny method allowlist</text><text x="210" y="492" text-anchor="middle" class="p">crates/api-gateway</text>
<rect class="box" x="20" y="524" width="380" height="96" rx="10"/><text x="210" y="554" text-anchor="middle" class="h">Node JSON-RPC</text><text x="210" y="578" text-anchor="middle" class="s">per-IP rate limiter</text><text x="210" y="600" text-anchor="middle" class="p">crates/node/src/rpc</text>
<path class="wire" d="M210 622V646"/>
<text x="20" y="670" class="lane">NODE · bins/maya2c-node + crates/node</text>
<rect class="core" x="36" y="698" width="348" height="117" rx="10"/><text x="210" y="728" text-anchor="middle" class="h">Mempool</text><text x="210" y="752" text-anchor="middle" class="s">admission: both signatures,</text><text x="210" y="773" text-anchor="middle" class="s">nonce, balance, breaker</text><text x="210" y="795" text-anchor="middle" class="p">network/mempool.rs</text>
<path class="wire" d="M210 817V839"/>
<rect class="core" x="36" y="843" width="348" height="117" rx="10"/><text x="210" y="873" text-anchor="middle" class="h">DAG-BFT</text><text x="210" y="897" text-anchor="middle" class="s">Narwhal + Bullshark,</text><text x="210" y="918" text-anchor="middle" class="s">stake-weighted finality</text><text x="210" y="940" text-anchor="middle" class="p">crates/dag-bft · bft.rs</text>
<path class="wire" d="M210 962V984"/>
<rect class="core" x="36" y="988" width="348" height="117" rx="10"/><text x="210" y="1018" text-anchor="middle" class="h">WASM VM</text><text x="210" y="1042" text-anchor="middle" class="s">metered gas, fee market,</text><text x="210" y="1063" text-anchor="middle" class="s">contracts</text><text x="210" y="1085" text-anchor="middle" class="p">crates/vm · crates/fee-market</text>
<path class="wire" d="M210 1107V1129"/>
<rect class="core" x="36" y="1133" width="348" height="117" rx="10"/><text x="210" y="1163" text-anchor="middle" class="h">State</text><text x="210" y="1187" text-anchor="middle" class="s">RocksDB, journaled apply,</text><text x="210" y="1208" text-anchor="middle" class="s">state root must reproduce</text><text x="210" y="1230" text-anchor="middle" class="p">crates/node/src/state</text>
<rect x="20" y="680" width="380" height="588" rx="14" fill="none" stroke="#2cc3cf" stroke-opacity=".45" stroke-dasharray="6 5"/>
<path class="wire" d="M210 1270V1294"/>
<text x="20" y="1318" class="lane">PEERS</text>
<rect class="pq" x="20" y="1328" width="380" height="138" rx="10"/><text x="210" y="1358" text-anchor="middle" class="h">libp2p · TCP + WebSocket</text><text x="210" y="1382" text-anchor="middle" class="s">ML-KEM-1024 (768 fallback)</text><text x="210" y="1403" text-anchor="middle" class="s">layered over Noise; gossip scoring,</text><text x="210" y="1424" text-anchor="middle" class="s">chain tag bound into the handshake</text><text x="210" y="1446" text-anchor="middle" class="p">crates/node/src/network/pq</text>
<text x="20" y="1506" class="lane">CRYPTO AND MONEY MATH</text>
<rect class="pq" x="20" y="1516" width="380" height="72" rx="10"/><text x="210" y="1546" text-anchor="middle" class="h">ML-DSA-65 · FIPS 204</text><text x="210" y="1568" text-anchor="middle" class="p">lattice half of every signature</text>
<rect class="pq" x="20" y="1600" width="380" height="72" rx="10"/><text x="210" y="1630" text-anchor="middle" class="h">SLH-DSA-SHA2-128s · FIPS 205</text><text x="210" y="1652" text-anchor="middle" class="p">hash-based half · crates/crypto-pq</text>
<rect class="pq" x="20" y="1684" width="380" height="72" rx="10"/><text x="210" y="1714" text-anchor="middle" class="h">ledger-math · amount</text><text x="210" y="1736" text-anchor="middle" class="p">checked 256-bit money math, Kani</text>
</svg>
