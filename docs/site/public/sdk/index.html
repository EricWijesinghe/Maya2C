<!doctype html>
<!--
  Go vanity import for `maya2c.dev/sdk` (sdks/go). `go get` fetches
  https://maya2c.dev/sdk?go-get=1 and reads the go-import tag; the fourth
  field names the repository subdirectory, which Go 1.25 and later honour.
  Older Go ignores it and fails to resolve, so the README states Go 1.25.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="go-import" content="maya2c.dev/sdk git https://github.com/EricWijesinghe/Maya2C sdks/go">
<meta name="go-source" content="maya2c.dev/sdk https://github.com/EricWijesinghe/Maya2C https://github.com/EricWijesinghe/Maya2C/tree/master/sdks/go{/dir} https://github.com/EricWijesinghe/Maya2C/blob/master/sdks/go{/dir}/{file}#L{line}">
<meta http-equiv="refresh" content="0; url=https://github.com/EricWijesinghe/Maya2C/tree/master/sdks/go">
<title>maya2c.dev/sdk</title>
</head>
<body>
<p><code>go get maya2c.dev/sdk</code> (Go 1.25 or later). Source:
<a href="https://github.com/EricWijesinghe/Maya2C/tree/master/sdks/go">sdks/go</a>.</p>
</body>
</html>
