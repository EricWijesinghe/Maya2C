<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="Maya2C" width="560" height="160">
  <title>Maya2C</title>
  <defs>
    <linearGradient id="hm-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.6" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="hm-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.4" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
