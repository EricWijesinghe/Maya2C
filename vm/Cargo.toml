[package]
name = "maya-vm"
version = "0.1.0"
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish = false
edition = "2024"
rust-version = "1.88"
description = "Sandboxed, deterministic WebAssembly execution for the Maya2C chain"

[lib]
name = "maya_vm"
path = "src/lib.rs"

[dependencies]
# Deliberately NOT depending on custom-l1-node. The node depends on this crate
# to execute contracts, so the reverse would be a cycle. Chain state reaches the
# VM through the `HostState` trait instead.
thiserror = "2.0"
hex = "0.4"

# Pinned exactly, not caret. wasmtime does not guarantee stable fuel accounting
# across releases, so the version is consensus-critical: two validators on
# different wasmtime versions can compute different gas for the same call and
# disagree about whether it succeeded. Bumping this is a hard fork.
#
# default-features = false drops gc, component-model, threads, and
# stack-switching, each of which is a determinism or attack-surface liability
# in a consensus VM.
# The module cache key. Already in the tree through `archive`, `identity`
# and `rwa`; the cache needs a digest, not anything algebraic.
blake3 = "1"
wasmtime = { version = "=48.0.1", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
wat = "1"
tempfile = "3"

# What the module cache saves, measured rather than targeted. See the file
# header for why "JIT versus interpreted" is not the comparison being made.
[[bench]]
name = "module_cache"
harness = false
