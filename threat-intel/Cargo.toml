description = "Threat indicators from transferable evidence of attributable gossip offences, isolated so it can be formally verified"

# Deliberately empty, for the reason `maya-dex` is: the score, its decay and the
# length of a quarantine are what decide whether a peer is cut off by every node
# on the network, and Kani compiles a crate with its whole dependency graph.
#
# The visible cost is the same one `dex` pays. Nothing here verifies a
# signature, decodes a transaction or hashes: the node does all three in
# `src/state/threat_exec.rs`, and this crate only defines the bytes that were
# signed and what follows from evidence the node has already checked.
