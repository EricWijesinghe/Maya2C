[package]
name = "maya-neural-gas-trainer"
version.workspace = true
# Not published. See crates/stratum-v2/Cargo.toml for why cargo-deny needs this.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Synthetic demand simulator, float training and integer quantization for the fee market's neural gain"

[lib]
name = "maya_neural_gas_trainer"
path = "src/lib.rs"

[[bin]]
name = "neural-gas-trainer"
path = "src/main.rs"

# Floats live here and only here. The node depends on neither this crate nor
# `neural-fee`, the integer model it writes its weight file into (ADR-029
# amendment, 2026-11-14), so nothing computed here reaches a consensus rule —
# the arrangement `zkml-prover` has with `zkml` (invariant 20).
[dependencies]
maya-fee-market = { path = "../../crates/fee-market" }
maya-neural-fee = { path = "../../crates/neural-fee" }

[lints]
workspace = true
