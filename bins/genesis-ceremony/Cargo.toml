[package]
name = "genesis-ceremony"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
description = "The multi-party genesis key ceremony"

# A binary package rather than a `[[bin]]` of `crates/node`, because the
# foundation brief puts executables in `bins/`. It links the node as a library
# and uses nothing that is not part of that library's public surface — which is
# what made the split possible without widening the API.
[dependencies]
# Amounts are 256-bit (ADR-046), the node's U256.
primitive-types.workspace = true
custom-l1-node = { path = "../../crates/node" }
# Only to ask whether the shielded circuit is audited (ADR-037).
maya-zk-stark = { path = "../../crates/zk-stark" }
hex.workspace = true
blake3.workspace = true
# Reads the `--mining` parameters file (ADR-044).
serde_json.workspace = true
# Council keys are sealed with the validator-key format (ADR-049, ADR-050).
maya-signer = { path = "../../crates/signer" }
zeroize.workspace = true

[[bin]]
name = "genesis-ceremony"
path = "src/main.rs"

[lints]
workspace = true
