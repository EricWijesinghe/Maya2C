[package]
name = "maya2c-cli"
version.workspace = true
# Not published. See crates/fee-market/Cargo.toml for why cargo-deny needs this.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "maya2c: the developer CLI - dev chain, time-travel debugger, replay, fork (Master Prompt 24)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "maya2c"
path = "src/main.rs"

[dependencies]
maya-vm = { path = "../../crates/vm" }
# `maya2c dev`: transaction construction and the wallet's keystore and RPC
# client, so a dev deploy is exactly what a real one is.
custom-l1-node = { path = "../../crates/node" }
l1-wallet = { path = "../l1-wallet" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
serde_json.workspace = true
# `maya2c vault`: the node's `vault_get`, which the wallet client lacks.
jsonrpsee = { workspace = true, features = ["http-client"] }
clap = { workspace = true, features = ["derive"] }
anyhow = "1"
hex.workspace = true
# `lines`: DWARF line tables from a contract's custom sections, and the code
# section's position - the versions wasmtime already brings.
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
wasmparser = { version = "0.258", default-features = false, features = ["std"] }
# `maya2c custody-report`: a statement's canonical JSON and its digest.
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true

[dev-dependencies]
wat.workspace = true
tempfile.workspace = true

[lints]
workspace = true
