[package]
name = "maya2c-cli"
version.workspace = true
# Not published. See crates/fee-market/Cargo.toml for why cargo-deny needs this.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "maya2c: the developer CLI - dev chain, time-travel debugger, replay, fork (Master Prompt 24)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "maya2c"
path = "src/main.rs"
required-features = ["cli"]

[features]
# The `maya2c` binary and its key- and RPC-client-holding commands (`dev`,
# `vault`, `notary`, `custody-report`). A library consumer that only replays
# or traces - the MCP server, whose ADR-084 rule is that it holds no key and
# reaches the node through one point - turns this off and links no keystore,
# no argument parser and no RPC client of this crate's own.
default = ["cli"]
cli = ["dep:l1-wallet", "dep:jsonrpsee", "dep:clap", "dep:rpassword", "custom-l1-node/default"]

[dependencies]
maya-address = { path = "../../crates/address" }
maya-vm = { path = "../../crates/vm" }
# ADR-046: money is a U256 (the node's wire amounts, decimal strings).
primitive-types.workspace = true
# `maya2c dev`: transaction construction and the wallet's keystore and RPC
# client, so a dev deploy is exactly what a real one is.
# Defaults off so a library consumer keeps its own node feature choice; `cli`
# turns them back on for the binary.
custom-l1-node = { path = "../../crates/node", default-features = false }
l1-wallet = { path = "../l1-wallet", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
serde_json.workspace = true
# `maya2c vault`: the node's `vault_get`, which the wallet client lacks.
jsonrpsee = { workspace = true, features = ["http-client"], optional = true }
clap = { workspace = true, features = ["derive"], optional = true }
anyhow = "1"
hex.workspace = true
# `lines`: DWARF line tables from a contract's custom sections, and the code
# section's position - the versions wasmtime already brings.
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
wasmparser = { version = "0.258", default-features = false, features = ["std"] }
# `maya2c custody-report`: a statement's canonical JSON and its digest.
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
# Notary file hashes (ADR-094): BLAKE3, the digest the node already uses for its own ids.
blake3.workspace = true
rpassword = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
wat.workspace = true
tempfile.workspace = true

[lints]
workspace = true
