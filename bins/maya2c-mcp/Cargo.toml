[package]
name = "maya2c-mcp"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Model Context Protocol server: lets AI assistants decode transactions, review intents, explain errors and read chain state; refuses writes to any non-local node"

[dependencies]
custom-l1-node = { path = "../../crates/node", default-features = false }
maya-address = { path = "../../crates/address" }
maya-amount = { path = "../../crates/amount" }
maya-clear-sign = { path = "../../crates/clear-sign" }
primitive-types.workspace = true
serde_json.workspace = true
hex.workspace = true
# The read-only debugging tools reuse `maya2c replay` and `maya2c debug`
# through the CLI's library, rather than a second copy of either.
maya2c-cli = { path = "../maya2c-cli" }
# The replay's scratch copy: unpredictable, removed on drop.
tempfile.workspace = true

[dev-dependencies]
custom-l1-node = { path = "../../crates/node" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
