[package]
name = "l1-wallet"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

# Explicit, though cargo would auto-detect src/lib.rs: the pool service
# depends on this crate as a library, and a target that exists only by
# convention is one a future edit deletes without noticing.
[lib]
name = "l1_wallet"
path = "src/lib.rs"

[[bin]]
name = "l1-wallet"
path = "src/main.rs"

[dependencies]
custom-l1-node = { path = "../../crates/node" }
clap = { workspace = true, features = ["derive", "env"] }
jsonrpsee = { workspace = true, features = ["http-client"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
getrandom.workspace = true
argon2.workspace = true
chacha20poly1305 = "0.11"
zeroize.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
hex.workspace = true
anyhow = "1"
rpassword = "7"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
