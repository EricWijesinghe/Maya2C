[package]
name = "maya2c-node"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
description = "The validating node daemon: consensus, chain, peer-to-peer, RPC, metrics"

# A binary package rather than a `[[bin]]` of `crates/node`, because the
# foundation brief puts executables in `bins/`. It links the node as a library
# and uses nothing that is not part of that library's public surface — which is
# what made the split possible without widening the API.
[dependencies]
custom-l1-node = { path = "../../crates/node", default-features = false }
maya-archive = { path = "../../crates/archive" }
maya-zk-stark = { path = "../../crates/zk-stark" }
maya-dag-bft = { path = "../../crates/dag-bft" }
zeroize.workspace = true
jsonrpsee.workspace = true
libp2p.workspace = true
tokio.workspace = true
hex.workspace = true
serde_json.workspace = true

[features]
# Devnet default: the node's default features (the HQC dual-KEM handshake).
default = ["custom-l1-node/default"]
# The only way the mainnet binary is built (Production Standing Orders):
# `cargo build -p maya2c-node --no-default-features --features production`.
production = ["custom-l1-node/production"]

[[bin]]
name = "maya2c-node"
path = "src/main.rs"

[lints]
workspace = true
