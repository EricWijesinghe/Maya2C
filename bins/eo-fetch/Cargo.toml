[package]
name = "eo-fetch"
version.workspace = true
# Not published. See crates/fee-market/Cargo.toml for why cargo-deny needs this.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Fetches a window of Sentinel-2 L2A red/NIR pixels from public COGs by HTTP range request, for maya-eo-oracle fixtures"

# A developer tool that writes fixtures; nothing links it.
[dependencies]
anyhow = "1"
flate2 = "1"
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde_json.workspace = true

[lints]
workspace = true
