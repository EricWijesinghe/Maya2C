[package]
name = "maya-spec-ref"
version.workspace = true
# Not published. See crates/fee-market/Cargo.toml for why cargo-deny needs this.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Executable reference for spec/: the transfer state transition, state root, fee rules and transaction wire layout, written for reading rather than speed"

# The reference must share no code with the node it checks. `blake3` is the
# hash the spec names; `serde_json` writes the vectors. Nothing from
# custom-l1-node, ledger-math or maya-fee-market — a bug copied from the thing
# under test is a bug the conformance suite cannot see.
[dependencies]
blake3.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[bin]]
name = "spec-vectors"
path = "src/bin/spec-vectors.rs"
