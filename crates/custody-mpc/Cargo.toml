[package]
name = "maya-custody-mpc"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Threshold custody of a Maya2C chain key: dealerless VSS, quorum signing, and the reason this is not a threshold signature scheme"

[dependencies]
# Feature-unification point: `threshold-lattice` is RESEARCH (ADR-014) and
# forwards to the guard's `research` feature (ADR-016).
maya-build-guard = { path = "../build-guard" }
# Ristretto, for the Pedersen commitments that make the dealing verifiable.
# The same curve `maya-mev` and `maya-vrf` already use — two elliptic curves in
# one codebase is two sets of encoding rules to get right.
#
# The commitments are *perfectly hiding* and only computationally binding, which
# is the orientation a post-quantum chain needs: an adversary who breaks the
# discrete log in 2040 learns nothing about a seed committed to in 2026. See
# `src/vss.rs`.
curve25519-dalek.workspace = true
# ML-KEM-768, so a share in flight is sealed to its recipient under a
# post-quantum KEM rather than trusting the transport. Already the node's own
# p2p KEM (`src/network/pq/handshake.rs`), so this adds nothing new.
maya-crypto-pq = { path = "../crypto-pq" }
# The DEM half of that sealing, and the same AEAD the node's transport uses.
chacha20poly1305.workspace = true
# Commitments, transcripts, and the XOF that derives the second generator.
blake3.workspace = true
# SHAKE128/256 and SHA3-256 for Threshold Raccoon's XOFs, PRFs and MACs, which
# the authors' reference specifies. Only the `threshold-lattice` feature.
sha3 = { workspace = true, optional = true }
# ML-DSA-65. Only the 65 parameter set, matching the node — a compiled-in set
# is a set someone can select by accident.
fips204 = { workspace = true, features = ["default-rng"] }
# Entropy straight from the OS, the same source the node's key generation uses.
getrandom.workspace = true
zeroize = { workspace = true, features = ["derive"] }
thiserror.workspace = true

# The TLS binding for item 3 of the brief. Optional because a custodian that
# carries sealed shares on a USB stick needs the protocol and not the transport,
# and because a default-on async runtime in a custody library is a dependency
# nobody asked for.
# `time` for pq_auth's deadline: a peer that stops mid-proof must not hold a
# combiner that serves custodians one at a time.
tokio = { workspace = true, features = ["io-util", "net", "time"], optional = true }
# Default features off so the `aws-lc-rs` provider is not pulled in: it needs a
# C toolchain, and this workspace builds a static musl binary.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-pki-types = { version = "1", optional = true }

[features]
# On by default so `cargo test --workspace` actually exercises the transport
# rather than compiling a module nobody runs. `rustls` and `tokio` are already
# in this workspace's lockfile via `jsonrpsee`, so the default costs no new
# dependency.
default = ["tls"]
tls = ["dep:tokio", "dep:tokio-rustls", "dep:rustls", "dep:rustls-pki-types"]
# RESEARCH, off by default and in no default build (ADR-014). Threshold
# Raccoon (EUROCRYPT 2024), ported from the authors' reference and pinned to
# its vectors, plus a dealerless keygen that is this repository's own and not
# peer-reviewed. Its output is a Raccoon signature, which no registry suite
# verifies, so it authorises custody off chain and signs nothing on it.
threshold-lattice = ["dep:sha3", "maya-build-guard/research"]

[dev-dependencies]
hex.workspace = true
# Reads the Threshold Raccoon known-answer fixture (tests/fixtures/traccoon_kat.json).
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net", "time"] }
# Self-signed certificates for the loopback mTLS test. A dev-dependency: no
# shipped code generates a certificate.
rcgen = "0.14"

[lints]
workspace = true

# maya-build-guard has no items to use: it exists only so its features unify
# with the rest of the build and fire compile_error! (crates/build-guard).
[package.metadata.cargo-machete]
ignored = ["maya-build-guard"]
