[package]
name = "maya-ledger-math"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ledger value arithmetic, isolated so it can be formally verified"

# One dependency only, and it must stay that way: `maya-amount`, itself
# dependency-free and `no_std`, which carries the 256-bit arithmetic every
# amount uses since ADR-046 (ADR-048). Kani's graph stays all first-party.
#
# This crate exists to be model-checked. Kani compiles a crate *and its entire
# dependency graph* to a CBMC goto-binary, and it has no semantics for the C and
# C++ that `librocksdb-sys` links or for the FFI boundaries `libp2p` reaches
# through. Verifying `custom-l1-node` directly is therefore not slow, it is not
# possible; verifying a dependency-free leaf that the node calls into is.
#
# A dependency added here is a dependency added to every proof.
[dependencies]
maya-amount = { path = "../amount" }

# No `[features]` section, on purpose. The crate is `no_std` unconditionally; a
# `std` feature would be a platform the proofs could start depending on.

[lints]
workspace = true
