[package]
name = "maya-interop"
version.workspace = true
# Not published. See crates/fee-market/Cargo.toml for why cargo-deny needs this.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Interoperability without trusted bridges: Ethereum header verification, per-route value caps that grow with clean history, proof-settled intent escrow"

[dependencies]
sha3.workspace = true
# The beacon light client: SSZ is SHA-256 Merkle trees; sync-committee
# signatures are BLS12-381, verified with supranational's blst (the library
# Ethereum's own clients use).
sha2.workspace = true
blst = "0.3"

# The real-mainnet header test reads its JSON fixture.
[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
