[package]
name = "maya-dex"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Constant-product AMM and limit order book matching, isolated so it can be formally verified"

# Deliberately empty, and it must stay that way — the same rule that governs
# `maya-ledger-math`, for the same reason.
#
# Every function here decides how much value moves in a trade. That is exactly
# the class of arithmetic worth model-checking, and Kani compiles a crate
# together with its whole dependency graph. One dependency on `rocksdb` (C++),
# `libp2p`, or a proving stack and `cargo kani -p maya-dex` stops being
# possible rather than merely slow.
#
# The consequence is visible in the API: nothing here hashes, so pair and LP
# asset identifiers are *taken* as opaque 32-byte values rather than derived.
# Derivation lives in `custom-l1-node`, which already depends on BLAKE3.
[dependencies]

# No `[features]` section, on purpose. `no_std` unconditionally outside tests; a
# `std` feature would be a platform the proofs could start depending on.

[lints]
workspace = true
