[package]
name = "maya-crypto-pq"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

# Why this is a crate and not a module in `custom-l1-node::crypto`.
#
# `slh-dsa` is generic over `ParameterSet`, so its hot code monomorphizes into
# whichever crate *instantiates* it. A `[profile.dev.package.slh-dsa]` override
# — the trick that keeps `fips204` usable in dev builds — therefore does nothing
# here: it optimizes a crate that contains none of the work. Measured on a dev
# build, signing cost 4468 ms with that override in place and 140 ms once the
# instantiating crate was optimized instead.
#
# So the instantiation is confined to this crate, behind a concrete, non-generic
# API, and the root Cargo.toml optimizes *this* crate in dev. That keeps the
# node's own code unoptimized and debuggable, which is the property the root
# profile overrides exist to preserve.
[dependencies]
# Feature-unification point: `hqc` (draft standard, measured non-constant-time
# decapsulation, ADR-009) forwards to its `research` feature, so no production
# build can carry it (ADR-016).
maya-build-guard = { path = "../build-guard" }
# Pure Rust, which the infra/docker/Dockerfile's static-musl build depends on. The PQClean
# bindings (pqcrypto-sphincsplus) would add a C toolchain and an unsafe FFI
# surface to a build that currently links only RocksDB's C++ — the same trade
# that was declined for fips204.
#
# Pinned exactly. This is a release candidate on a pre-1.0 line, and it sits in
# the consensus path: a patch bump that changed an encoding would silently fork
# the chain. The pin is what makes that a build failure instead.
slh-dsa = { version = "=0.2.0-rc.5", features = ["zeroize"] }

# ML-KEM-768 (FIPS 203), the transport's key encapsulation.
#
# `ml-kem`, not `pqcrypto-kyber`: the latter implements round-3 Kyber, whose
# last release predates FIPS 203 and whose shared-secret derivation, encodings
# and key format the standard changed. It is not ML-KEM and must not be labelled
# as such. Pure Rust, for the same static-musl reason as the rest of this crate.
ml-kem = { version = "=0.3.2", features = ["getrandom", "zeroize"] }
# HQC-192 (draft FIPS 207), the transport's second key encapsulation.
#
# RustCrypto, the same organisation as `ml-kem` above, and pure Rust for the
# same static-musl reason as the rest of this crate. `pqcrypto-hqc` is PQClean
# C bindings and was excluded on that ground; `pqc-kem`'s `hqc` feature is a
# shim over liboqs, which is the same objection wearing a Rust name.
#
# Pinned exactly. This is a release candidate tracking a *draft* standard, and
# it sits under the transport: a patch bump that moved a parameter or an
# encoding would silently break every connection between mismatched nodes. The
# pin makes that a build failure. The same reasoning as `slh-dsa` above, with
# more force — FIPS 203 was final when `ml-kem` was pinned; FIPS 207 is not.
hqc-kem = { version = "=0.1.0-rc.0", optional = true }
# The RNG trait `hqc-kem` takes for key generation and encapsulation.
#
# A deliberate exception to the root manifest's rule that entropy comes straight
# from the OS rather than through an RNG trait crate. `hqc-kem` takes
# `&mut impl rand::CryptoRng`, so there is no door that skips it. `SysRng` is
# `getrandom` wearing the trait — the same source the rule prefers — so the
# exception costs a trait bound, not an entropy source.
rand = { version = "0.10", default-features = false, features = ["sys_rng"], optional = true }
# For `UnwrapErr`, which adapts the fallible OS generator to the infallible
# `CryptoRng` bound `hqc-kem` requires. See `hqc::os_rng`.
rand_core = { version = "0.10", default-features = false, optional = true }
# ML-DSA-65 and ML-DSA-87 (FIPS 204) for the suite registry — ADR-007.
#
# RustCrypto rather than `fips204` because both parameter sets must be
# available, and the brief prefers the crate whose ACVP harness is upstream.
# Pinned exactly: pre-1.0 and in the consensus path, like `slh-dsa` above.
# `default-features = false` drops `pkcs8`, which pulls a DER stack nothing here
# reads.
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "zeroize"] }
# Ed25519, devnet-only suite `0x01`. 3.0 because libp2p 0.57 already pulls it,
# so this adds no second curve25519-dalek. `pkcs8` for the key format the brief
# asks for; `verify_strict` is the only verification this crate exposes.
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize", "pkcs8", "alloc"] }
# X-Wing (ML-KEM-768 + X25519), ADR-009. The draft's construction, exactly.
# `hazmat` exposes the draft's seeded `Encaps` so entropy comes through
# `getrandom` and a failure is an error, not a panic.
x-wing = { version = "=0.1.0", features = ["zeroize", "hazmat"] }
# The DualKem combiner's KDF, ADR-009 — the hash FIPS 203 itself uses.
sha3 = { version = "0.11", default-features = false }
# Constant-time equality for every secret comparison in the suite and KEM code.
subtle = { version = "2.6", default-features = false }
# `SecretBox` for the master seed: access is an explicit `expose_secret()`,
# greppable, and the box zeroizes on drop.
secrecy = "0.10"
blake3.workspace = true
zeroize.workspace = true
getrandom.workspace = true
thiserror.workspace = true

[features]
# HQC (both the HQC-192 handshake module and the HQC-128/256 suites and the
# dual KEMs built on them). Off by default because `hqc-kem =0.1.0-rc.0`
# decapsulation measured NOT constant-time (dudect |t| = 47.5 at n = 176k on
# a clean run, ADR-009 addenda): a crate that does not ask for it cannot put HQC on a path an
# attacker can time. Nothing in the node or the transport enables it.
hqc = ["dep:hqc-kem", "dep:rand", "dep:rand_core", "maya-build-guard/research"]

[dev-dependencies]
# This crate's own tests, KATs and dudect benches do exercise HQC: the
# self-dependency turns the feature on for test builds only.
maya-crypto-pq = { path = ".", features = ["hqc"] }
# ACVP vectors are JSON; hex fields decode through `hex`.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
hex.workspace = true
# The HQC KAT PRNG is SHAKE256 over the seed, as in the reference harness.
shake = "0.1"
# Compile-time proof that secret types implement neither `Display` nor
# `Copy`: a secret that can be formatted with `{}` or copied implicitly has
# already escaped.
static_assertions = "1.1"
# Timing-leak tests for signing, verification and decapsulation (benches/dudect.rs).
dudect-bencher = "0.7"

[[bench]]
name = "dudect"
harness = false

[lints]
workspace = true

[[bench]]
name = "certificate"
harness = false
