[package]
name = "maya-amount"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "256-bit amounts (and 512-bit products) for the crates Kani proves"

# Deliberately empty, and it must stay that way: fee-market, dex and
# ledger-math depend on this crate, and Kani compiles each of them together
# with its whole dependency graph (invariants 1, 6 and 12). A dependency
# added here is a dependency added to every one of their proofs.
[dependencies]

# No `[features]` section, on purpose. The crate is `no_std` unconditionally;
# a `std` feature would be a platform the proofs could start depending on.

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
