[package]
name = "maya-archive"
version.workspace = true
# Not published. See crates/stratum-v2/Cargo.toml for why cargo-deny needs this.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Content-addressed archives (CAR v1, zstd) of historical block batches, and the stores that hold them"

[lib]
name = "maya_archive"
path = "src/lib.rs"

# Deliberately no dependency on `custom-l1-node`. This crate decodes archives a
# stranger chose, so it is kept chain-agnostic: it takes `(height, id, bytes)`
# and gives the same back, verified by content address. Tying those bytes to a
# header is the node's job (`state_pruner::cold`). That keeps the decoder
# fuzzable without RocksDB or libp2p in the graph.
[dependencies]
blake3 = "1"
# Forward-secure seals (`src/seal.rs`): SLH-DSA-SHAKE-256f from the suite
# registry, so a seal is verified by the same NIST-vectored code a
# transaction is; SHAKE256 for the one-way seed chain; zeroizing buffers for
# every seed.
maya-crypto-pq = { path = "../crypto-pq" }
sha3.workspace = true
zeroize.workspace = true
cid = "0.11"
ciborium = "0.2"
hex.workspace = true
multihash = "0.19"
# HTTP for the IPFS (kubo) API and the Arweave gateway. Blocking, because the
# stores are called from the node's archive task on a blocking thread and from
# synchronous tests. rustls over `ring` with the platform's roots: `ring`,
# `rustls` and `hyper-rustls` are already in the node's graph through
# jsonrpsee, and native roots avoid `webpki-roots`' CDLA licence.
reqwest = { workspace = true, features = ["blocking", "multipart", "rustls-tls-native-roots"] }
serde_json.workspace = true
thiserror.workspace = true
unsigned-varint = { version = "0.8", features = ["std"] }
# The DNA archive codec (`src/dna/`). Two different jobs, two crates:
# `reed-solomon-simd` is the *outer* erasure code across strands -- a lost
# strand is an erasure whose index is known -- and `reed-solomon` is the
# *inner* code that corrects substitutions inside one strand, which an
# erasure-only code cannot do. Both MIT; neither was in the lock before.
reed-solomon-simd = "3.1.0"
reed-solomon = "0.2.1"
# The C library is already linked through RocksDB's `zstd-sys`; this adds only
# the safe wrapper.
zstd = "0.13"

[dev-dependencies]
axum = { workspace = true, features = ["multipart"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
