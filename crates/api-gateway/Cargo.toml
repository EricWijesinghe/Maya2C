[package]
name = "maya-api-gateway"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "REST and GraphQL gateway in front of a Maya2C node"

[dependencies]
# The gateway talks to a node over its JSON-RPC port rather than opening the
# state database. That is what `explorer` does, and it is what lets the gateway
# be deployed on a different host from the node it serves — and what keeps
# RocksDB's C++ out of a process that terminates untrusted HTTP.
jsonrpsee = { workspace = true, features = ["http-client"] }
axum = { workspace = true, features = ["macros", "ws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tower-http = { workspace = true, features = ["trace", "limit", "cors"] }
# Per-client token buckets; see src/limit.rs for how clients are identified.
governor.workspace = true
tower_governor.workspace = true
# GraphQL. Depth and complexity limits are configured at schema build time —
# see `graphql::schema` for why that is not optional.
async-graphql = { version = "7", default-features = false }
async-graphql-axum = "7"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# The coin's decimals (ADR-068) come from the one source, not a copy here.
maya-amount = { path = "../amount" }
# Headers, CORS policy and security.txt, shared with the other HTTP services.
maya-web-security = { path = "../web-security" }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
hex.workspace = true
async-trait.workspace = true
# The `maya2c-gateway` binary (src/main.rs) only.
clap = { workspace = true, features = ["derive", "env"] }
anyhow = "1"
# OpenAPI. Annotated on the REST routes only: the node's own interface is
# JSON-RPC -- one endpoint with the method named in the body -- which OpenAPI
# cannot describe usefully. A generated client would get a single `post`
# function and no type safety.
utoipa = { version = "5", features = ["axum_extras"] }

# Event subscriptions (src/events.rs, src/webhooks.rs). Outbound webhook
# deliveries: rustls, no redirects, no proxy, and the resolved address pinned
# so the SSRF check and the connection see the same IP.
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
hmac.workspace = true
sha2.workspace = true
# The per-subscription webhook secret.
zeroize = { workspace = true, features = ["derive"] }
getrandom.workspace = true
futures-util.workspace = true

[[bin]]
name = "maya2c-gateway"
path = "src/main.rs"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
async-trait.workspace = true
# OpenAPI. Annotated on the REST routes only: the node's own interface is
# JSON-RPC -- one endpoint with the method named in the body -- which OpenAPI
# cannot describe usefully. A generated client would get a single `post`
# function and no type safety.
utoipa = { version = "5", features = ["axum_extras"] }
serde_json.workspace = true
# A WebSocket client for the event-stream tests: the version axum's `ws` uses.
tokio-tungstenite = "0.29"

[lints]
workspace = true
