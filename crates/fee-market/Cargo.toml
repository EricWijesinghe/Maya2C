[package]
name = "maya-fee-market"
version.workspace = true
# Not published. cargo-deny reads this: `allow-wildcard-paths` and
# `[licenses.private] ignore` both apply only to unpublished crates, so
# without it every internal path dependency reads as a wildcard and every
# workspace crate reads as unlicensed.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Adaptive base fee, fee split, and supply bound: a research branch, activated nowhere"

# Deliberately empty, for the same reason `maya-ledger-math`, `maya-dex` and
# `maya-governance` are: every function here decides how much value moves, and
# Kani compiles a crate together with its whole dependency graph.
[dependencies]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
